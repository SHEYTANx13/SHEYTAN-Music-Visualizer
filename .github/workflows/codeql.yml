name: codeql

# CodeQL security analysis for SHEYTAN Music Visualizer.
#
# Invocation model:
#   - push / pull_request: build-desktop.yml calls this reusable workflow
#     in the same run and collects its two per-analysis evidence artifacts.
#   - schedule / workflow_dispatch: this workflow runs independently and
#     creates exactly one user-facing artifact named log.txt.
#
# Go analysis is a manual traced build using the production-relevant
# CGO_ENABLED=1, CC=gcc and goffi_static build tag. Test-file extraction is
# explicitly ENABLED (CODEQL_EXTRACTOR_GO_OPTION_EXTRACT_TESTS=true; the
# extractor excludes *_test.go by default and run 42921967187 scanned only
# 58/102 tracked Go files with it disabled) and the live source inventory
# is logged on every run rather than hard-coding an old file count.
#
# The analyze jobs deliberately have read-only Actions permission. The
# standalone collector needs actions:write only to delete its temporary
# evidence artifacts after log.txt has been uploaded. Consequently the
# reusable-workflow caller (build-desktop.yml) must grant actions:write to
# the codeql reusable-workflow job; permissions cannot be elevated inside a
# reusable-workflow call. The analyze jobs retain their narrower permissions.

on:
  workflow_call:
    inputs:
      called:
        description: "Internal: true when build-desktop.yml aggregates this run's evidence"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * 1' # weekly, Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze_go:
    name: CodeQL Analyze (Go, manual traced build)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      CGO_ENABLED: '1'
      CC: gcc
      # Run-42921967187 coverage repair: the Go CodeQL extractor EXCLUDES
      # *_test.go by default; that run scanned only 58 of 102 tracked Go
      # files (39 test files + 4 non-test files unextracted) with tests
      # disabled. GitHub documents CODEQL_EXTRACTOR_GO_OPTION_EXTRACT_TESTS
      # for compiled-language builds; it is now explicitly true so test
      # files are extracted by the traced build. The inventory step below
      # still records the source truth, and the exact remaining
      # unextracted-file list is reconciled from the extractor output —
      # coverage claims follow the evidence, never a count target.
      CODEQL_EXTRACTOR_GO_OPTION_EXTRACT_TESTS: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap CI log directories (guaranteed evidence)
        run: bash scripts/ci/bootstrap-logs.sh

      - name: Setup Go (go.mod toolchain is the version authority)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # only build-linux/build-windows save Go caches

      # Keep the install result in a file because this block is piped to tee
      # and therefore executes in a subshell. The `||` captures the complete
      # pipefail result without allowing `set -e` to exit before it is logged.
      - name: Install Fyne native prerequisites
        run: |
          set -Eeuo pipefail
          status_file=ci-logs/prereq-status.txt
          : > "$status_file"
          pipeline_status=0
          {
            echo "=== apt-get update ==="
            if ! sudo apt-get update; then
              echo "ERROR: apt-get update failed"
              echo fail >> "$status_file"
            fi

            echo "=== apt-get install Fyne prerequisites ==="
            if ! sudo apt-get install -y --no-install-recommends \
              gcc pkg-config \
              libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxcursor-dev \
              libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev \
              libwayland-dev libxkbcommon-dev; then
              echo "ERROR: Fyne prerequisite install failed"
              echo fail >> "$status_file"
            fi

            echo "=== pkg-config modules ==="
            if pkg-config --modversion gl egl x11 xrandr xinerama xcursor xi xxf86vm wayland-client xkbcommon; then
              echo "pkg-config modules: OK"
            else
              echo "ERROR: pkg-config module check failed"
              echo fail >> "$status_file"
            fi

            echo "=== CGO compiler identity ==="
            if [ "$CGO_ENABLED" != "1" ]; then
              echo "ERROR: CGO_ENABLED must be 1 for the traced desktop build"
              echo fail >> "$status_file"
            fi
            if command -v "$CC" >/dev/null 2>&1 && "$CC" --version | sed -n '1p'; then
              echo "C compiler identity: OK ($CC)"
            else
              echo "ERROR: configured C compiler '$CC' is not executable"
              echo fail >> "$status_file"
            fi
          } 2>&1 | tee ci-logs/codeql-prereq.log || pipeline_status=$?

          if grep -q '^fail$' "$status_file" || [ "$pipeline_status" -ne 0 ]; then
            echo "ERROR: Fyne prerequisites or evidence pipeline failed"
            exit 1
          fi

      - name: Record Go source inventory (diagnostic, not an extraction claim)
        run: |
          set -Eeuo pipefail
          total_go=$(find . -type d -name vendor -prune -o -type f -name '*.go' -print | wc -l)
          test_go=$(find . -type d -name vendor -prune -o -type f -name '*_test.go' -print | wc -l)
          non_test_go=$((total_go - test_go))
          {
            echo "tracked-worktree Go source inventory (vendor directories excluded)"
            echo "go_files_total=$total_go"
            echo "go_test_files=$test_go"
            echo "go_non_test_files=$non_test_go"
            echo "CODEQL_EXTRACTOR_GO_OPTION_EXTRACT_TESTS=$CODEQL_EXTRACTOR_GO_OPTION_EXTRACT_TESTS"
            echo "Note: these are source inventory counts, not a claim that every file was extracted."
            echo "The extractor's own scanned-file count (reported during analysis) is the coverage evidence; any remaining difference must be listed file-by-file, not assumed to be tests or platform-specific."
          } | tee ci-logs/codeql-go-source-inventory.log
          find . -type d -name vendor -prune -o -type f -name '*.go' -print | sort > ci-logs/codeql-go-inventory-files.txt
          wc -l ci-logs/codeql-go-inventory-files.txt

      - name: go vet quality gate (before CodeQL tracing)
        env:
          CI_JOB_ID: analyze-go
        run: |
          set -Eeuo pipefail
          export CI_LOG_FILE="$PWD/ci-logs/codeql-go-vet.log"
          : > "$CI_LOG_FILE"
          # shellcheck source=../ci/capture.sh
          source scripts/ci/capture.sh
          rc=0
          CI_TOOL_CONTEXT="gate:codeql-pre-trace-vet (CGO_ENABLED=1 CC=gcc; go $(go version 2>/dev/null | awk '{print $3}' || echo '?'))" \
            ci_capture "$CI_JOB_ID" codeql-go-vet go vet -tags goffi_static ./... || rc=$?
          exit "$rc"

      - name: Initialize CodeQL (Go)
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: go
          build-mode: manual

      # This command runs inside CodeQL's tracing context. The environment
      # matches the production-relevant CGO/compiler/tag configuration above.
      - name: Manual traced Go build
        env:
          CI_JOB_ID: analyze-go
        run: |
          set -Eeuo pipefail
          export CI_LOG_FILE="$PWD/ci-logs/codeql-go-build.log"
          : > "$CI_LOG_FILE"
          # shellcheck source=../ci/capture.sh
          source scripts/ci/capture.sh
          rc=0
          CI_TOOL_CONTEXT="gate:codeql-traced-build (INSIDE CodeQL tracing; CGO_ENABLED=1; CC=gcc; -tags goffi_static)" \
            ci_capture "$CI_JOB_ID" codeql-go-build-traced go build -tags goffi_static ./... || rc=$?
          exit "$rc"

      - name: Perform CodeQL Analysis (Go)
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: '/language:go'

      # This status marker is deliberately before artifact upload, and uses
      # !cancelled() so it records both success and earlier failures.
      - name: Record Go analysis outcome
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          mkdir -p ci-logs
          {
            echo "analysis_job_status=$JOB_STATUS"
            if [ "$JOB_STATUS" = success ]; then
              echo "CodeQL Go analysis completed successfully."
            else
              echo "BLOCKED: CodeQL Go analysis job did not complete successfully; inspect preceding step logs."
            fi
            date -u '+recorded_utc=%Y-%m-%dT%H:%M:%SZ'
          } | tee ci-logs/codeql-go-result.log

      - name: Upload Go CodeQL log part (temporary internal artifact)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-logs-part-go-attempt${{ github.run_attempt }}
          path: ci-logs
          if-no-files-found: error

  analyze_actions:
    name: CodeQL Analyze (GitHub Actions workflows)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap CI log directories (guaranteed evidence)
        run: bash scripts/ci/bootstrap-logs.sh

      - name: Record Actions analysis configuration
        env:
          CI_JOB_ID: analyze-actions
        run: |
          set -Eeuo pipefail
          export CI_LOG_FILE="$PWD/ci-logs/codeql-actions.log"
          : > "$CI_LOG_FILE"
          # shellcheck source=../ci/capture.sh
          source scripts/ci/capture.sh
          CI_TOOL_CONTEXT="config:codeql-actions (build-mode none; workflow definitions only)" \
            ci_capture "$CI_JOB_ID" codeql-actions-config bash -c 'echo "language: actions"; echo "build-mode: none"; echo "note: workflow definitions are analyzed; no traced build is required"'

      - name: Initialize CodeQL (Actions)
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL Analysis (Actions)
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: '/language:actions'

      - name: Record Actions analysis outcome
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          mkdir -p ci-logs
          {
            echo "analysis_job_status=$JOB_STATUS"
            if [ "$JOB_STATUS" = success ]; then
              echo "CodeQL Actions analysis completed successfully."
            else
              echo "BLOCKED: CodeQL Actions analysis job did not complete successfully; inspect preceding step logs."
            fi
            date -u '+recorded_utc=%Y-%m-%dT%H:%M:%SZ'
          } | tee ci-logs/codeql-actions-result.log

      - name: Upload Actions CodeQL log part (temporary internal artifact)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-logs-part-actions-attempt${{ github.run_attempt }}
          path: ci-logs
          if-no-files-found: error

  # Only standalone schedule/dispatch runs collect here. Reusable invocations
  # are collected by build-desktop.yml, which owns the single run-level log.txt.
  collect:
    name: collect-logs (standalone CodeQL evidence)
    needs: [analyze_go, analyze_actions]
    if: ${{ always() && !cancelled() && inputs.called != true }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write # delete temporary CodeQL log parts after log.txt is uploaded
      security-events: read # best-effort code-scanning alert retrieval
    steps:
      - name: Checkout (collector source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap CI log directories (guaranteed evidence)
        run: bash scripts/ci/bootstrap-logs.sh

      - name: Setup Go (collector build only)
        id: setup_go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Download this attempt's CodeQL log parts
        id: download
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: codeql-logs-part-*-attempt${{ github.run_attempt }}
          path: ci-parts
          merge-multiple: false

      - name: Write run manifest and download diagnostics
        id: manifest
        if: ${{ !cancelled() }}
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUNNER_OS_LABEL: ${{ runner.os }}
          STARTED_AT: ${{ github.run_started_at }}
          RESULT_ANALYZE_GO: ${{ needs.analyze_go.result }}
          RESULT_ANALYZE_ACTIONS: ${{ needs.analyze_actions.result }}
        run: |
          set -Eeuo pipefail
          mkdir -p ci-parts
          {
            echo "download_outcome=${{ steps.download.outcome }}"
            echo "download_conclusion=${{ steps.download.conclusion }}"
            find ci-parts -maxdepth 4 -type f -print | sort || true
          } | tee ci-parts/download-diagnostics.txt

          # The aggregate CodeQL result (success only when BOTH analyze jobs
          # succeeded) is derived and validated inside write-manifest.py.

          # Deterministic manifest via scripts/ci/write-manifest.py (stdlib
          # json, env-only inputs, temp-file + fsync + atomic rename, self-
          # validated). Run-42376176493 repair: the jq-only writer in the
          # caller workflow produced a zero-byte manifest when jq was
          # unavailable; the same class of failure is impossible here, and
          # a missing python3 fails the step instead of leaving an empty
          # manifest behind.
          command -v python3 >/dev/null 2>&1 || {
            echo "ERROR: python3 not found on PATH — manifest cannot be written; failing closed instead of leaving an empty manifest"
            exit 127
          }
          python3 scripts/ci/write-manifest.py --profile codeql --out ci-parts/manifest.json
          echo "final manifest check: $(wc -c < ci-parts/manifest.json) bytes, path $PWD/ci-parts/manifest.json"
          test -s ci-parts/manifest.json || { echo "ERROR: manifest missing or empty after validated write (unreachable fail-closed)"; exit 1; }

      # Run even after setup/manifest failures so the attempt is recorded in
      # the job log; the report fallback below remains the recovery path.
      - name: Build collector binary
        if: ${{ !cancelled() && steps.setup_go.outcome == 'success' }}
        run: |
          set -Eeuo pipefail
          mkdir -p bin ci-logs
          build_output="$PWD/ci-logs/collector-build-output.log"
          rc=0
          if go build -trimpath -o bin/ci-log-collector ./cmd/ci-log-collector >"$build_output" 2>&1; then
            rc=0
          else
            rc=$?
          fi
          printf '%s\n' "$rc" > collector-build.rc
          {
            echo "command: go build -trimpath -o bin/ci-log-collector ./cmd/ci-log-collector"
            echo "exit_code: $rc"
            cat "$build_output" || true
            date -u '+utc=%Y-%m-%dT%H:%M:%SZ'
          } | tee ci-logs/collector-build.log
          if [ "$rc" -ne 0 ]; then
            echo "ERROR: collector build failed (rc=$rc); emergency report fallback will run."
          fi
          exit "$rc"

      - name: Run collector
        id: collector
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p ci-out
          rc=2
          if [ -x bin/ci-log-collector ] && [ -s ci-parts/manifest.json ]; then
            # Verbatim stdout/stderr capture with the ORIGINAL exit code
            # preserved (no pipeline masking), mirroring the caller
            # workflow's run-42376176493 collector-run.log contract.
            cap="$(mktemp)"
            start_utc="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            ./bin/ci-log-collector \
              --report ci-out/log.txt \
              --parts-root ci-parts \
              --manifest ci-parts/manifest.json \
              --github-repo "$GITHUB_REPOSITORY" \
              --run-id "$GITHUB_RUN_ID" \
              --attempt "$GITHUB_RUN_ATTEMPT" >"$cap" 2>&1
            rc=$?
            end_utc="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            {
              echo "command: ./bin/ci-log-collector --report ci-out/log.txt --parts-root ci-parts --manifest ci-parts/manifest.json --github-repo $GITHUB_REPOSITORY --run-id $GITHUB_RUN_ID --attempt $GITHUB_RUN_ATTEMPT"
              echo "cwd: $PWD"
              echo "manifest_path_absolute: $PWD/ci-parts/manifest.json"
              echo "manifest_bytes: $(wc -c < ci-parts/manifest.json)"
              echo "started_utc: $start_utc ended_utc: $end_utc"
              echo "collector_rc: $rc (0=complete, 1=incomplete, 2=hard error, 3=required analysis failed)"
              echo "--- collector stdout+stderr (verbatim) ---"
              cat "$cap"
            } | tee ci-logs/collector-run.log
            rm -f "$cap"
          else
            build_rc="$(cat collector-build.rc 2>/dev/null || echo unknown)"
            if [ ! -x bin/ci-log-collector ]; then
              diag="collector binary missing/not executable at $PWD/bin/ci-log-collector (build rc=$build_rc)"
            elif [ ! -e ci-parts/manifest.json ]; then
              diag="manifest file absent: $PWD/ci-parts/manifest.json (the manifest step did not create it)"
            else
              diag="manifest file EMPTY (0 bytes): $PWD/ci-parts/manifest.json (the manifest writer failed after file creation)"
            fi
            {
              echo "BLOCKED: collector cannot run — $diag"
              echo "collector_build_rc=$(cat collector-build.rc 2>/dev/null || echo unknown)"
              echo "manifest_present=$([ -s ci-parts/manifest.json ] && echo true || echo false)"
            } | tee ci-logs/collector-run.log
            rc=2
          fi
          printf '%s\n' "$rc" > collector.rc
          echo "collector exit code: $rc (0=complete, 1=incomplete, 2=hard error, 3=required analysis failed)"
          exit 0

      - name: Emergency fallback report (collector missing or report absent)
        id: fallback_report
        if: ${{ !cancelled() }}
        env:
          RESULT_ANALYZE_GO: ${{ needs.analyze_go.result }}
          RESULT_ANALYZE_ACTIONS: ${{ needs.analyze_actions.result }}
        run: |
          set -Eeuo pipefail
          if [ -s ci-out/log.txt ]; then
            echo "collector report present; emergency fallback not needed"
            exit 0
          fi

          if [ "$RESULT_ANALYZE_GO" = success ] && [ "$RESULT_ANALYZE_ACTIONS" = success ]; then
            result_codeql=success
          else
            result_codeql=failure
          fi
          reason="collector_rc=$(cat collector.rc 2>/dev/null || echo unknown); collector_build_rc=$(cat collector-build.rc 2>/dev/null || echo unknown)"

          bash scripts/ci/emergency-report.sh \
            --out ci-out/log.txt \
            --parts-root ci-parts \
            --manifest ci-parts/manifest.json \
            --reason "$reason" \
            --result-codeql "$result_codeql"
          printf 'used\n' > collector-fallback.used

      - name: Validate final log.txt before upload
        id: validate_report
        if: ${{ !cancelled() }}
        run: |
          set -Eeuo pipefail
          test -s ci-out/log.txt || { echo "ERROR: consolidated log.txt missing or empty"; exit 1; }
          file_count=$(find ci-out -mindepth 1 -maxdepth 1 -type f | wc -l)
          test "$file_count" -eq 1 || { echo "ERROR: ci-out must contain exactly one file (log.txt); found $file_count"; exit 1; }
          size=$(stat -c%s ci-out/log.txt)
          echo "log.txt validated: $size bytes"

      - name: Upload the single consolidated diagnostics artifact
        id: upload_report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: log.txt
          path: ci-out/log.txt
          if-no-files-found: error

      # Treat cleanup as part of the single-artifact contract: a failed list
      # or deletion is not silently reported as a clean run.
      - name: Delete temporary CodeQL log-part artifacts
        id: cleanup_parts
        if: ${{ !cancelled() && steps.upload_report.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT

          if ! curl -fsSL --retry 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}?per_page=100" -o "$tmp"; then
            echo "ERROR: unable to list run artifacts for temporary cleanup."
            exit 1
          fi
          jq -e '.artifacts | type == "array"' "$tmp" >/dev/null

          mapfile -t ids < <(jq -r '.artifacts[]? | select(.name | test("^codeql-logs-part-(go|actions)-attempt[0-9]+$")) | .id' "$tmp")
          cleanup_failed=0
          for id in "${ids[@]}"; do
            if [[ ! "$id" =~ ^[0-9]+$ ]]; then
              echo "ERROR: invalid artifact id returned by GitHub: $id"
              cleanup_failed=1
              continue
            fi
            url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
            if curl -fsS -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" "$url"; then
              echo "deleted temporary CodeQL artifact ${id}"
            else
              echo "ERROR: failed to delete temporary CodeQL artifact ${id}"
              cleanup_failed=1
            fi
          done

          if [ "$cleanup_failed" -ne 0 ]; then
            exit 1
          fi
          echo "temporary CodeQL artifact cleanup completed; preserved log.txt"

      - name: Fail closed after the report upload attempt
        if: ${{ !cancelled() }}
        env:
          VALIDATE_OUTCOME: ${{ steps.validate_report.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_report.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup_parts.outcome }}
        run: |
          set -Eeuo pipefail
          rc="$(cat collector.rc 2>/dev/null || echo 2)"
          if [[ ! "$rc" =~ ^[0-3]$ ]]; then
            echo "ERROR: invalid collector exit code '$rc'; treating as hard failure."
            rc=2
          fi

          fail=0
          if [ -f collector-fallback.used ]; then
            echo "EMERGENCY FALLBACK REPORT WAS USED: collector coverage is unverified."
            fail=1
          fi
          if [ "$VALIDATE_OUTCOME" != success ]; then
            echo "ERROR: report validation did not succeed (outcome=$VALIDATE_OUTCOME)."
            fail=1
          fi
          if [ "$UPLOAD_OUTCOME" != success ]; then
            echo "ERROR: log.txt artifact upload did not succeed (outcome=$UPLOAD_OUTCOME)."
            fail=1
          fi
          if [ "$CLEANUP_OUTCOME" != success ]; then
            echo "ERROR: temporary-artifact cleanup did not succeed (outcome=$CLEANUP_OUTCOME)."
            fail=1
          fi

          if [ "$rc" -ne 0 ] || [ "$fail" -ne 0 ]; then
            echo "CodeQL collector exit code: $rc (0=complete, 1=incomplete, 2=hard error, 3=required analysis failed)"
            if [ "$rc" -eq 0 ]; then rc=1; fi
            exit "$rc"
          fi
          echo "CodeQL standalone collection, report validation, upload and cleanup all succeeded."
