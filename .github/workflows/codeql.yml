name: codeql

# CodeQL security analysis for SHEYTAN Music Visualizer (Phase 1).
# Languages: go (manual build with real Fyne prerequisites) and actions
# (build-mode: none). This is a SEPARATE workflow run from build-desktop;
# its logs use a distinct artifact name and are not inputs to the
# build-desktop log collector.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1' # weekly, Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go (go matrix only)
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Fyne native prerequisites (go matrix only)
        if: matrix.language == 'go'
        run: |
          set -o pipefail
          mkdir -p ci-logs
          {
            echo "=== apt-get update ==="
            sudo apt-get update
            echo "=== apt-get install Fyne prerequisites ==="
            sudo apt-get install -y --no-install-recommends \
              gcc pkg-config \
              libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxcursor-dev \
              libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev \
              libwayland-dev libxkbcommon-dev xorg-dev
          } 2>&1 | tee ci-logs/codeql-prereq.log

      - name: go vet quality gate (before tracing, go matrix only)
        if: matrix.language == 'go'
        run: |
          set -o pipefail
          go vet ./... 2>&1 | tee ci-logs/codeql-go-vet.log

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Manual traced build (go matrix only)
        if: matrix.language == 'go' && matrix.build-mode == 'manual'
        run: |
          set -o pipefail
          go build ./... 2>&1 | tee ci-logs/codeql-go-build.log

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: '/language:${{ matrix.language }}'

      - name: Upload CodeQL log part (distinct artifact; separate workflow)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-logs-part
          path: |
            ci-logs/**
          if-no-files-found: ignore
