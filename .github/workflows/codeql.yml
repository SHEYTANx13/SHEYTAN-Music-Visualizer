# codeql.yml — CodeQL security analysis for SHEYTAN Music Visualizer.
#
# Phase 1 contract:
#   - Languages: `go` and `actions` only — no invented analysis of code that
#     does not exist in this repository.
#   - Go uses build-mode: manual so the exact Fyne/CGO compile command and
#     native prerequisites are controlled; `actions` uses build-mode: none.
#   - fail-fast: false so one analysis cannot suppress the other.
#   - Least privilege: workflow contents: read; the analyze job receives the
#     security-events: write it needs plus actions: read and contents: read.
#   - This file being present and locally validated is NOT evidence that a
#     CodeQL scan ran. Hosted status is reported separately (NOT RUN /
#     NOT OBSERVED) in ai-notes.md and the Phase 1 handoff note.
#
# Log hygiene: setup/build diagnostics are captured into ci-logs/codeql/ and
# uploaded with a distinct artifact name (codeql-logs-part). This workflow is
# a separate run from build-desktop.yml; its logs are never part of that
# workflow's consolidated report.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # weekly, Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }}, ${{ matrix.build-mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - name: Checkout (pinned, no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Go (single version authority: go.mod toolchain)"
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Fyne native build prerequisites (go leg)
        if: matrix.language == 'go'
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config \
            libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxi-dev libxxf86vm-dev \
            libwayland-dev libxkbcommon-dev xorg-dev

      - name: Quality gate — go vet (untraced, before CodeQL init)
        if: matrix.language == 'go'
        run: |
          set -eo pipefail
          go vet ./... 2>&1 | tee -a ci-logs-codeql-vet.log

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Manual traced build (go leg — real Fyne compile under tracing)
        if: matrix.language == 'go' && matrix.build-mode == 'manual'
        run: |
          set -eo pipefail
          go build ./... 2>&1 | tee -a ci-logs-codeql-build.log

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

      - name: Upload CodeQL setup/build diagnostics
        if: always()
        run: |
          mkdir -p ci-logs/codeql
          {
            echo "=== CodeQL leg: ${{ matrix.language }} / ${{ matrix.build-mode }} ==="
            echo "runner: $(uname -s -m)"
            if [ "${{ matrix.language }}" = "go" ]; then
              echo "go: $(go version 2>&1)"
              echo "gcc: $(gcc --version 2>&1 | head -1)"
            fi
            echo "--- vet log ---"
            cat ci-logs-codeql-vet.log 2>/dev/null || true
            echo "--- build log ---"
            cat ci-logs-codeql-build.log 2>/dev/null || true
          } > ci-logs/codeql/${{ matrix.language }}-setup.log 2>&1
          cat ci-logs/codeql/${{ matrix.language }}-setup.log

      - name: Upload CodeQL log part
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-logs-part
          path: ci-logs/codeql/
          if-no-files-found: warn
          overwrite: true
