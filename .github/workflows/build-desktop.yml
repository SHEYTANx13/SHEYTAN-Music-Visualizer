# build-desktop.yml — CI/build workflow for SHEYTAN Music Visualizer.
#
# Phase 1 contract: this is a CI build workflow, NOT a release pipeline.
# No automatic release/tag publication, no signing, no installers.
#
# Job topology:
#   preflight      ubuntu-24.04 — toolchain report, gofmt, tidy, tests, vet,
#                  package build, collector fixtures (compile prerequisites
#                  installed for the Fyne/CGO packages).
#   build-windows  windows-latest — UCRT64 MinGW-w64 toolchain, Windows x64
#                  app executable, --version/--self-check, portable ZIP.
#   build-linux    ubuntu-24.04 — Fyne native prerequisites, Linux x64 app
#                  executable, --version/--self-check, portable archive.
#   collect-logs   ubuntu-24.04 — if: always(); downloads namespaced log
#                  parts WITHOUT flattening, builds the deterministic
#                  consolidated report via cmd/ci-log-collector, uploads it
#                  even on red runs, then fails closed on missing sources.
#
# Concurrency decision: no automatic cancellation of in-progress runs.
# Cancelling a run would truncate its logs and prevent collect-logs from
# preserving complete evidence for that commit; queued superseding runs are
# preferred over killing evidence. Recorded per the Phase 1 contract §7.1.
#
# Artifact names are stable across reruns; log-part artifacts are re-uploaded
# with overwrite: true (supported by upload-artifact v7). Run ID and attempt
# are recorded inside the consolidated report metadata.

name: Build Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: sheytan-music-visualizer

jobs:
  # ------------------------------------------------------------------
  preflight:
    name: Preflight (Ubuntu x64 gates)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout (pinned, no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Go (single version authority: go.mod toolchain)"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Fyne native build prerequisites
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config \
            libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxi-dev libxxf86vm-dev \
            libwayland-dev libxkbcommon-dev xorg-dev

      - name: Run local build gates (logs land in ci-logs/preflight/)
        env:
          CI_JOB_NAME: preflight
        run: |
          mkdir -p ci-logs/preflight
          ./scripts/build/build-linux.sh

      - name: Upload preflight log part
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preflight-logs-part
          path: ci-logs/preflight/
          if-no-files-found: error
          overwrite: true

  # ------------------------------------------------------------------
  build-windows:
    name: Windows x64 (UCRT64)
    runs-on: windows-latest
    needs: [preflight]
    timeout-minutes: 40
    steps:
      - name: Checkout (pinned, no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Go (single version authority: go.mod toolchain)"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up MSYS2 UCRT64 (never deprecated MINGW64)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2 series (verified v2.33.0)
        with:
          msystem: UCRT64
          update: false
          release: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkg-config

      - name: Confirm UCRT64 compiler selection
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-logs/windows | Out-Null
          $ucrt64 = Join-Path $env:RUNNER_TEMP 'msys64\ucrt64\bin'
          Write-Host "UCRT64 bin: $ucrt64"
          if (-not (Test-Path $ucrt64)) { Write-Error "UCRT64 bin directory not found: $ucrt64"; exit 1 }
          & (Join-Path $ucrt64 'gcc.exe') --version
          & (Join-Path $ucrt64 'pkg-config.exe') --version

      - name: Run Windows build gates
        shell: pwsh
        run: ./scripts/build/build-windows.ps1 -Msys2Bin (Join-Path $env:RUNNER_TEMP 'msys64\ucrt64\bin')

      - name: Stage portable app folder (no installer, no signing in Phase 1)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'dist\sheytan-music-visualizer-windows-x64-portable'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'dist\sheytan-music-visualizer-windows-x64.exe' $stage
          Copy-Item 'license.md','readme.md' $stage
          Get-ChildItem $stage | Format-Table Name,Length

      - name: Validate executable format and ZIP contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'dist\sheytan-music-visualizer-windows-x64.exe'
          $item = Get-Item $exe
          if ($item.Length -lt 5MB) { Write-Error "unexpected small executable: $($_)"; exit 1 }
          $fs = [IO.File]::OpenRead($item.FullName)
          $magic = New-Object byte[] 2
          [void]$fs.Read($magic, 0, 2); $fs.Close()
          if ([Text.Encoding]::ASCII.GetString($magic) -ne 'MZ') { Write-Error 'not a PE executable'; exit 1 }
          Compress-Archive -Path 'dist\sheytan-music-visualizer-windows-x64-portable\*' -DestinationPath 'dist\sheytan-music-visualizer-windows-x64-portable.zip' -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path 'dist\sheytan-music-visualizer-windows-x64-portable.zip'))
          Write-Host "ZIP entries: $($zip.Entries.Count)"
          if ($zip.Entries.Count -lt 3) { $zip.Dispose(); Write-Error 'portable ZIP unexpectedly small'; exit 1 }
          $zip.Dispose()

      - name: Upload Windows x64 CI build artifact (not a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sheytan-music-visualizer-windows-x64-ci
          path: dist/sheytan-music-visualizer-windows-x64-portable.zip
          if-no-files-found: warn
          overwrite: true

      - name: Upload Windows log part
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-logs-part
          path: ci-logs/windows/
          if-no-files-found: error
          overwrite: true

  # ------------------------------------------------------------------
  build-linux:
    name: Linux x64 (Fyne native)
    runs-on: ubuntu-24.04
    needs: [preflight]
    timeout-minutes: 25
    steps:
      - name: Checkout (pinned, no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Go (single version authority: go.mod toolchain)"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Fyne native build prerequisites
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config zip \
            libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxi-dev libxxf86vm-dev \
            libwayland-dev libxkbcommon-dev xorg-dev

      - name: Run Linux build gates (logs land in ci-logs/linux/)
        env:
          CI_JOB_NAME: linux
        run: |
          mkdir -p ci-logs/linux
          ./scripts/build/build-linux.sh

      - name: Stage portable app folder
        run: |
          set -e
          mkdir -p dist/sheytan-music-visualizer-linux-x64-portable
          cp dist/sheytan-music-visualizer-linux-x64 dist/sheytan-music-visualizer-linux-x64-portable/
          cp license.md readme.md dist/sheytan-music-visualizer-linux-x64-portable/
          head -c4 dist/sheytan-music-visualizer-linux-x64 | od -An -tx1 | grep -q "7f 45 4c 46"
          (cd dist/sheytan-music-visualizer-linux-x64-portable && zip -q -r ../sheytan-music-visualizer-linux-x64-portable.zip .)
          unzip -l dist/sheytan-music-visualizer-linux-x64-portable.zip

      - name: Upload Linux x64 CI build artifact (not a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sheytan-music-visualizer-linux-x64-ci
          path: dist/sheytan-music-visualizer-linux-x64-portable.zip
          if-no-files-found: warn
          overwrite: true

      - name: Upload Linux log part
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-logs-part
          path: ci-logs/linux/
          if-no-files-found: error
          overwrite: true

  # ------------------------------------------------------------------
  collect-logs:
    name: Consolidate run log (green and red runs)
    runs-on: ubuntu-24.04
    needs: [preflight, build-windows, build-linux]
    if: always()
    timeout-minutes: 15
    steps:
      - name: Checkout (pinned, no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (needed to build the collector)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Download WITHOUT merging: each artifact extracts into its own
      # namespace directory (merge-multiple: false is the documented
      # default and is stated explicitly here). Two jobs may ship
      # same-named files without collision. Download problems are
      # preserved as metadata, not allowed to abort report generation.
      - name: Download namespaced log parts
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ci-parts
          merge-multiple: false

      - name: Preserve download diagnostics
        if: always()
        run: |
          mkdir -p ci-logs/collect
          {
            echo "=== download diagnostics ==="
            echo "expected parts: preflight-logs-part windows-logs-part linux-logs-part"
            echo "--- ci-parts tree ---"
            find ci-parts -maxdepth 2 -print 2>&1 || true
          } > ci-logs/collect/download-diagnostics.log 2>&1
          cat ci-logs/collect/download-diagnostics.log

      - name: Write run manifest
        if: always()
        run: |
          cat > run-manifest.json <<EOF
          {
            "product": "SHEYTAN Music Visualizer (SHEYTAN™)",
            "workflow_file": ".github/workflows/build-desktop.yml",
            "run_id": "${GITHUB_RUN_ID}",
            "attempt": "${GITHUB_RUN_ATTEMPT}",
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "event": "${GITHUB_EVENT_NAME}",
            "runner_os": "ubuntu-24.04",
            "jobs": [
              {"name": "preflight", "result": "${{ needs.preflight.result }}", "expected_artifacts": ["preflight-logs-part"]},
              {"name": "build-windows", "result": "${{ needs.build-windows.result }}", "expected_artifacts": ["windows-logs-part"]},
              {"name": "build-linux", "result": "${{ needs.build-linux.result }}", "expected_artifacts": ["linux-logs-part"]}
            ]
          }
          EOF
          cat run-manifest.json

      - name: Run collector (report is written before any failure is raised)
        if: always()
        id: collector
        run: |
          set +e
          COLLECTOR_CMD="./ci-log-collector -manifest run-manifest.json -parts-root ci-parts -report consolidated-run-log.txt"
          go build -o ci-log-collector ./cmd/ci-log-collector > ci-logs/collect/collector-build.log 2>&1
          buildrc=$?
          rc=2
          if [ "$buildrc" -eq 0 ]; then
            $COLLECTOR_CMD > ci-logs/collect/collector-run.log 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 2 ]; then
            # Emergency fallback report: preserve run metadata, the exact
            # collector command, its exit code and output, and the download
            # diagnostics. This fallback is uploaded like the normal report
            # and the run is marked INCOMPLETE.
            {
              echo "=== EMERGENCY FALLBACK REPORT (collector could not produce the consolidated report) ==="
              echo "product: SHEYTAN Music Visualizer (SHEYTAN™)"
              echo "workflow: .github/workflows/build-desktop.yml"
              echo "run_id: ${GITHUB_RUN_ID}  attempt: ${GITHUB_RUN_ATTEMPT}"
              echo "commit: ${GITHUB_SHA}  ref: ${GITHUB_REF}  event: ${GITHUB_EVENT_NAME}"
              echo "collector command: $COLLECTOR_CMD"
              echo "collector exit code: 2 (internal failure) — coverage: INCOMPLETE"
              echo "--- collector build output ---"
              cat ci-logs/collect/collector-build.log 2>/dev/null
              echo "--- collector run output ---"
              cat ci-logs/collect/collector-run.log 2>/dev/null
              echo "--- download diagnostics ---"
              cat ci-logs/collect/download-diagnostics.log 2>/dev/null
            } > consolidated-run-log.txt 2>&1
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload consolidated report (always, even when incomplete)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consolidated-run-log
          path: consolidated-run-log.txt
          if-no-files-found: error
          overwrite: true

      - name: Enforce coverage (fail closed after the upload attempt)
        if: always()
        run: |
          rc="$(sed -n 's/^rc=//p' <<< "${{ steps.collector.outputs.rc }}")"
          rc="${rc:-2}"
          echo "collector exit code: $rc"
          if [ "$rc" -ne 0 ]; then
            echo "Log coverage INCOMPLETE or collector failed — failing the run (missing evidence is never converted into success)."
            exit "$rc"
          fi
          echo "Log coverage COMPLETE."
