name: build-desktop

# Phase 1 build/CI workflow — NOT a release pipeline.
# Triggers: push to main, pull requests to main, manual dispatch.
# No automatic release/tag publication in Phase 1.
#
# Concurrency policy: intentionally omitted. Aggressive cancellation of
# in-progress runs would risk cancelling the collect-logs job before it
# preserves the consolidated evidence; queued-run semantics with per-run
# artifact namespaces keep artifacts unambiguous. Recorded in ai-notes.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: preflight (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go (go.mod toolchain is the version authority)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Fyne native prerequisites
        run: |
          set -o pipefail
          mkdir -p ci-logs
          {
            echo "=== apt-get update ==="
            sudo apt-get update
            echo "=== apt-get install Fyne prerequisites ==="
            sudo apt-get install -y --no-install-recommends \
              gcc pkg-config \
              libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxcursor-dev \
              libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev \
              libwayland-dev libxkbcommon-dev xorg-dev
          } 2>&1 | tee ci-logs/prereq.log

      - name: Preflight gates (gofmt, tidy, test, vet, build)
        run: |
          set -o pipefail
          bash scripts/build/build-linux.sh --mode preflight 2>&1 | tee ci-logs/preflight-build.log
          rc=${PIPESTATUS[0]}
          cp ci-logs/phase1-build.log ci-logs/preflight-run.log 2>/dev/null || true
          exit "$rc"

      - name: Upload preflight log part
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preflight-logs-part
          path: |
            ci-logs/**
          if-no-files-found: error

  build-windows:
    name: build-windows (windows-latest, x64, UCRT64)
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go (go.mod toolchain is the version authority)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2 (pinned upstream commit, 2026-09-27)
        with:
          msystem: UCRT64
          update: false
          release: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Verify UCRT64 toolchain
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          {
            Write-Output "=== gcc ==="
            Get-Command gcc | Format-List Name, Source
            gcc --version | Select-Object -First 1
            Write-Output "=== pkg-config ==="
            pkg-config --version
            Write-Output "=== go env ==="
            go version
            go env GOOS GOARCH CGO_ENABLED GOTOOLCHAIN
          } 2>&1 | Tee-Object -FilePath ci-logs/windows-compiler.log

      - name: Build and verify Windows x64 desktop app
        shell: pwsh
        env:
          CGO_ENABLED: '1'
          GOOS: windows
          GOARCH: amd64
        run: |
          ./scripts/build/build-windows.ps1
          $rc = $LASTEXITCODE
          Copy-Item ci-logs/phase1-build.log ci-logs/windows-run.log
          exit $rc

      - name: Upload Windows log part
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-logs-part
          path: |
            ci-logs/**
          if-no-files-found: error

      - name: Check Windows portable build exists before upload
        shell: pwsh
        id: winbuild
        run: |
          $zip = "dist/SHEYTAN-Music-Visualizer-windows-x64-portable.zip"
          if (-not (Test-Path $zip)) {
            Write-Output "ERROR: portable build ZIP not found: $zip"
            exit 1
          }
          $size = (Get-Item $zip).Length
          Write-Output "portable ZIP size: $size bytes"
          if ($size -lt 1048576) {
            Write-Output "ERROR: portable ZIP implausibly small ($size bytes)"
            exit 1
          }

      - name: Upload Windows x64 build artifact (CI artifact, not a release)
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-portable-build
          path: dist/SHEYTAN-Music-Visualizer-windows-x64-portable.zip
          if-no-files-found: error

  build-linux:
    name: build-linux (ubuntu-24.04, x64)
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go (go.mod toolchain is the version authority)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Fyne native prerequisites
        run: |
          set -o pipefail
          mkdir -p ci-logs
          {
            echo "=== apt-get update ==="
            sudo apt-get update
            echo "=== apt-get install Fyne prerequisites ==="
            sudo apt-get install -y --no-install-recommends \
              gcc pkg-config \
              libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxcursor-dev \
              libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev \
              libwayland-dev libxkbcommon-dev xorg-dev
            echo "=== pkg-config modules ==="
            pkg-config --modversion gl egl x11 xrandr xinerama xcursor xi xxf86vm wayland-client xkbcommon
          } 2>&1 | tee ci-logs/linux-compiler.log

      - name: Build and verify Linux x64 desktop app
        run: |
          set -o pipefail
          bash scripts/build/build-linux.sh --mode desktop 2>&1 | tee ci-logs/linux-build.log
          rc=${PIPESTATUS[0]}
          cp ci-logs/phase1-build.log ci-logs/linux-run.log
          exit "$rc"

      - name: Upload Linux log part
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-logs-part
          path: |
            ci-logs/**
          if-no-files-found: error

      - name: Check Linux build exists before upload
        run: |
          test -s bin/sheytan-music-visualizer || { echo "ERROR: linux executable missing or empty"; exit 1; }
          ls -l bin/sheytan-music-visualizer

      - name: Upload Linux x64 build artifact (CI artifact, not a release)
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x64-portable-build
          path: bin/sheytan-music-visualizer
          if-no-files-found: error

  collect-logs:
    name: collect-logs (consolidated evidence)
    needs: [preflight, build-windows, build-linux]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (collector source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download log parts (namespaced, never flattened)
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ci-parts
          merge-multiple: false

      - name: Write run manifest
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          # The run start timestamp is left empty: github.run_started_at
          # exists in the live GitHub context but is rejected by the
          # actionlint schema gate, and the gate must stay clean. The
          # consolidated report carries its own accurate generation time.
          STARTED_AT: ""
          RUNNER_OS_LABEL: ${{ runner.os }}
          RESULT_PREFLIGHT: ${{ needs.preflight.result }}
          RESULT_WINDOWS: ${{ needs.build-windows.result }}
          RESULT_LINUX: ${{ needs.build-linux.result }}
        run: |
          mkdir -p ci-parts
          {
            echo "=== download step outcome: ${{ steps.download.outcome }} conclusion: ${{ steps.download.conclusion }} ==="
            ls -laR ci-parts || true
          } | tee ci-parts/download-diagnostics.txt || true
          cat > ci-parts/manifest.json <<MANIFEST
          {
            "product": "SHEYTAN Music Visualizer",
            "workflow": "build-desktop.yml",
            "run_id": "${RUN_ID}",
            "attempt": "${RUN_ATTEMPT}",
            "commit_sha": "${COMMIT_SHA}",
            "ref": "${REF}",
            "event": "${EVENT}",
            "start_time_utc": "${STARTED_AT}",
            "runner_os": "${RUNNER_OS_LABEL}",
            "jobs": [
              {"name": "preflight",     "result": "${RESULT_PREFLIGHT}", "artifact": "preflight-logs-part"},
              {"name": "build-windows", "result": "${RESULT_WINDOWS}",   "artifact": "windows-logs-part"},
              {"name": "build-linux",   "result": "${RESULT_LINUX}",     "artifact": "linux-logs-part"}
            ]
          }
          MANIFEST
          cat ci-parts/manifest.json

      - name: Build collector binary
        id: build_collector
        run: |
          set -o pipefail
          mkdir -p ci-logs
          go build -trimpath -o bin/ci-log-collector ./cmd/ci-log-collector 2>&1 | tee ci-logs/collector-build.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > collector-build.rc
          exit "$rc"

      - name: Run collector (report is written even when coverage is incomplete)
        id: run_collector
        continue-on-error: true
        run: |
          set +e
          mkdir -p ci-logs
          if [ ! -x bin/ci-log-collector ]; then
            {
              echo "EMERGENCY FALLBACK CONSOLIDATED REPORT"
              echo "The collector binary could not be built/run; this run must be treated as INCOMPLETE."
              echo "Collector build exit code: $(cat collector-build.rc 2>/dev/null || echo UNKNOWN)"
              echo "Download step outcome: ${{ steps.download.outcome }} / conclusion: ${{ steps.download.conclusion }}"
              echo "--- download diagnostics ---"
              cat ci-parts/download-diagnostics.txt 2>/dev/null || echo "(diagnostics unavailable)"
              echo "--- parts root listing ---"
              ls -laR ci-parts 2>/dev/null || echo "(parts root unavailable)"
            } > ci-logs/emergency-consolidated-report.txt
            echo "1" > collector.rc
            echo "collector did not run; emergency report written"
            exit 0
          fi
          ./bin/ci-log-collector \
            --report ci-logs/consolidated-run-report.txt \
            --parts-root ci-parts \
            --manifest ci-parts/manifest.json
          echo "$?" > collector.rc
          echo "collector exit code: $(cat collector.rc)"
          exit 0

      - name: Upload consolidated report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consolidated-run-log
          path: |
            ci-logs/consolidated-run-report.txt
            ci-logs/emergency-consolidated-report.txt
          if-no-files-found: error

      - name: Fail closed after the report upload attempt
        run: |
          rc="$(cat collector.rc)"
          echo "collector exit code: $rc"
          if [ "$rc" != "0" ]; then
            echo "Consolidated log coverage is INCOMPLETE or collection failed; failing this job after the report upload."
          fi
          exit "$rc"
