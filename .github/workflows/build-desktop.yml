name: build-desktop

# Desktop build/verification workflow — NOT a release pipeline.
# Triggers: push to main, pull requests to main, manual dispatch.
# No automatic release/tag publication.
#
# DAG contract (repaired for run 42026322748): preflight, build-windows,
# build-linux and the CodeQL reusable call are INDEPENDENT evidence-producing
# jobs. None of them declares a success-only `needs:` on another, so a failed
# preflight can never again suppress the Windows/Linux builds (run
# 42026322748 skipped both platform builds because of `needs: preflight`).
# Only collect-logs depends on all evidence-producing jobs, with
# `if: always() && !cancelled()`, so it consolidates evidence after any
# combination of success/failure/skipped conclusions. A failed gate inside a
# platform job does not suppress later independent gates (the gate runners
# accumulate statuses and fail once at the end); a final aggregate gate keeps
# the workflow red when a required job failed. More logs never mask errors.
#
# Bootstrap contract (fixes the run's primary root cause): every
# evidence-producing job runs scripts/ci/bootstrap-logs.sh (bash) or
# scripts/ci/Bootstrap-Logs.ps1 (Windows) IMMEDIATELY AFTER CHECKOUT, before
# any step that writes into ci-logs/. Run 42026322748 failed because the
# runner-image step teed into ci-logs/ before the directory existed
# (`tee: ci-logs/runner-image.log: No such file or directory`), the step that
# contained the only mkdir was skipped, and the always() upload then found no
# files. With the bootstrap, every job always has a non-empty
# ci-logs/bootstrap.log to upload, even when a later setup step fails
# (a setup failure additionally writes an explicit BLOCKED marker).
#
# Artifact identity: per-job log-part artifact names carry the run attempt
# (`...-logs-part-attempt${{ github.run_attempt }}`), so artifacts remain
# distinct across retries and queued runs.
#
# Final user-facing diagnostics artifact: exactly ONE artifact named
# `SHEYTAN-Music-Visualizer-all-logs.txt` containing exactly one file named
# `SHEYTAN-Music-Visualizer-all-logs.txt`. The per-job
# `*-logs-part-attempt*` artifacts are internal; the collect-logs job deletes
# them only AFTER the consolidated report is validated and uploaded
# successfully (needs `actions: write`, scoped to that job only — the reason
# is the single-artifact requirement, not a way to hide failures: the final
# job conclusion is still derived from the real build/CodeQL job results).
# If the collector binary cannot be built or hard-fails, a tested emergency
# fallback (scripts/ci/emergency-report.sh) still writes and uploads a
# truthful consolidated report, and the job then fails closed (coverage unverified).
#
# CodeQL runs as a reusable workflow called below, so same-commit CodeQL
# evidence is part of the same run and its result feeds the manifest.
# codeql.yml keeps its own schedule/dispatch triggers for standalone
# security scanning.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Serialize runs per ref to avoid concurrent cache writers, without canceling
# an active run or replacing older pending runs. queue: max keeps up to 100
# pending runs in FIFO order; additional runs are subject to GitHub's queue cap.
concurrency:
  group: build-desktop-${{ github.ref }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    # Cheap validation/metadata step. It must NOT repeat the expensive
    # work of the platform jobs: no native package setup, no tests, no
    # package builds — those run exactly once in build-linux and
    # build-windows.
    name: preflight (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # BOOTSTRAP FIRST (run 42026322748 root cause): the log directory
      # layout and a non-empty bootstrap.log exist before ANY redirection
      # into ci-logs/, so this job can never again fail because tee could
      # not open its destination, and the always() upload always has a file.
      - name: Bootstrap CI log directories (guaranteed evidence)
        run: bash scripts/ci/bootstrap-logs.sh

      # Cache policy (run 41915116613 class: concurrent setup-go jobs
      # fighting over one identical cache key / cache reservation):
      # exactly ONE Linux job (build-linux) saves the Go build cache
      # for this OS. preflight, CodeQL and collect-logs run with
      # caching DISABLED so they can never write or reserve the same
      # key. build-windows saves under a different runner OS key.
      - name: Setup Go (go.mod toolchain is the version authority)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Runner-image capture with exact pipeline status handling: the
      # bootstrap guarantees the destination directory, informational
      # lookups are guarded, and the ORIGINAL pipeline status (not tee's)
      # decides the step result via PIPESTATUS.
      - name: Record runner image (migration evidence)
        run: |
          set -Eeuo pipefail
          {
            echo "=== OS image ==="
            grep PRETTY_NAME /etc/os-release || echo "PRETTY_NAME: not present in /etc/os-release"
            uname -srm
            echo "=== runner identity (allowlisted, non-secret context only) ==="
            echo "runner_os=${RUNNER_OS:-unknown} runner_name=${RUNNER_NAME:-unknown}"
            echo "image_os=${ImageOS:-unknown} image_version=${ImageVersion:-unknown}"
            echo "job=${GITHUB_JOB:-unknown} run_id=${GITHUB_RUN_ID:-unknown} attempt=${GITHUB_RUN_ATTEMPT:-unknown}"
            echo "=== toolchain identity ==="
            go version || echo "ERROR: go not found on PATH (evidence failure)"
            echo "GOOS=$(go env GOOS 2>/dev/null || echo '?') GOARCH=$(go env GOARCH 2>/dev/null || echo '?') CGO_ENABLED=$(go env CGO_ENABLED 2>/dev/null || echo '?') GOTOOLCHAIN=$(go env GOTOOLCHAIN 2>/dev/null || echo '?')"
            gcc --version | head -1 || echo "ERROR: gcc not found on PATH"
            pkg-config --version || echo "ERROR: pkg-config not found on PATH"
            date -u '+captured_utc=%Y-%m-%dT%H:%M:%SZ'
          } | tee ci-logs/runner-image.log
          st=${PIPESTATUS[0]}
          if [ "$st" -ne 0 ]; then
            echo "ERROR: runner-image capture pipeline failed with status $st (see ci-logs/runner-image.log)"
          fi
          exit "$st"

      # Independent static gates. !cancelled() (not the default success
      # condition) so the gofmt/tidy/verify gates still run even if the
      # runner-image capture or setup-go failed — each gate is attempted
      # and reported separately by the gate runner; missing tools are
      # recorded as honest failures with their real exit codes.
      - name: Preflight gates (gofmt, tidy -diff, mod verify, docs consistency)
        if: ${{ always() && !cancelled() }}
        run: |
          set -Eeuo pipefail
          bash scripts/ci/bootstrap-logs.sh >/dev/null
          rc=0
          bash scripts/build/build-linux.sh --mode preflight 2>&1 | tee ci-logs/preflight-build.log || rc=${PIPESTATUS[0]}
          # Documentation consistency (run 42939743766 §7): canonical
          # artifact names match the workflow, local doc links resolve,
          # and no obsolete artifact names/tool versions remain in the
          # current doc text. Deterministic, no network.
          if bash scripts/ci/tests/test-docs-consistency.sh 2>&1 | tee ci-logs/docs-consistency.log; then
            echo "docs-consistency: PASS" >> ci-logs/preflight-build.log
          else
            echo "docs-consistency: FAIL" >> ci-logs/preflight-build.log
            rc=1
          fi
          exit "$rc"

      # Static workflow validation (run-42921967187 §6.D, repaired for run
      # 42939743766 §3.1/§3.2): actionlint and zizmor at PINNED versions
      # with verified upstream checksums — never mutable "latest".
      #
      # zizmor runs in ONE isolated, pinned uvx environment
      # (zizmor==1.32.0). The version check and the audit use the SAME
      # `uvx --from zizmor==1.32.0` invocation, so the interpreter that
      # reports the version is the interpreter that runs the audit. The
      # run-42939743766 defect — `pip install` into one environment while
      # `/usr/bin/python3 -m zizmor` ran in another ("No module named
      # zizmor") — is structurally impossible here: no system interpreter
      # is invoked, and a failed install/version/audit step fails the gate.
      # Online audits are disabled (deterministic, no network-dependent
      # findings); that exact limitation is documented in note.md and
      # docs/CI-DIAGNOSTICS.md.
      #
      # The THREE actionlint -ignore patterns are narrowly scoped to
      # documented compatibility exceptions, each with its official
      # reference and a one-line reason — no whole audit class is
      # suppressed:
      #  1. `queue:` under concurrency is valid per the GitHub workflow
      #     syntax docs
      #     (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency);
      #     pinned actionlint 1.7.12 predates it (proven by hosted run
      #     42921967187).
      #  2. `github.run_started_at` is a documented GitHub context property
      #     (https://docs.github.com/en/actions/reference/workflows-and-actions/context#github-context).
      #  3. The `$/` self-repository reusable-workflow call is GA on
      #     github.com since July 2026
      #     (https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows;
      #     zizmor 1.32.0 REQUIRES it via its self-repository audit), but
      #     pinned actionlint 1.7.12 does not know the syntax yet
      #     (https://github.com/rhysd/actionlint/issues/711 — open, no
      #     verified newer release exists). The ignore is pinned to THIS
      #     exact call; any other workflow-call finding still fails.
      # Every other actionlint finding and every zizmor low+ finding fails
      # this step. A NEGATIVE FIXTURE proves actionlint actually detects a
      # broken workflow, so an install failure or silent no-op can never
      # masquerade as a clean scan (run 42939743766 §3.2).
      # uv is installed through astral-sh/setup-uv pinned to its verified
      # upstream v8.2.0 commit (full 40-char SHA; reviewed release). uvx
      # then runs zizmor==1.32.0 in ONE isolated cached environment that
      # is used for BOTH the version check and the audit (§3.1). The
      # audit runs ONLINE (zizmor's documented GITHUB_TOKEN source; this
      # job inherits the workflow's contents: read — no broad
      # permission), so online-only audit units execute against this
      # public repository's action references. If the hosted environment
      # blocks an online check, zizmor's output records exactly which one
      # was unavailable and the mode is reported as partially complete,
      # never as fully green.
      - name: Install pinned uv (for the isolated zizmor environment)
        if: ${{ always() && !cancelled() }}
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.9.9'
          enable-cache: false

      - name: Static workflow validation (actionlint + zizmor, pinned, fixture-proven)
        if: ${{ always() && !cancelled() }}
        run: |
          set -Eeuo pipefail
          mkdir -p ci-logs bin-tools gate-results
          start_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          {
            echo "=== actionlint v1.7.12 (pinned, checksum-verified) ==="
            curl -fsSL -o bin-tools/actionlint.tgz \
              https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
            echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  bin-tools/actionlint.tgz" | sha256sum -c -
            tar -xzf bin-tools/actionlint.tgz -C bin-tools actionlint
            bin-tools/actionlint --version | head -1
            echo "=== uv/uvx identity (installed by the SHA-pinned setup-uv action above) ==="
            command -v uvx >/dev/null 2>&1 || { echo "ERROR: uvx not on PATH after setup-uv"; exit 1; }
            uvx --version | tee ci-logs/uv-version.txt
            UVX_PATH="$(command -v uvx)"
            echo "uvx executable path: $UVX_PATH"
            echo "=== zizmor 1.32.0 version check (SAME isolated uvx environment as the audit) ==="
            uvx --from 'zizmor==1.32.0' zizmor --version | tee ci-logs/zizmor-version.txt
            grep -q '^zizmor 1\.32\.0$' ci-logs/zizmor-version.txt || { echo "ERROR: pinned zizmor version verification failed"; exit 1; }
          } 2>&1 | tee ci-logs/workflow-static-tools.log
          st=${PIPESTATUS[0]}
          if [ "$st" -ne 0 ]; then
            echo "ERROR: static-tool installation/version verification failed (exit $st)"
            exit "$st"
          fi

          # actionlint scan (raw log kept even when empty)
          rc=0
          bin-tools/actionlint \
            -ignore 'unexpected key "queue" for "concurrency" section' \
            -ignore 'property "run_started_at" is not defined' \
            -ignore 'reusable workflow call "\$/\.github/workflows/codeql\.yml" at "uses" is not following the format' \
            > ci-logs/actionlint.log 2>&1 || rc=$?
          cat ci-logs/actionlint.log
          if [ "$rc" -ne 0 ]; then
            echo "ERROR: actionlint findings (outside the three documented compatibility ignores above)"
          fi

          # NEGATIVE FIXTURE (§3.2): a deliberately invalid workflow must
          # make actionlint exit nonzero. A tool that exits 0 on garbage is
          # broken, not clean.
          fixture_failed=0
          mkdir -p .actionlint-fixture/.github/workflows
          # (ubuntu-26.04 keeps the E-no-ubuntu-latest structural fixture
          # green; the fixture is invalid because run: and uses: collide
          # on one step, not because of the runner label.)
          printf 'on: push\njobs:\n  broken:\n    runs-on: ubuntu-26.04\n    steps:\n      - run: echo hi\n        uses: actions/checkout@v9\n' \
            > .actionlint-fixture/.github/workflows/broken.yml
          if bin-tools/actionlint .actionlint-fixture/.github/workflows/broken.yml > ci-logs/actionlint-fixture.log 2>&1; then
            echo "ERROR: actionlint accepted an INVALID workflow — the scan cannot be trusted"
            fixture_failed=1
          else
            echo "actionlint negative fixture PASSED (invalid workflow correctly rejected, exit nonzero)"
          fi
          rm -rf .actionlint-fixture

          # zizmor audit through the SAME isolated environment (§3.1).
          # ONLINE MODE: GITHUB_TOKEN (the job's own runtime-limited
          # token; this workflow grants contents: read only) enables the
          # online audit suite against this public repository's action
          # references. The token is never printed and is only consumed
          # by zizmor's documented token source.
          zrc=0
          GITHUB_TOKEN="${{ github.token }}" uvx --from 'zizmor==1.32.0' zizmor --min-severity low --min-confidence low \
            --format plain .github/workflows/ > ci-logs/zizmor.log 2>&1 || zrc=$?
          cat ci-logs/zizmor.log
          if [ "$zrc" -ne 0 ]; then
            echo "ERROR: zizmor findings at low severity or above"
          fi
          end_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          # structured result record for the collector (§4.1)
          python3 -c "import json,sys; run_id,attempt,commit,start,end,arc,zrc,fix=sys.argv[1:9]; rec={\
            'gate':'static-workflow-validation','run_id':run_id,'attempt':attempt,'commit':commit,\
            'started_utc':start,'ended_utc':end,'actionlint_exit':int(arc),'zizmor_exit':int(zrc),\
            'negative_fixture_failed':bool(int(fix)),\
            'zizmor':{'version':'1.32.0','invocation':'GITHUB_TOKEN=<github.token> uvx --from zizmor==1.32.0 zizmor --min-severity low --min-confidence low --format plain .github/workflows/','online_audits':'enabled (workflow token, contents: read; any unavailable online check is recorded from zizmor output, never labeled fully complete then)'},\
            'actionlint':{'version':'1.7.12','ignores':['unexpected key \"queue\" for \"concurrency\" section','property \"run_started_at\" is not defined','reusable workflow call \"\$/\.github/workflows/codeql\.yml\" at \"uses\" is not following the format (self-repository syntax GA 2026-07; actionlint issue #711)']},\
            'verdict':'PASS' if (int(arc)==0 and int(zrc)==0 and int(fix)==0) else 'FAIL'};\
            json.dump(rec,open('gate-results/static-workflow-validation.result.json','w'),indent=2); print(json.dumps(rec))" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$start_utc" "$end_utc" "$rc" "$zrc" "$fixture_failed" || true

          if [ "$rc" -ne 0 ] || [ "$zrc" -ne 0 ] || [ "$fixture_failed" -ne 0 ]; then exit 1; fi
          echo "workflow static validation PASSED (actionlint clean + fixture-proven, zizmor 1.32.0 clean at low+)"

      # Explicit BLOCKED marker whenever this job ends red: the report must
      # distinguish "a gate failed with records" from "gates never reached".
      # The collector derives GATES NOT REACHED from actual evidence; this
      # marker only guarantees the fact is visible in the uploaded log part.
      - name: Record setup failure as BLOCKED evidence (never silent)
        if: failure()
        run: |
          set -Eeuo pipefail
          bash scripts/ci/bootstrap-logs.sh >/dev/null 2>&1 || mkdir -p ci-logs
          {
            echo "BLOCKED marker: job ${GITHUB_JOB:-unknown} run ${GITHUB_RUN_ID:-unknown} attempt ${GITHUB_RUN_ATTEMPT:-unknown} has at least one failed step (see the failing step above)."
            echo "Captured ci-logs records remain authoritative for what ran; phases with no structured gate record are reported by the collector as GATES NOT REACHED."
            date -u '+blocked_utc=%Y-%m-%dT%H:%M:%SZ'
          } | tee ci-logs/setup-blocked.log

      - name: Upload preflight log part
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preflight-logs-part-attempt${{ github.run_attempt }}
          # The directory itself, not a glob: the bootstrap guarantees it
          # exists with at least bootstrap.log inside.
          path: ci-logs
          if-no-files-found: error

  build-windows:
    # INDEPENDENT evidence job — no `needs: preflight` (run 42026322748
    # skipped this job because a success-only dependency suppressed it).
    name: build-windows (windows-latest, x64, UCRT64)
    runs-on: windows-latest
    timeout-minutes: 40
    # REPO-ROOT CONTRACT (run 42921967187 root cause): the generated gate
    # scripts (gate-verify-build-metadata / gate-create-portable-zip /
    # gate-verify-extracted-package) dot-source repository helpers through
    # the repo root. That run's gates died on
    #   Cannot bind argument to parameter 'Path' because it is null.
    # because SHEYTAN_REPO_ROOT was never defined for the spawned gate
    # process. It is now defined here at JOB scope so every step and every
    # child process inherits it; the generated gates additionally fall back
    # to the standard GITHUB_WORKSPACE (scripts/ci/Resolve-RepoRoot.ps1),
    # so no single custom variable can ever break helper imports again.
    env:
      SHEYTAN_REPO_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap CI log directories (guaranteed evidence)
        shell: pwsh
        run: ./scripts/ci/Bootstrap-Logs.ps1

      # Windows keeps its own Go build cache: the runner OS differs
      # from the Linux jobs, so its cache key cannot collide with the
      # single Linux saver (build-linux).
      - name: Setup Go (go.mod toolchain is the version authority)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        name: Setup MSYS2 UCRT64
        id: msys2
        with:
          msystem: UCRT64
          update: false
          release: true
          path-type: minimal
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf

      # The setup-msys2 action scopes PATH changes to `shell: msys2`
      # steps; normal pwsh steps would otherwise resolve the runner's
      # preinstalled C:\mingw64 gcc and Strawberry pkg-config 0.26.
      # Prepend the UCRT64 bin directory to the runner PATH so the
      # intended toolchain is first for every following step.
      - name: Activate UCRT64 toolchain on the runner PATH
        shell: pwsh
        run: |
          $ucrt = Join-Path "${{ steps.msys2.outputs.msys2-location }}" 'ucrt64\bin'
          if (-not (Test-Path (Join-Path $ucrt 'gcc.exe'))) {
            Write-Output "ERROR: UCRT64 gcc.exe not found under $ucrt"
            exit 1
          }
          $env:PATH = "$ucrt;$env:PATH"
          Add-Content -Path $env:GITHUB_PATH -Value $ucrt
          Write-Output "UCRT64 bin prepended to PATH: $ucrt"

      # Hard toolchain gate — EXECUTED, never quoted. Run 42231355353
      # piped a bare `{ ... }` script-block literal into Tee-Object here:
      # PowerShell treats that as a VALUE, so the block's SOURCE TEXT was
      # written to windows-compiler.log, no assertion ran, $fail stayed
      # $false and the step printed PASSED (false green). The helper is
      # invoked as a FILE; its already-executed output lines (evaluated
      # gcc identity, header-aware CRT probe, pkgconf identity, Go
      # identity) are teed into the log part, and the REAL exit code —
      # captured before the cmdlets can touch $LASTEXITCODE — decides
      # the step. A script block is never piped uninvoked again.
      - name: Verify UCRT64 toolchain (identity gate)
        shell: pwsh
        run: |
          $ucrt = Join-Path "${{ steps.msys2.outputs.msys2-location }}" 'ucrt64\bin'
          $evidence = ./scripts/ci/Verify-UCRT64.ps1 -ExpectedBin $ucrt
          $rc = $LASTEXITCODE
          $evidence | Tee-Object -FilePath ci-logs/windows-compiler.log
          exit $rc

      - name: Record build date
        id: meta
        shell: pwsh
        run: |
          $d = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          "build_date=$d" >> $env:GITHUB_OUTPUT

      - name: Build and verify Windows x64 desktop app
        shell: pwsh
        env:
          CGO_ENABLED: '1'
          GOOS: windows
          GOARCH: amd64
          SHEYTAN_BUILD_COMMIT: ${{ github.sha }}
          SHEYTAN_BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          SHEYTAN_BUILT_BY: github-actions
          SHEYTAN_BUILD_VERSION: ${{ github.ref_name }}
        run: |
          ./scripts/build/build-windows.ps1
          exit $LASTEXITCODE

      # ------------------------------------------------------------------
      # CANONICAL ONE-PACKAGE CONTRACT (run 42939743766 §5, replacing the
      # run-42921967187 recovery path): there is EXACTLY ONE Windows x64
      # application artifact — SHEYTAN-Music-Visualizer-windows-x64.zip.
      # No raw EXE, no staged-folder archive, no "recovery executable",
      # no duplicate portable variant is ever uploaded. The package is
      # uploaded when it exists AND its own package gates passed:
      #   - package_status VERIFIED → the canonical package of a green run
      #   - package_status TEST_ONLY → the canonical package of a run
      #     where a non-package gate failed; the job and workflow stay red
      #     and the summary labels it TEST-ONLY
      #   - package_status UNAVAILABLE / file missing → NO package is
      #     uploaded; diagnostics only
      # Uploads use actions/upload-artifact v7 archive:false, so the
      # downloaded artifact IS the ZIP (no double-zip wrapper); the
      # artifact name is the file's basename.
      # ------------------------------------------------------------------
      - name: Decide Windows package upload (canonical, status-driven)
        id: win_package_decision
        if: always()
        shell: pwsh
        run: |
          Set-StrictMode -Version 3.0
          $status = 'UNAVAILABLE'
          $statusFile = 'ci-logs/package-status-windows.json'
          if (Test-Path $statusFile) {
            try { $status = (Get-Content $statusFile -Raw | ConvertFrom-Json).package_status } catch { $status = 'UNAVAILABLE' }
          }
          $zip = 'dist/SHEYTAN-Music-Visualizer-windows-x64.zip'
          $exists = (Test-Path -LiteralPath $zip) -and ((Get-Item -LiteralPath $zip).Length -gt 0)
          Write-Output "package_status=$status zip_exists=$exists"
          $upload = ($status -in @('VERIFIED','TEST_ONLY')) -and $exists
          if ($upload) {
            $size = (Get-Item -LiteralPath $zip).Length
            if ($size -lt 1048576) { Write-Output "ERROR: package implausibly small ($size bytes)"; $upload = $false }
            else { Write-Output "package size: $size bytes" }
          }
          if (-not $upload) {
            Write-Output "NO Windows package upload: an unusable package is never published (status=$status). Diagnostics remain available."
          }
          "package_uploaded=$(if ($upload) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          "package_status=$status" >> $env:GITHUB_OUTPUT

      - name: Upload the canonical Windows x64 package (single artifact)
        if: always() && steps.win_package_decision.outputs.package_uploaded == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/SHEYTAN-Music-Visualizer-windows-x64.zip
          archive: false
          if-no-files-found: error
          overwrite: true

      - name: Label the Windows package state in the job summary (TEST-ONLY contract)
        if: always()
        shell: pwsh
        run: |
          $status = '${{ steps.win_package_decision.outputs.package_status }}'
          $uploaded = '${{ steps.win_package_decision.outputs.package_uploaded }}'
          if ($env:GITHUB_STEP_SUMMARY) {
            if ($uploaded -eq 'true' -and $status -eq 'VERIFIED') {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Windows x64 package`n- Artifact: SHEYTAN-Music-Visualizer-windows-x64.zip (VERIFIED — every required gate passed)"
            } elseif ($uploaded -eq 'true') {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Windows x64 package`n- Artifact: SHEYTAN-Music-Visualizer-windows-x64.zip`n- **TEST-ONLY — required gates failed** (see the gate table below; the job and workflow remain red)"
            } else {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Windows x64 package`n- NOT UPLOADED (package_status=$status; an unusable package is never published)"
            }
          }

      - name: Record Windows gate table and package outcome in the job summary
        if: always()
        shell: pwsh
        run: |
          Set-StrictMode -Version 3.0
          $log = 'ci-logs/phase2-build.log'
          if (-not (Test-Path $log)) { Write-Output 'phase2-build.log absent (build step may not have started)'; exit 0 }
          $gates = @{}
          $order = @()
          foreach ($line in Get-Content $log) {
            if ($line -match '^STEP: (.+)$') { $n = $Matches[1]; if (-not $gates.ContainsKey($n)) { $order += $n; $gates[$n] = 'NOT RUN' } }
            elseif ($line -match '^EXIT_CODE: (\d+) (PASS|FAIL)$') { if ($order.Count -gt 0) { $gates[$order[-1]] = $Matches[2] } }
            elseif ($line -match '^BLOCKED: gate (\S+)') { $n = $Matches[1]; if (-not $gates.ContainsKey($n)) { $order += $n; $gates[$n] = 'BLOCKED' } }
            elseif ($line -match '^SKIPPED: gate (\S+)') { $n = $Matches[1]; if (-not $gates.ContainsKey($n)) { $order += $n; $gates[$n] = 'SKIPPED' } }
          }
          $pkgFile = 'ci-logs/package-status-windows.json'
          $pkg = if (Test-Path $pkgFile) { (Get-Content $pkgFile -Raw | ConvertFrom-Json) } else { $null }
          if ($env:GITHUB_STEP_SUMMARY) {
            {
              '### build-windows gate table'
              ''
              '| gate | result |'
              '|---|---|'
              foreach ($n in $order) { "| $n | $($gates[$n]) |" }
              ''
              if ($null -ne $pkg) {
                "package_status=$($pkg.package_status) commit_verified=$($pkg.commit_verified) (expected=$($pkg.commit_expected), observed=$($pkg.commit_observed))"
              } else {
                'package_status=NOT RECORDED (the build script did not reach the package-status step)'
              }
              'Evidence distinctions: local != hosted; software adapter != physical GPU; staged != extracted-and-verified.'
            } | ForEach-Object { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $_ }
          }

      - name: Record setup failure as BLOCKED evidence (never silent)
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          $now = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $lines = @(
            "BLOCKED marker: job $($env:GITHUB_JOB) run $($env:GITHUB_RUN_ID) attempt $($env:GITHUB_RUN_ATTEMPT) has at least one failed step (see the failing step above).",
            "Captured ci-logs records remain authoritative for what ran; phases with no structured gate record are reported by the collector as GATES NOT REACHED.",
            "blocked_utc=$now"
          )
          Add-Content -Path ci-logs/setup-blocked.log -Value $lines -Encoding utf8NoBOM
          Get-Content ci-logs/setup-blocked.log

      - name: Upload Windows log part
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-logs-part-attempt${{ github.run_attempt }}
          path: ci-logs
          if-no-files-found: error
  build-linux:
    # INDEPENDENT evidence job — no `needs: preflight`. Explicit
    # ubuntu-26.04 (deliberate stable OS choice — never an ambiguous
    # ubuntu-latest). This is the ONLY Linux job allowed to save the Go
    # build cache (see the cache-policy note above).
    name: build-linux (ubuntu-26.04, x64)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap CI log directories (guaranteed evidence)
        run: bash scripts/ci/bootstrap-logs.sh

      - name: Setup Go (go.mod toolchain is the version authority)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # Native prerequisites, installed exactly once in this job, minimal set.
      # Every install is independently status-tracked: one failed package
      # group must not mask the others, and the step exits with a real
      # failure only after recording every outcome (the tee survives and
      # the always() upload keeps the evidence).
      - name: Install Fyne native prerequisites and FFmpeg
        run: |
          set -Eeuo pipefail
          # Status tracking uses a FILE, not a shell variable: the { ... } |
          # tee pipeline runs its left side in a subshell, so a counter
          # modified there would be lost (actionlint SC2030/SC2031 — caught
          # during the run-42026322748 repair validation).
          status_file=ci-logs/prereq-status.txt
          : > "$status_file"
          {
            echo "=== OS image (ubuntu-26.04 migration evidence) ==="
            grep PRETTY_NAME /etc/os-release || echo "PRETTY_NAME: not present in /etc/os-release"
            uname -srm
            echo "=== apt-get update ==="
            if ! sudo apt-get update; then
              echo "ERROR: apt-get update failed"
              echo fail >> "$status_file"
            fi
            echo "=== apt-get install Fyne prerequisites (minimal) ==="
            if ! sudo apt-get install -y --no-install-recommends \
              gcc pkg-config \
              libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxcursor-dev \
              libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev \
              libwayland-dev libxkbcommon-dev; then
              echo "ERROR: Fyne prerequisite install failed"
              echo fail >> "$status_file"
            fi
            echo "=== distro FFmpeg for export integration tests (external to the product) ==="
            if ! sudo apt-get install -y --no-install-recommends ffmpeg; then
              echo "ERROR: FFmpeg install failed (export integration tests will report their exact missing-encoder behavior)"
              echo fail >> "$status_file"
            fi
            echo "=== virtual-display GUI smoke tooling (Xvfb + X11 inspection) ==="
            # The GUI smoke gate must be able to PROVE a mapped window, not
            # merely an alive process: xvfb provides the display, x11-utils
            # provides xdpyinfo (server readiness) and xwininfo (window map).
            if ! sudo apt-get install -y --no-install-recommends xvfb x11-utils; then
              echo "ERROR: Xvfb/x11-utils install failed (GUI smoke will be recorded BLOCKED, never passed without tooling)"
              echo fail >> "$status_file"
            fi
            echo "=== pkg-config modules ==="
            if pkg-config --modversion gl egl x11 xrandr xinerama xcursor xi xxf86vm wayland-client xkbcommon; then
              echo "pkg-config modules: OK"
            else
              echo "ERROR: pkg-config module check failed"
              echo fail >> "$status_file"
            fi
            echo "=== encoders/ffprobe availability (informational) ==="
            ffmpeg -hide_banner -encoders 2>/dev/null | grep -E "libx264|aac" | head -4 || echo "(encoder list unavailable)"
            ffprobe -version 2>/dev/null | head -1 || echo "(ffprobe unavailable)"
          } 2>&1 | tee ci-logs/linux-compiler.log
          st=${PIPESTATUS[0]}
          if grep -q '^fail$' "$status_file"; then
            echo "ERROR: one or more prerequisite installs failed (details in ci-logs/linux-compiler.log); later dependent gates will record their exact failures"
          fi
          # The pipeline itself must also have succeeded (tee write errors
          # are never masked), and install failures must fail this step —
          # but ONLY after every install outcome above was recorded.
          if grep -q '^fail$' "$status_file" || [ "$st" -ne 0 ]; then exit 1; fi
          exit 0

      - name: Install govulncheck (pinned)
        run: |
          # v1.1.4 fails to build an SSA under the go1.27 toolchain;
          # v1.9.0 is verified against this repository (0 called
          # vulnerabilities) and prints its version via -version.
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          echo "govulncheck installed:"
          govulncheck -version 2>&1 | head -4 || true

      - name: Record build date
        id: meta
        run: echo "build_date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and verify Linux x64 desktop app
        env:
          SHEYTAN_BUILD_COMMIT: ${{ github.sha }}
          SHEYTAN_BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          SHEYTAN_BUILT_BY: github-actions
          SHEYTAN_BUILD_VERSION: ${{ github.ref_name }}
        run: |
          set -o pipefail
          bash scripts/build/build-linux.sh --mode desktop 2>&1 | tee ci-logs/linux-build.log
          exit "${PIPESTATUS[0]}"

      # CANONICAL ONE-PACKAGE CONTRACT (run 42939743766 §5): exactly ONE
      # Linux x64 application artifact —
      # SHEYTAN-Music-Visualizer-linux-x64.tar.gz — uploaded when it exists
      # AND its own package gates passed (VERIFIED or TEST_ONLY per
      # ci-logs/package-status-linux.json). An unusable package is never
      # uploaded; the job stays red either way.
      - name: Decide Linux package upload (canonical, status-driven)
        id: linux_package_decision
        if: always()
        run: |
          set -Eeuo pipefail
          status=UNAVAILABLE
          if [ -s ci-logs/package-status-linux.json ]; then
            status="$(python3 -c 'import json;print(json.load(open("ci-logs/package-status-linux.json")).get("package_status","UNAVAILABLE"))' 2>/dev/null || echo UNAVAILABLE)"
          fi
          tarball=dist/SHEYTAN-Music-Visualizer-linux-x64.tar.gz
          if [ -s "$tarball" ] && { [ "$status" = "VERIFIED" ] || [ "$status" = "TEST_ONLY" ]; }; then
            size=$(stat -c%s "$tarball")
            echo "package_status=$status tarball_bytes=$size"
            if [ "$size" -lt 1048576 ]; then
              echo "ERROR: package implausibly small ($size bytes); not uploaded"
              echo "package_uploaded=false" >> "$GITHUB_OUTPUT"
            else
              echo "package_uploaded=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "package_status=$status tarball missing or invalid — NO Linux package upload (an unusable package is never published)"
            echo "package_uploaded=false" >> "$GITHUB_OUTPUT"
          fi
          echo "package_status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload the canonical Linux x64 package (single artifact)
        # The tar.gz preserves the executable bit (a plain binary upload
        # would not) and archive: false delivers the prebuilt archive
        # directly — no artifact ZIP wrapper; the artifact name is the
        # file's basename.
        if: always() && steps.linux_package_decision.outputs.package_uploaded == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/SHEYTAN-Music-Visualizer-linux-x64.tar.gz
          archive: false
          if-no-files-found: error
          overwrite: true

      - name: Label the Linux package state in the job summary (TEST-ONLY contract)
        if: always()
        run: |
          status="${{ steps.linux_package_decision.outputs.package_status }}"
          uploaded="${{ steps.linux_package_decision.outputs.package_uploaded }}"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            if [ "$uploaded" = "true" ] && [ "$status" = "VERIFIED" ]; then
              {
                echo "### Linux x64 package"
                echo "- Artifact: SHEYTAN-Music-Visualizer-linux-x64.tar.gz (VERIFIED — every required gate passed)"
              } >> "$GITHUB_STEP_SUMMARY"
            elif [ "$uploaded" = "true" ]; then
              {
                echo "### Linux x64 package"
                echo "- Artifact: SHEYTAN-Music-Visualizer-linux-x64.tar.gz"
                echo "- **TEST-ONLY — required gates failed** (see the gate table inside the consolidated report; the job and workflow remain red)"
              } >> "$GITHUB_STEP_SUMMARY"
            else
              {
                echo "### Linux x64 package"
                echo "- NOT UPLOADED (package_status=$status; an unusable package is never published)"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Record setup failure as BLOCKED evidence (never silent)
        if: failure()
        run: |
          set -Eeuo pipefail
          bash scripts/ci/bootstrap-logs.sh >/dev/null 2>&1 || mkdir -p ci-logs
          {
            echo "BLOCKED marker: job ${GITHUB_JOB:-unknown} run ${GITHUB_RUN_ID:-unknown} attempt ${GITHUB_RUN_ATTEMPT:-unknown} has at least one failed step (see the failing step above)."
            echo "Captured ci-logs records remain authoritative for what ran; phases with no structured gate record are reported by the collector as GATES NOT REACHED."
            date -u '+blocked_utc=%Y-%m-%dT%H:%M:%SZ'
          } | tee ci-logs/setup-blocked.log

      - name: Upload Linux log part
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-logs-part-attempt${{ github.run_attempt }}
          path: ci-logs
          if-no-files-found: error
  # Same-run CodeQL analysis (reusable workflow). Its `analyze` job
  # uploads a temporary codeql-logs-part-<language>-attempt* artifact
  # inside THIS run, so the collector can consolidate same-commit CodeQL
  # evidence into the single consolidated report without a second visible log artifact.
  #
  # Reusable-workflow permissions are validated against EVERY nested job,
  # even when a nested job's `if:` condition will skip it. codeql.yml's
  # standalone collect job declares actions: write for its artifact cleanup;
  # therefore this caller must grant actions: write or GitHub rejects the
  # workflow before any job starts. The called workflow must keep its
  # analyze job explicitly scoped to actions: read, contents: read and
  # security-events: write; its collect job is skipped for called: true.
  codeql:
    name: codeql (reusable analysis)
    permissions:
      actions: write
      contents: read
      security-events: write
    # Self-repository syntax (GA July 2026, GitHub docs): "$/" resolves
    # this repository at the exact running commit, so the reusable CodeQL
    # workflow can never drift from the caller's SHA. zizmor 1.32.0
    # (self-repository audit) flagged the previous "./" form.
    uses: $/.github/workflows/codeql.yml
    with:
      called: true

  collect-logs:
    name: collect-logs (single consolidated report evidence)
    # always() so a failed build/CodeQL job still yields its report;
    # !cancelled() so a user-cancelled run does not start a pointless
    # collection. `needs` guarantees every evidence-producing job has
    # reached a TERMINAL state before this job starts — the collector
    # never observes an in_progress/pending job conclusion (a defensive
    # IN_PROGRESS classification still exists in the collector).
    needs: [preflight, build-windows, build-linux, codeql]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      # actions:write is required ONLY to delete the temporary per-job
      # log-part artifacts after the consolidated report has been
      # validated and uploaded, so the run exposes exactly one
      # diagnostic artifact. It never changes job conclusions.
      actions: write
      # security-events:read lets the collector fetch open code
      # scanning alerts for the analyzed commit (best effort).
      security-events: read
    steps:
      - name: Checkout (collector source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap CI log directories (guaranteed evidence)
        run: bash scripts/ci/bootstrap-logs.sh

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # cache policy: only build-linux/build-windows save caches

      - name: Download preflight log part
        id: download_preflight
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preflight-logs-part-attempt${{ github.run_attempt }}
          path: ci-parts/preflight-logs-part-attempt${{ github.run_attempt }}

      - name: Download Windows log part
        id: download_windows
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-logs-part-attempt${{ github.run_attempt }}
          path: ci-parts/windows-logs-part-attempt${{ github.run_attempt }}

      - name: Download Linux log part
        id: download_linux
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-logs-part-attempt${{ github.run_attempt }}
          path: ci-parts/linux-logs-part-attempt${{ github.run_attempt }}

      - name: Download CodeQL Go log part
        id: download_codeql_go
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codeql-logs-part-go-attempt${{ github.run_attempt }}
          path: ci-parts/codeql-logs-part-go-attempt${{ github.run_attempt }}

      - name: Download CodeQL Actions log part
        id: download_codeql_actions
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codeql-logs-part-actions-attempt${{ github.run_attempt }}
          path: ci-parts/codeql-logs-part-actions-attempt${{ github.run_attempt }}

      - name: Write run manifest
        if: ${{ always() && !cancelled() }}
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUNNER_OS_LABEL: ${{ runner.os }}
          STARTED_AT: ${{ github.run_started_at }}
          RESULT_PREFLIGHT: ${{ needs.preflight.result }}
          RESULT_WINDOWS: ${{ needs.build-windows.result }}
          RESULT_LINUX: ${{ needs.build-linux.result }}
          RESULT_CODEQL: ${{ needs.codeql.result }}
          DOWNLOAD_PREFLIGHT: ${{ steps.download_preflight.outcome }}
          DOWNLOAD_WINDOWS: ${{ steps.download_windows.outcome }}
          DOWNLOAD_LINUX: ${{ steps.download_linux.outcome }}
          DOWNLOAD_CODEQL_GO: ${{ steps.download_codeql_go.outcome }}
          DOWNLOAD_CODEQL_ACTIONS: ${{ steps.download_codeql_actions.outcome }}
        run: |
          set -Eeuo pipefail
          mkdir -p ci-parts
          {
            echo "=== per-artifact download outcomes ==="
            echo "preflight=${DOWNLOAD_PREFLIGHT:-not-run}"
            echo "windows=${DOWNLOAD_WINDOWS:-not-run}"
            echo "linux=${DOWNLOAD_LINUX:-not-run}"
            echo "codeql-go=${DOWNLOAD_CODEQL_GO:-not-run}"
            echo "codeql-actions=${DOWNLOAD_CODEQL_ACTIONS:-not-run}"
            echo "=== downloaded evidence tree ==="
            find ci-parts -maxdepth 4 -type f -printf '%P\n' | sort || true
          } | tee ci-parts/download-diagnostics.txt
          # Deterministic manifest via scripts/ci/write-manifest.py (stdlib
          # json, env-only inputs, temp-file + fsync + atomic rename, self-
          # validated, diagnostics emitted). Run-42376176493 root cause: the
          # previous jq-only writer left a ZERO-BYTE manifest.json behind
          # when jq was unavailable on the runner (the `>` redirect creates
          # the file before jq runs), the collector's `[ -s ]` guard
          # correctly refused (rc=2), and the emergency fallback published
          # environment-derived results with coverage UNVERIFIED. jq is no
          # longer load-bearing anywhere in this step; a missing tool can
          # no longer produce a plausible-but-empty manifest.
          command -v python3 >/dev/null 2>&1 || {
            echo "ERROR: python3 not found on PATH — manifest cannot be written; failing closed instead of leaving an empty manifest"
            exit 127
          }
          python3 scripts/ci/write-manifest.py --profile caller --out ci-parts/manifest.json
          echo "final manifest check: $(wc -c < ci-parts/manifest.json) bytes, path $PWD/ci-parts/manifest.json"
          test -s ci-parts/manifest.json || { echo "ERROR: manifest missing or empty after validated write (unreachable fail-closed)"; exit 1; }

      # Run even after setup-go fails; the rc is recorded so the emergency
      # non-Go fallback can still publish a truthful report.
      - name: Build collector binary
        if: ${{ always() && !cancelled() }}
        run: |
          set -Eeuo pipefail
          mkdir -p bin ci-logs
          rc=0
          go build -trimpath -o bin/ci-log-collector ./cmd/ci-log-collector || rc=$?
          printf '%s\n' "$rc" > collector-build.rc
          {
            echo "command: go build -trimpath -o bin/ci-log-collector ./cmd/ci-log-collector"
            echo "exit_code: $rc"
            date -u '+utc=%Y-%m-%dT%H:%M:%SZ'
          } | tee ci-logs/collector-build.log
          if [ "$rc" -ne 0 ]; then
            echo "ERROR: collector binary build failed (rc=$rc); the emergency fallback path will still produce a truthful consolidated report"
          fi
          exit "$rc"

      - name: Run collector (report is written even when coverage is incomplete)
        if: ${{ always() && !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p ci-out ci-logs
          rc=2
          if [ -x bin/ci-log-collector ] && [ -s ci-parts/manifest.json ]; then
            # Verbatim stdout/stderr capture with the ORIGINAL exit code
            # preserved (no pipeline masking): collector-run.log records
            # command, cwd, absolute manifest path, byte count, UTC window
            # and rc, then the collector's own output, unmodified.
            cap="$(mktemp)"
            start_utc="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            ./bin/ci-log-collector \
              --report ci-out/SHEYTAN-Music-Visualizer-all-logs.txt \
              --parts-root ci-parts \
              --manifest ci-parts/manifest.json \
              --github-repo "${GITHUB_REPOSITORY}" \
              --run-id "${GITHUB_RUN_ID}" \
              --attempt "${GITHUB_RUN_ATTEMPT}" >"$cap" 2>&1
            rc=$?
            end_utc="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            {
              echo "command: ./bin/ci-log-collector --report ci-out/SHEYTAN-Music-Visualizer-all-logs.txt --parts-root ci-parts --manifest ci-parts/manifest.json --github-repo ${GITHUB_REPOSITORY} --run-id ${GITHUB_RUN_ID} --attempt ${GITHUB_RUN_ATTEMPT}"
              echo "cwd: $PWD"
              echo "manifest_path_absolute: $PWD/ci-parts/manifest.json"
              echo "manifest_bytes: $(wc -c < ci-parts/manifest.json)"
              echo "report_path_absolute: $PWD/ci-out/SHEYTAN-Music-Visualizer-all-logs.txt"
              echo "run_id: ${GITHUB_RUN_ID} attempt: ${GITHUB_RUN_ATTEMPT}"
              echo "started_utc: $start_utc"
              echo "ended_utc: $end_utc"
              echo "collector_rc: $rc (0=complete, 1=incomplete coverage, 2=hard error, 3=required job failed)"
              echo "--- collector stdout+stderr (verbatim) ---"
              cat "$cap"
            } | tee ci-logs/collector-run.log
            rm -f "$cap"
          else
            # Precise diagnosis instead of one combined message (the
            # run-42376176493 fallback could only say "missing or empty").
            build_rc="$(cat collector-build.rc 2>/dev/null || echo unknown)"
            if [ ! -x bin/ci-log-collector ]; then
              diag="collector binary missing/not executable at $PWD/bin/ci-log-collector (build rc=$build_rc)"
            elif [ ! -e ci-parts/manifest.json ]; then
              diag="manifest file absent: $PWD/ci-parts/manifest.json (the manifest step did not create it)"
            else
              diag="manifest file EMPTY (0 bytes): $PWD/ci-parts/manifest.json (the manifest writer failed after file creation; see manifest-diagnostics.txt)"
            fi
            {
              echo "BLOCKED: collector cannot run — $diag"
              echo "collector_build_rc=$build_rc"
              echo "the emergency fallback report step will write the consolidated report; the job still fails closed"
            } | tee ci-logs/collector-run.log
            rc=2
          fi
          echo "$rc" > collector.rc
          echo "collector exit code: $rc (0=green, 1=incomplete coverage, 3=required job failed, 2=hard error)"
          exit 0

      - name: Emergency fallback report (collector binary unavailable or hard-failed)
        if: ${{ always() && !cancelled() }}
        env:
          RESULT_PREFLIGHT: ${{ needs.preflight.result }}
          RESULT_WINDOWS: ${{ needs.build-windows.result }}
          RESULT_LINUX: ${{ needs.build-linux.result }}
          RESULT_CODEQL: ${{ needs.codeql.result }}
        run: |
          set -Eeuo pipefail
          mkdir -p ci-out ci-parts ci-logs
          if [ -s ci-out/SHEYTAN-Music-Visualizer-all-logs.txt ]; then
            echo "collector report present; emergency fallback not needed"
            exit 0
          fi
          reason="collector rc=$(cat collector.rc 2>/dev/null || echo unknown); build rc=$(cat collector-build.rc 2>/dev/null || echo unknown)"
          bash scripts/ci/emergency-report.sh \
            --out ci-out/SHEYTAN-Music-Visualizer-all-logs.txt \
            --parts-root ci-parts \
            --manifest ci-parts/manifest.json \
            --reason "$reason" \
            --result-preflight "${RESULT_PREFLIGHT:-unknown}" \
            --result-build-windows "${RESULT_WINDOWS:-unknown}" \
            --result-build-linux "${RESULT_LINUX:-unknown}" \
            --result-codeql "${RESULT_CODEQL:-unknown}"
          printf 'used\n' > collector-fallback.used

      - name: Validate the final consolidated report before upload
        id: validate_report
        if: ${{ always() && !cancelled() }}
        run: |
          set -Eeuo pipefail
          test -s ci-out/SHEYTAN-Music-Visualizer-all-logs.txt || { echo "ERROR: consolidated report missing or empty"; exit 1; }
          test "$(find ci-out -maxdepth 1 -type f | wc -l)" -eq 1 || { echo "ERROR: ci-out must contain exactly one file (the consolidated report)"; exit 1; }
          size=$(stat -c%s ci-out/SHEYTAN-Music-Visualizer-all-logs.txt)
          echo "consolidated report validated: $size bytes"
          # Direct-delivery contract: the artifact must be PLAIN TEXT —
          # never a ZIP. A ZIP signature (PK\x03\x04) here would mean
          # the consolidated report got wrapped and the direct
          # direct-download contract is broken.
          sig=$(head -c 2 ci-out/SHEYTAN-Music-Visualizer-all-logs.txt)
          if [ "$sig" = $'PK\x03\x04' ] || [ "$sig" = "PK" ]; then
            echo "ERROR: the consolidated report carries a ZIP signature — plain-text contract violated"
            exit 1
          fi
          head -3 ci-out/SHEYTAN-Music-Visualizer-all-logs.txt

      - name: Upload the single consolidated diagnostics artifact (plain text, no outer ZIP)
        id: upload_report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHEYTAN-Music-Visualizer-all-logs.txt
          path: ci-out/SHEYTAN-Music-Visualizer-all-logs.txt
          # archive: false uploads the single file DIRECTLY: the
          # downloaded artifact is plain text (UTF-8), not a
          # ZIP containing the report. Exactly one file path is supplied;
          # in this mode the artifact is named after the file's
          # basename (SHEYTAN-Music-Visualizer-all-logs.txt) and the name input is ignored.
          archive: false
          if-no-files-found: error
          overwrite: true

      - name: Record final artifact identity (upload outcome evidence)
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.upload_report.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload_report.outputs.artifact-url }}
        run: |
          set -Eeuo pipefail
          {
            echo "final consolidated artifact upload outcome:"
            echo "  artifact_id=${ARTIFACT_ID:-not-reported}"
            echo "  artifact_url=${ARTIFACT_URL:-not-reported}"
            echo "  delivery_mode=direct (archive: false; downloaded artifact is plain text)"
            date -u '+  uploaded_utc=%Y-%m-%dT%H:%M:%SZ'
          } | tee ci-logs/final-artifact.txt
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### Consolidated report"
              echo "- Artifact: SHEYTAN-Music-Visualizer-all-logs.txt (plain text, non-archived direct upload)"
              echo "- artifact id: ${ARTIFACT_ID:-not-reported}"
              echo "- [download URL](${ARTIFACT_URL:-not-reported})"
              # Gate table excerpt (run-42921967187 §5.I): surface the
              # report's own parsed gate section on the run page. The
              # report remains the authoritative, complete evidence; a
              # missing section is stated honestly instead of guessed.
              echo ""
              echo "### Gate status (excerpt from the consolidated report)"
              echo ""
              echo '```'
              if grep -q "GATE / COMMAND STATUS" ci-out/SHEYTAN-Music-Visualizer-all-logs.txt 2>/dev/null; then
                awk '/GATE \/ COMMAND STATUS/{flag=1} flag{print} /^C\. |^D\. |^E\. |^=====/ && flag && !/GATE \/ COMMAND STATUS/{if (++n>1) exit}' ci-out/SHEYTAN-Music-Visualizer-all-logs.txt | head -60
              else
                echo "(gate-status section not found in the report — see the full report for the raw evidence)"
              fi
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Delete temporary log-part artifacts (single-artifact guarantee)
        id: cleanup_artifacts
        if: ${{ always() && !cancelled() && steps.validate_report.outcome == 'success' && steps.upload_report.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cleanup_failed=0
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          if ! curl -sfL --retry 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}?per_page=100" -o "$tmp"; then
            echo "ERROR: could not list artifacts for cleanup; temporary log-part artifacts may remain visible."
            cleanup_failed=1
          elif ! jq -e '.artifacts | type == "array"' "$tmp" >/dev/null; then
            echo "ERROR: artifact-list API response was not a valid artifacts array."
            cleanup_failed=1
          else
            ids=$(jq -r '.artifacts[]? | select(.name != "SHEYTAN-Music-Visualizer-all-logs.txt") | select((.name | test("-logs-part(-attempt[0-9]+)?$")) or (.name | startswith("codeql-logs-part-")) or (.name == "consolidated-run-log")) | .id' "$tmp")
            for id in $ids; do
              url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
              if curl -sf -X DELETE \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$url"; then
                echo "deleted temporary artifact ${id}"
              else
                echo "ERROR: deleting artifact ${id} failed; it may remain visible."
                cleanup_failed=1
              fi
            done
          fi
          if [ "$cleanup_failed" -ne 0 ]; then
            : > cleanup.failed
            echo "ERROR: temporary-artifact cleanup incomplete; the final gate will fail closed."
          fi

      - name: Fail closed after the report upload attempt
        if: always()
        run: |
          rc="$(cat collector.rc 2>/dev/null || echo 2)"
          if [ -f collector-fallback.used ]; then
            echo "EMERGENCY FALLBACK REPORT WAS USED: consolidated coverage is unverified;"
            echo "the collecting job fails even though a truthful consolidated report was uploaded."
            if [ "$rc" -eq 0 ]; then rc=1; fi
          fi
          if [ -f cleanup.failed ] && [ "$rc" = "0" ]; then
            echo "Temporary artifact cleanup failed after the report upload; the single-artifact guarantee is not met."
            rc=1
          fi
          echo "collector exit code: $rc"
          if [ "$rc" != "0" ]; then
            if [ "$rc" = "3" ]; then
              echo "One or more required jobs did not succeed (see the job status table inside the consolidated report)."
            elif [ "$rc" = "1" ]; then
              echo "Consolidated log coverage is INCOMPLETE; failing this job after the report upload."
            else
              echo "Collector failed; the run must stay red."
            fi
          fi
          exit "$rc"
