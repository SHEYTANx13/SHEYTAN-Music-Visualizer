name: build

# Canonical application build/verification workflow - NOT a release
# pipeline. This file is the ONE source-of-truth build workflow,
# consolidated from the retired .github/workflows/build-desktop.yml (that
# file no longer exists; the latest-update override requires exactly one
# canonical build workflow). Triggers: push to main, pull requests to
# main, manual dispatch. No automatic release/tag publication.
#
# Run 44449832903 parse repair: that hosted run failed with
# "Unexpected symbol: '${'" on three collector download steps whose
# conditions used the malformed single-brace form
#   if: ${ always() && !cancelled() }
# (former build-desktop.yml lines 1154/1163/1172). A workflow-file parse
# failure is total: NO job ran, nothing was built, no artifact existed.
# All conditions now use either the simplest valid form
# (`if: always()`, no braces) or the exact `${{ expression }}` form.
# scripts/ci/tests/test-expression-syntax.sh reparses every workflow
# with a real YAML parser, rejects any `if:` value containing a `${`
# that is not `${{`, and negative-proves the three historical malformed
# strings; the preflight job runs that gate on every push so the defect
# class cannot return silently.
#
# DAG contract (repaired for run 42026322748; CodeQL made independent for
# run 43612608237): preflight, build-windows and build-linux are
# INDEPENDENT evidence-producing jobs. None of them declares a success-only
# `needs:` on another, so a failed
# preflight can never again suppress the Windows/Linux builds (run
# 42026322748 skipped both platform builds because of `needs: preflight`).
# Only collect-logs depends on all evidence-producing jobs, with
# `if: always() && !cancelled()`, so it consolidates evidence after any
# combination of success/failure/skipped conclusions. A failed gate inside a
# platform job does not suppress later independent gates (the gate runners
# accumulate statuses and fail once at the end); a final aggregate gate keeps
# the workflow red when a required job failed. More logs never mask errors.
#
# Bootstrap contract (fixes the run's primary root cause): every
# evidence-producing job runs scripts/ci/bootstrap-logs.sh (bash) or
# scripts/ci/Bootstrap-Logs.ps1 (Windows) IMMEDIATELY AFTER CHECKOUT, before
# any step that writes into ci-logs/. Run 42026322748 failed because the
# runner-image step teed into ci-logs/ before the directory existed
# (`tee: ci-logs/runner-image.log: No such file or directory`), the step that
# contained the only mkdir was skipped, and the always() upload then found no
# files. With the bootstrap, every job always has a non-empty
# ci-logs/bootstrap.log to upload, even when a later setup step fails
# (a setup failure additionally writes an explicit BLOCKED marker).
#
# Artifact identity: per-job log-part artifact names carry the run attempt
# (`...-logs-part-attempt${{ github.run_attempt }}`), so artifacts remain
# distinct across retries and queued runs.
#
# Final user-facing diagnostics artifact: exactly ONE artifact named
# `SHEYTAN-Music-Visualizer-all-logs.txt` containing exactly one file named
# `SHEYTAN-Music-Visualizer-all-logs.txt`. The per-job
# `*-logs-part-attempt*` artifacts are internal; the collect-logs job deletes
# them only AFTER the consolidated report is validated and uploaded
# successfully (needs `actions: write`, scoped to that job only — the reason
# is the single-artifact requirement, not a way to hide failures: the final
# job conclusion is still derived from the real build/CodeQL job results).
# If the collector binary cannot be built or hard-fails, a tested emergency
# fallback (scripts/ci/emergency-report.sh) still writes and uploads a
# truthful consolidated report, and the job then fails closed (coverage unverified).
#
# CodeQL is an INDEPENDENT workflow (.github/workflows/codeql.yml, run
# 43612608237 repair): it self-triggers on push/pull_request/schedule/
# workflow_dispatch and is no longer called from this workflow. This build
# workflow owns only its own jobs; its collector neither waits for nor
# fetches CodeQL artifacts, and CodeQL results can never gate this build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Serialize runs per ref to avoid concurrent cache writers, without canceling
# an active run or replacing older pending runs. queue: max keeps up to 100
# pending runs in FIFO order; additional runs are subject to GitHub's queue cap.
concurrency:
  group: build-${{ github.ref }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    # Cheap validation/metadata step. It must NOT repeat the expensive
    # work of the platform jobs: no native package setup, no tests, no
    # package builds — those run exactly once in build-linux and
    # build-windows.
    name: preflight (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # BOOTSTRAP FIRST (run 42026322748 root cause): the log directory
      # layout and a non-empty bootstrap.log exist before ANY redirection
      # into ci-logs/, so this job can never again fail because tee could
      # not open its destination, and the always() upload always has a file.
      - name: Bootstrap CI log directories (guaranteed evidence)
        run: bash scripts/ci/bootstrap-logs.sh

      # Cache policy (run 41915116613 class: concurrent setup-go jobs
      # fighting over one identical cache key / cache reservation):
      # exactly ONE Linux job (build-linux) saves the Go build cache
      # for this OS. preflight, CodeQL and collect-logs run with
      # caching DISABLED so they can never write or reserve the same
      # key. build-windows saves under a different runner OS key.
      - name: Setup Go (go.mod toolchain is the version authority)
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      # Run 44462492262 repair: build the canonical capture-time sanitizer
      # (cmd/cisanitize, package internal/asciilog) and export it for every
      # later step. The ASCII log contract is implemented at capture time
      # by this binary (or the scripts/ci/sanitize_bytes.py bootstrap
      # fallback resolved by scripts/ci/capture.sh) and NEVER by sed: the
      # former GNU-sed byte-class filter rejected BSD sed ("RE error:
      # invalid character range") and broke the macOS capture with empty
      # JOB/STEP/COMMAND records and exit codes 1/141.
      - name: Build sanitizer tool
        run: |
          set -Eeuo pipefail
          CI_BIN="$PWD/.ci-bin"
          mkdir -p "$CI_BIN"
          go build -o "$CI_BIN/cisanitize" ./cmd/cisanitize
          echo "CI_BIN=$CI_BIN" >> "$GITHUB_ENV"
          echo "CI_SANITIZER_BIN=$CI_BIN/cisanitize" >> "$GITHUB_ENV"
          echo "$CI_BIN" >> "$GITHUB_PATH"
          # End-to-end smoke: the tool must clamp separator runs and
          # redact a token before any producer depends on it.
          smoke="$(printf 'hello===world\nghp_ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefgh\n' | "$CI_BIN/cisanitize")"
          if [ "$smoke" != "hello==world"$'\n'"REDACTED" ]; then
            echo "ERROR: cisanitize smoke test failed (got: $smoke)"
            exit 1
          fi
          echo "cisanitize built and smoke-tested: $CI_BIN/cisanitize"

      # Runner-image capture with exact pipeline status handling: the
      # bootstrap guarantees the destination directory, informational
      # lookups are guarded, and the ORIGINAL pipeline status (not tee's)
      # decides the step result via PIPESTATUS.
      - name: Record runner image (migration evidence)
        run: |
          set -Eeuo pipefail
          {
            echo "[section] OS image"
            grep PRETTY_NAME /etc/os-release || echo "PRETTY_NAME: not present in /etc/os-release"
            uname -srm
            echo "[section] runner identity (allowlisted, non-secret context only)"
            echo "runner_os=${RUNNER_OS:-unknown} runner_name=${RUNNER_NAME:-unknown}"
            echo "image_os=${ImageOS:-unknown} image_version=${ImageVersion:-unknown}"
            echo "job=${GITHUB_JOB:-unknown} run_id=${GITHUB_RUN_ID:-unknown} attempt=${GITHUB_RUN_ATTEMPT:-unknown}"
            echo "[section] toolchain identity"
            go version || echo "ERROR: go not found on PATH (evidence failure)"
            echo "GOOS=$(go env GOOS 2>/dev/null || echo '?') GOARCH=$(go env GOARCH 2>/dev/null || echo '?') CGO_ENABLED=$(go env CGO_ENABLED 2>/dev/null || echo '?') GOTOOLCHAIN=$(go env GOTOOLCHAIN 2>/dev/null || echo '?')"
            gcc --version | head -1 || echo "ERROR: gcc not found on PATH"
            pkg-config --version || echo "ERROR: pkg-config not found on PATH"
            date -u '+captured_utc=%Y-%m-%dT%H:%M:%SZ'
          } | "$CI_BIN/cisanitize" | tee ci-logs/runner-image.log
          st=${PIPESTATUS[0]}
          if [ "$st" -ne 0 ]; then
            echo "ERROR: runner-image capture pipeline failed with status $st (see ci-logs/runner-image.log)"
          fi
          exit "$st"

      # Python CI helpers must compile with warnings promoted to errors.
      # Run 43612608237: the preflight log showed `SyntaxWarning: "\." is
      # an invalid escape sequence` from an inline python3 -c string in
      # this workflow (the escape sequences lived in the actionlint-ignore
      # text); the record writer is now scripts/ci/record-gate-result.py
      # and every scripts/ci/*.py helper is compiled under
      # -W error::SyntaxWarning here. An invalid escape or any other
      # SyntaxWarning fails this step — never ignored or suppressed.
      - name: Python CI helper syntax check (warnings are errors)
        if: ${{ always() && !cancelled() }}
        run: |
          set -Eeuo pipefail
          rc=0
          for f in scripts/ci/*.py scripts/ci/tests/*.py; do
            [ -e "$f" ] || continue
            python3 -W error::SyntaxWarning -m py_compile "$f" \
              || { echo "ERROR: python helper failed warnings-as-errors compile: $f"; rc=1; }
          done
          # The gate-record helper must also run end-to-end against a
          # synthetic invocation (proves the CLI contract preflight relies on).
          if ! python3 scripts/ci/record-gate-result.py \
              --out /tmp/record-gate-result-fixture.json \
              --run-id 43612608237 --attempt 1 \
              --commit 1acc90b044e4bc46c9dd5ee441a4a3e9cbf1c705 \
              --started 2026-11-14T00:00:00Z --ended 2026-11-14T00:01:00Z \
              --actionlint-exit 0 --zizmor-exit 0 --fixture-failed 0 >/tmp/record-gate-result-fixture.out; then
            echo "ERROR: record-gate-result.py self-test failed"
            rc=1
          fi
          grep -q '"verdict": "PASS"' /tmp/record-gate-result-fixture.json || rc=1
          rm -f /tmp/record-gate-result-fixture.json /tmp/record-gate-result-fixture.out
          exit "$rc"

      # Static fixture for the final-verdict expression repair (run
      # 43612608237 red gate): no workflow may interpolate a dynamic shell
      # variable as a needs[] map key, and every looped gate must have a
      # literal needs.<name>.result case branch. The detector is
      # negative-proven against the historical broken pattern inside the
      # test itself.
      - name: Verdict-expression fixture (needs map-key type repair)
        if: ${{ always() && !cancelled() }}
        run: |
          set -Eeuo pipefail
          bash scripts/ci/tests/test-verdict-expression.sh

      # Run 44449832903 repair gate: reparse every workflow with a real
      # YAML parser and reject the malformed single-brace `${ ... }`
      # expression form that made that hosted run fail to parse (zero
      # jobs ran). Negative-proven against the three historical
      # annotation strings; see scripts/ci/tests/test-expression-syntax.sh.
      - name: Workflow expression syntax and YAML parse gate (run 44449832903 repair)
        if: ${{ always() && !cancelled() }}
        run: |
          set -Eeuo pipefail
          bash scripts/ci/tests/test-expression-syntax.sh

      # Run 44462492262 repair (§6g): the sanitizer pipeline must be
      # portable across GNU and BSD userlands. The fixture builds the Go
      # sanitizer, proves byte-identical output with the python bootstrap
      # fallback, exercises the live ci_capture contract (exit code and
      # gate record) and asserts scripts/ci/capture.sh never invokes sed
      # (the GNU-sed byte classes were the macOS capture killer).
      - name: Sanitizer portability regression
        if: ${{ always() && !cancelled() }}
        run: |
          set -Eeuo pipefail
          bash scripts/ci/tests/test-sanitizer-portable.sh

      # Independent static gates. !cancelled() (not the default success
      # condition) so the gofmt/tidy/verify gates still run even if the
      # runner-image capture or setup-go failed — each gate is attempted
      # and reported separately by the gate runner; missing tools are
      # recorded as honest failures with their real exit codes.
      - name: Fyne removal gate (production source must stay Fyne-free)
        run: |
          set -Eeuo pipefail
          bash scripts/ci/check-no-fyne.sh 2>&1 | "$CI_BIN/cisanitize" | tee ci-logs/no-fyne-gate.log
          exit "${PIPESTATUS[0]}"

      - name: Preflight gates (gofmt, tidy -diff, mod verify, docs consistency)
        if: ${{ always() && !cancelled() }}
        run: |
          set -Eeuo pipefail
          bash scripts/ci/bootstrap-logs.sh >/dev/null
          rc=0
          bash scripts/build/build-linux.sh --mode preflight 2>&1 | "$CI_BIN/cisanitize" | tee ci-logs/preflight-build.log || rc=${PIPESTATUS[0]}
          # Documentation consistency (run 42939743766 §7): canonical
          # artifact names match the workflow, local doc links resolve,
          # and no obsolete artifact names/tool versions remain in the
          # current doc text. Deterministic, no network.
          if bash scripts/ci/tests/test-docs-consistency.sh 2>&1 | "$CI_BIN/cisanitize" | tee ci-logs/docs-consistency.log; then
            printf 'docs-consistency: PASS\n' | "$CI_BIN/cisanitize" >> ci-logs/preflight-build.log
          else
            printf 'docs-consistency: FAIL\n' | "$CI_BIN/cisanitize" >> ci-logs/preflight-build.log
            rc=1
          fi
          exit "$rc"

      # Static workflow validation (run-42921967187 §6.D, repaired for run
      # 42939743766 §3.1/§3.2): actionlint and zizmor at PINNED versions
      # with verified upstream checksums — never mutable "latest".
      #
      # zizmor runs in ONE isolated, pinned uvx environment
      # (zizmor==1.32.0). The version check and the audit use the SAME
      # `uvx --from zizmor==1.32.0` invocation, so the interpreter that
      # reports the version is the interpreter that runs the audit. The
      # run-42939743766 defect — `pip install` into one environment while
      # `/usr/bin/python3 -m zizmor` ran in another ("No module named
      # zizmor") — is structurally impossible here: no system interpreter
      # is invoked, and a failed install/version/audit step fails the gate.
      # Online audits are disabled (deterministic, no network-dependent
      # findings); that exact limitation is documented in docs/note.md and
      # docs/CI-DIAGNOSTICS.md.
      #
      # The TWO actionlint -ignore patterns are narrowly scoped to
      # documented compatibility exceptions, each with its official
      # reference and a one-line reason — no whole audit class is
      # suppressed. (A third ignore — the `$/` self-repository reusable
      # workflow call — was REMOVED in run 43612608237 when CodeQL became
      # an independent workflow and the call disappeared from this file.)
      #  1. `queue:` under concurrency is valid per the GitHub workflow
      #     syntax docs
      #     (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency);
      #     pinned actionlint 1.7.12 predates it (proven by hosted run
      #     42921967187).
      #  2. `github.run_started_at` is a documented GitHub context property
      #     (https://docs.github.com/en/actions/reference/workflows-and-actions/context#github-context).
      # Every other actionlint finding and every zizmor low+ finding fails
      # this step. A NEGATIVE FIXTURE proves actionlint actually detects a
      # broken workflow, so an install failure or silent no-op can never
      # masquerade as a clean scan (run 42939743766 §3.2).
      # uv is installed through astral-sh/setup-uv pinned to its verified
      # upstream v10.4.0 commit (full 40-char SHA; reviewed release). uvx
      # then runs zizmor==1.32.0 in ONE isolated cached environment that
      # is used for BOTH the version check and the audit (§3.1). The
      # audit runs ONLINE (zizmor's documented GITHUB_TOKEN source; this
      # job inherits the workflow's contents: read — no broad
      # permission), so online-only audit units execute against this
      # public repository's action references. If the hosted environment
      # blocks an online check, zizmor's output records exactly which one
      # was unavailable and the mode is reported as partially complete,
      # never as fully green.
      - name: Install pinned uv (for the isolated zizmor environment)
        if: ${{ always() && !cancelled() }}
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.9.9'
          enable-cache: false

      - name: Static workflow validation (actionlint + zizmor, pinned, fixture-proven)
        if: ${{ always() && !cancelled() }}
        run: |
          set -Eeuo pipefail
          mkdir -p ci-logs bin-tools gate-results
          start_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          # Run 45182658992 repair: every sub-gate error line below used to
          # be printed ONLY to the step log, so a hosted sub-gate failure
          # left the consolidated diagnostics with a bare "step conclusion
          # failure" and no origin (the observed preflight signature of
          # runs 45097038674 and 45182658992). emit_error keeps the step
          # log line AND appends the same ASCII line to
          # ci-logs/static-validation-errors.log, which travels with the
          # preflight log part into the consolidated report.
          SV_ERRLOG=ci-logs/static-validation-errors.log
          : > "$SV_ERRLOG"
          emit_error() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$SV_ERRLOG"; }
          {
            echo "[section] actionlint v1.7.12 (pinned, checksum-verified)"
            curl -fsSL -o bin-tools/actionlint.tgz \
              https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
            echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  bin-tools/actionlint.tgz" | sha256sum -c -
            tar -xzf bin-tools/actionlint.tgz -C bin-tools actionlint
            bin-tools/actionlint --version | head -1
            echo "[section] uv/uvx identity (installed by the SHA-pinned setup-uv action above)"
            command -v uvx >/dev/null 2>&1 || { echo "ERROR: uvx not on PATH after setup-uv"; exit 1; }
            uvx --version | "$CI_BIN/cisanitize" | tee ci-logs/uv-version.txt
            UVX_PATH="$(command -v uvx)"
            echo "uvx executable path: $UVX_PATH"
            echo "[section] zizmor 1.32.0 version check (SAME isolated uvx environment as the audit)"
            uvx --from 'zizmor==1.32.0' zizmor --version | "$CI_BIN/cisanitize" | tee ci-logs/zizmor-version.txt
            grep -q '^zizmor 1\.32\.0$' ci-logs/zizmor-version.txt || { echo "ERROR: pinned zizmor version verification failed"; exit 1; }
          } 2>&1 | "$CI_BIN/cisanitize" | tee ci-logs/workflow-static-tools.log
          st=${PIPESTATUS[0]}
          if [ "$st" -ne 0 ]; then
            emit_error "ERROR: static-tool installation/version verification failed (exit $st)"
            exit "$st"
          fi

          # actionlint scan (raw log kept even when empty)
          rc=0
          bin-tools/actionlint \
            -ignore 'unexpected key "queue" for "concurrency" section' \
            -ignore 'property "run_started_at" is not defined' \
            2>&1 | "$CI_BIN/cisanitize" > ci-logs/actionlint.log || rc=$?
          cat ci-logs/actionlint.log
          if [ "$rc" -ne 0 ]; then
            emit_error "ERROR: actionlint findings (outside the two documented compatibility ignores above)"
          fi

          # NEGATIVE FIXTURE (§3.2): a deliberately invalid workflow must
          # make actionlint exit nonzero. A tool that exits 0 on garbage is
          # broken, not clean.
          fixture_failed=0
          mkdir -p .actionlint-fixture/.github/workflows
          # (ubuntu-26.04 keeps the E-no-ubuntu-latest structural fixture
          # green; the fixture is invalid because run: and uses: collide
          # on one step, not because of the runner label.)
          printf 'on: push\njobs:\n  broken:\n    runs-on: ubuntu-26.04\n    steps:\n      - run: echo hi\n        uses: actions/checkout@v9\n' \
            > .actionlint-fixture/.github/workflows/broken.yml
          if bin-tools/actionlint .actionlint-fixture/.github/workflows/broken.yml 2>&1 | "$CI_BIN/cisanitize" > ci-logs/actionlint-fixture.log; then
            emit_error "ERROR: actionlint accepted an INVALID workflow - the scan cannot be trusted"
            fixture_failed=1
          else
            echo "actionlint negative fixture PASSED (invalid workflow correctly rejected, exit nonzero)"
          fi
          rm -rf .actionlint-fixture

          # zizmor audit through the SAME isolated environment (§3.1).
          # ONLINE MODE: GITHUB_TOKEN (the job's own runtime-limited
          # token; this workflow grants contents: read only) enables the
          # online audit suite against this public repository's action
          # references. The token is never printed and is only consumed
          # by zizmor's documented token source.
          zrc=0
          GITHUB_TOKEN="${{ github.token }}" uvx --from 'zizmor==1.32.0' zizmor --min-severity low --min-confidence low \
            --format plain .github/workflows/ 2>&1 | "$CI_BIN/cisanitize" > ci-logs/zizmor.log || zrc=$?
          cat ci-logs/zizmor.log
          if [ "$zrc" -ne 0 ]; then
            emit_error "ERROR: zizmor findings at low severity or above"
          fi
          end_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          # structured result record for the collector (§4.1). Factored
          # into scripts/ci/record-gate-result.py (run 43612608237): the
          # former inline `python3 -c` string quoted the actionlint ignore
          # list through a shell double-quote layer, so Python received
          # `\.`/`\/` invalid escape sequences and emitted SyntaxWarnings
          # ("\." is an invalid escape sequence). The helper is a plain
          # ASCII module, compiled with warnings-as-errors in preflight,
          # and its ignore list can never drift into an invalid escape.
          python3 scripts/ci/record-gate-result.py \
            --out gate-results/static-workflow-validation.result.json \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --commit "$GITHUB_SHA" --started "$start_utc" --ended "$end_utc" \
            --actionlint-exit "$rc" --zizmor-exit "$zrc" --fixture-failed "$fixture_failed" || true

          if [ "$rc" -ne 0 ] || [ "$zrc" -ne 0 ] || [ "$fixture_failed" -ne 0 ]; then exit 1; fi
          echo "workflow static validation PASSED (actionlint clean + fixture-proven, zizmor 1.32.0 clean at low+)"

      # Explicit BLOCKED marker whenever this job ends red: the report must
      # distinguish "a gate failed with records" from "gates never reached".
      # The collector derives GATES NOT REACHED from actual evidence; this
      # marker only guarantees the fact is visible in the uploaded log part.
      - name: Record setup failure as BLOCKED evidence (never silent)
        if: failure()
        run: |
          set -Eeuo pipefail
          bash scripts/ci/bootstrap-logs.sh >/dev/null 2>&1 || mkdir -p ci-logs
          # Run 44462492262 repair: route the evidence through the
          # canonical sanitizer chain (CI_SANITIZER_BIN -> python bootstrap
          # fallback -> loud raw passthrough) via scripts/ci/capture.sh.
          # This step also runs when the sanitizer build itself failed, so
          # the graceful capture.sh fallback keeps the evidence flowing —
          # never masked, the strict validator still decides.
          # shellcheck source=../ci/capture.sh
          source scripts/ci/capture.sh
          {
            echo "BLOCKED marker: job ${GITHUB_JOB:-unknown} run ${GITHUB_RUN_ID:-unknown} attempt ${GITHUB_RUN_ATTEMPT:-unknown} has at least one failed step (see the failing step above)."
            echo "Captured ci-logs records remain authoritative for what ran; phases with no structured gate record are reported by the collector as GATES NOT REACHED."
            date -u '+blocked_utc=%Y-%m-%dT%H:%M:%SZ'
          } | ci_sanitize | tee ci-logs/setup-blocked.log

      - name: Upload preflight log part
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preflight-logs-part-attempt${{ github.run_attempt }}
          # The directory itself, not a glob: the bootstrap guarantees it
          # exists with at least bootstrap.log inside.
          path: ci-logs
          if-no-files-found: error

  build-windows:
    # INDEPENDENT evidence job — no `needs: preflight` (run 42026322748
    # skipped this job because a success-only dependency suppressed it).
    name: build-windows (windows-latest, x64, UCRT64)
    runs-on: windows-latest
    timeout-minutes: 40
    # REPO-ROOT CONTRACT (run 42921967187 root cause): the generated gate
    # scripts (gate-verify-build-metadata / gate-create-portable-zip /
    # gate-verify-extracted-package) dot-source repository helpers through
    # the repo root. That run's gates died on
    #   Cannot bind argument to parameter 'Path' because it is null.
    # because SHEYTAN_REPO_ROOT was never defined for the spawned gate
    # process. It is now defined here at JOB scope so every step and every
    # child process inherits it; the generated gates additionally fall back
    # to the standard GITHUB_WORKSPACE (scripts/ci/Resolve-RepoRoot.ps1),
    # so no single custom variable can ever break helper imports again.
    env:
      SHEYTAN_REPO_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap CI log directories (guaranteed evidence)
        shell: pwsh
        run: ./scripts/ci/Bootstrap-Logs.ps1

      # Windows keeps its own Go build cache: the runner OS differs
      # from the Linux jobs, so its cache key cannot collide with the
      # single Linux saver (build-linux).
      - name: Setup Go (go.mod toolchain is the version authority)
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # Run 44462492262 repair: build the canonical capture-time sanitizer
      # (cmd/cisanitize) as cisanitize.exe and export its path for every
      # later Windows producer. The ASCII log contract is implemented at
      # capture time by this binary (or the scripts/ci/sanitize_bytes.py
      # bootstrap fallback routed by scripts/ci/Write-SanitizedChunk.ps1)
      # and NEVER by sed.
      - name: Build sanitizer tool (cisanitize.exe)
        shell: pwsh
        run: |
          $binDir = Join-Path $env:GITHUB_WORKSPACE '.ci-bin'
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          $exe = Join-Path $binDir 'cisanitize.exe'
          go build -o "$exe" ./cmd/cisanitize
          if ($LASTEXITCODE -ne 0) { Write-Output "ERROR: cisanitize build failed"; exit $LASTEXITCODE }
          Write-Output "CI_SANITIZER_EXE=$exe" >> $env:GITHUB_ENV
          Add-Content -Path $env:GITHUB_PATH -Value $binDir
          # End-to-end smoke: separator clamping must work before any
          # producer depends on the binary.
          $smoke = @("hello===world") | & $exe
          if (($smoke -join "`n") -ne "hello==world") {
            Write-Output "ERROR: cisanitize smoke test failed (got: $($smoke -join ' '))"
            exit 1
          }
          Write-Output "cisanitize built and smoke-tested: $exe"

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        name: Setup MSYS2 UCRT64
        id: msys2
        with:
          msystem: UCRT64
          update: false
          release: true
          path-type: minimal
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf

      # The setup-msys2 action scopes PATH changes to `shell: msys2`
      # steps; normal pwsh steps would otherwise resolve the runner's
      # preinstalled C:\mingw64 gcc and Strawberry pkg-config 0.26.
      # Prepend the UCRT64 bin directory to the runner PATH so the
      # intended toolchain is first for every following step.
      - name: Activate UCRT64 toolchain on the runner PATH
        shell: pwsh
        run: |
          $ucrt = Join-Path "${{ steps.msys2.outputs.msys2-location }}" 'ucrt64\bin'
          if (-not (Test-Path (Join-Path $ucrt 'gcc.exe'))) {
            Write-Output "ERROR: UCRT64 gcc.exe not found under $ucrt"
            exit 1
          }
          $env:PATH = "$ucrt;$env:PATH"
          Add-Content -Path $env:GITHUB_PATH -Value $ucrt
          Write-Output "UCRT64 bin prepended to PATH: $ucrt"

      # Hard toolchain gate — EXECUTED, never quoted. Run 42231355353
      # piped a bare `{ ... }` script-block literal into Tee-Object here:
      # PowerShell treats that as a VALUE, so the block's SOURCE TEXT was
      # written to windows-compiler.log, no assertion ran, $fail stayed
      # $false and the step printed PASSED (false green). The helper is
      # invoked as a FILE; its already-executed output lines (evaluated
      # gcc identity, header-aware CRT probe, pkgconf identity, Go
      # identity) are teed into the log part, and the REAL exit code —
      # captured before the cmdlets can touch $LASTEXITCODE — decides
      # the step. A script block is never piped uninvoked again.
      - name: Verify UCRT64 toolchain (identity gate)
        shell: pwsh
        run: |
          $ucrt = Join-Path "${{ steps.msys2.outputs.msys2-location }}" 'ucrt64\bin'
          $evidence = ./scripts/ci/Verify-UCRT64.ps1 -ExpectedBin $ucrt
          # $rc is captured BEFORE the pipe so nothing below can touch
          # $LASTEXITCODE (run-42231355353 contract).
          $rc = $LASTEXITCODE
          # Run 44462492262 repair: route the evidence through the
          # canonical capture-time sanitizer before it lands in the log
          # (never sed). When the sanitizer binary is unavailable the raw
          # evidence still flows behind a loud marker — the strict byte
          # gate fails that log; nothing is silently masked.
          if ($env:CI_SANITIZER_EXE -and (Test-Path $env:CI_SANITIZER_EXE)) {
            # Run 45182658992 repair: the former
            #   $evidence | & $env:CI_SANITIZER_EXE | Tee-Object -FilePath ci-logs/windows-compiler.log
            # terminated every written line with CRLF on Windows. Tee-Object
            # appends the platform line ending per record, so even fully
            # sanitized CONTENT carried CR bytes into the log part - the
            # exact "521-class control-byte" defect Capture-Step.ps1
            # documents (Add-Content / Tee-Object are forbidden writers for
            # ci-logs). windows-compiler.log therefore failed the byte-level
            # "Validate ASCII log contract" gate on every Windows run that
            # wrote it (runs 45097038674 and 45182658992), independent of
            # any gate-crash downstream effect. The file is now written
            # through [System.IO.File]::WriteAllText with explicit LF-only
            # content and UTF-8 without BOM - the same discipline
            # Capture-Step.ps1 and the setup-blocked writer use. The
            # console passthrough keeps the evidence visible in the step
            # log, and the sanitized text is joined exactly as the
            # sanitizer emitted it (no re-termination).
            $sanitizedLines = @($evidence | & $env:CI_SANITIZER_EXE)
            $text = (($sanitizedLines -join "`n") + "`n")
            [System.IO.File]::WriteAllText((Join-Path (Get-Location).Path 'ci-logs/windows-compiler.log'), $text, (New-Object System.Text.UTF8Encoding($false)))
            Write-Output $sanitizedLines
          }
          else {
            # FAIL CLOSED (priority-A repair of the raw-passthrough
            # bypass): a sanitizer-unavailable path must never write raw
            # output into a file bound for the strict log contract. The
            # real exit code is preserved, so the failure keeps its
            # origin instead of becoming a validator catch later.
            [Console]::Error.WriteLine('ERROR|platform=windows-x64|job=build-windows|step=verify-ucrt64|gate=desktop-build|command=verify-ucrt64|tool=capture-pipeline|source=NOT_PROVIDED_BY_TOOL|message=sanitizer unavailable; raw compiler evidence is NOT written to the strict log (fail closed)')
            exit $rc
          }
          exit $rc

      - name: Record build date
        id: meta
        shell: pwsh
        run: |
          $d = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          "build_date=$d" >> $env:GITHUB_OUTPUT

      - name: Build and verify Windows x64 desktop app
        shell: pwsh
        env:
          CGO_ENABLED: '1'
          GOOS: windows
          GOARCH: amd64
          SHEYTAN_BUILD_COMMIT: ${{ github.sha }}
          SHEYTAN_BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          SHEYTAN_BUILT_BY: github-actions
          SHEYTAN_BUILD_VERSION: BETA
        run: |
          ./scripts/build/build-windows.ps1
          exit $LASTEXITCODE

      # Presentation-shell build gates (Windows): the native Go-Gui
      # (Gio) shell cross-builds cgo-free for windows/amd64 and the Wails
      # v3 web shell builds in its purego cgo-free profile (native
      # runtime execution needs a Windows runner with WebView2 - the
      # hosted windows-latest image has it; the app-window launch is
      # verified by the package self-check observer below).
      - name: Build native Go-Gui shell (app-gogui.exe)
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          SHEYTAN_BUILD_COMMIT: ${{ github.sha }}
        run: |
          go build -tags goffi_static -o ci-logs/app-gogui.exe ./cmd/app-gogui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "app-gogui.exe built (cgo-free, goffi_static)"

      - name: Build Wails v3 web shell (app-wails.exe, purego cgo-free)
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          SHEYTAN_BUILD_COMMIT: ${{ github.sha }}
        run: |
          go build -tags "purego,sheytan_nogpu" -o ci-logs/app-wails.exe ./cmd/app-wails
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "app-wails.exe built (purego, sheytan_nogpu profile; CPU renderer honest fallback)"

      # ------------------------------------------------------------------
      # CANONICAL ONE-PACKAGE CONTRACT (run 42939743766 §5, replacing the
      # run-42921967187 recovery path): there is EXACTLY ONE Windows x64
      # application artifact — SHEYTAN-Music-Visualizer-windows-x64.zip.
      # No raw EXE, no staged-folder archive, no "recovery executable",
      # no duplicate portable variant is ever uploaded. COMPACT PACKAGE
      # (run 43712071111): the package ships NO media-tool binaries —
      # FFmpeg/ffprobe are app-managed downloads, enforced negatively by
      # the build gates and reflected in the status record. The package
      # is uploaded when it exists AND its own package gates passed:
      #   - package_status VERIFIED → the canonical package of a green run
      #   - package_status TEST_ONLY → the canonical package of a run
      #     where a non-package gate failed; the job and workflow stay red
      #     and the summary labels it TEST-ONLY
      #   - package_status UNAVAILABLE / file missing / bundled media
      #     tools detected → NO package is uploaded; diagnostics only
      # Uploads use actions/upload-artifact v7 archive:false, so the
      # downloaded artifact IS the ZIP (no double-zip wrapper); the
      # artifact name is the file's basename.
      # ------------------------------------------------------------------
      - name: Decide Windows package upload (canonical, status-driven)
        id: win_package_decision
        if: always()
        shell: pwsh
        run: |
          Set-StrictMode -Version 3.0
          # COMPACT-PACKAGE STATUS FIELDS (run 43712071111 schema, written
          # by scripts/ci/write-package-status.py from PERSISTED gate
          # evidence only): package_status, ffmpeg_binaries_bundled,
          # media_tools_downloader_fixture, app_launch_self_check,
          # h264_export_proof, h265_software_export_proof. The decision
          # is driven by package_status; the negative guards below make a
          # bundled-media-tools regression a hard never-upload even if a
          # future writer bug mislabelled the status. Field reads go
          # through PSObject.Properties so a missing key (schema drift)
          # keeps the fail-closed default instead of throwing under
          # StrictMode.
          function Get-StatusField($obj, [string]$name, $default) {
            if ($null -ne $obj) {
              $prop = $obj.PSObject.Properties[$name]
              if ($null -ne $prop) { return $prop.Value }
            }
            return $default
          }
          $status = 'UNAVAILABLE'
          $bundled = $true
          $downloader = 'SKIPPED'
          $selfCheck = 'FAIL'
          $h264 = 'NOT RUN'
          $h265 = 'NOT RUN'
          $statusFile = 'ci-logs/package-status-windows.json'
          if (Test-Path $statusFile) {
            try {
              $pkg = Get-Content $statusFile -Raw | ConvertFrom-Json
              $status = [string](Get-StatusField $pkg 'package_status' 'UNAVAILABLE')
              $bundled = [bool](Get-StatusField $pkg 'ffmpeg_binaries_bundled' $true)
              $downloader = [string](Get-StatusField $pkg 'media_tools_downloader_fixture' 'SKIPPED')
              $selfCheck = [string](Get-StatusField $pkg 'app_launch_self_check' 'FAIL')
              $h264 = [string](Get-StatusField $pkg 'h264_export_proof' 'NOT RUN')
              $h265 = [string](Get-StatusField $pkg 'h265_software_export_proof' 'NOT RUN')
            } catch { $status = 'UNAVAILABLE' }
          }
          $zip = 'dist/SHEYTAN-Music-Visualizer-windows-x64.zip'
          $exists = (Test-Path -LiteralPath $zip) -and ((Get-Item -LiteralPath $zip).Length -gt 0)
          Write-Output "package_status=$status zip_exists=$exists"
          Write-Output "ffmpeg_binaries_bundled=$bundled media_tools_downloader_fixture=$downloader app_launch_self_check=$selfCheck"
          Write-Output "h264_export_proof=$h264 h265_software_export_proof=$h265"
          $upload = ($status -in @('VERIFIED','TEST_ONLY')) -and $exists -and (-not $bundled)
          if ($status -in @('VERIFIED','TEST_ONLY') -and $bundled) {
            Write-Output "ERROR: bundled media tools detected — the compact package contract forbids an upload regardless of the recorded status"
          }
          if ($upload) {
            $size = (Get-Item -LiteralPath $zip).Length
            if ($size -lt 1048576) { Write-Output "ERROR: package implausibly small ($size bytes)"; $upload = $false }
            else { Write-Output "package size: $size bytes" }
          }
          if (-not $upload) {
            Write-Output "NO Windows package upload: an unusable package is never published (status=$status bundled=$bundled). Diagnostics remain available."
          }
          "package_uploaded=$(if ($upload) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          "package_status=$status" >> $env:GITHUB_OUTPUT

      - name: Upload the Windows CANDIDATE package (internal; final naming only by publish-products)
        # PRIORITY-B PUBLICATION DAG: platform jobs never publish under
        # the final public artifact name. The VERIFIED package travels as
        # an internal candidate the workflow-wide publisher validates and
        # republishes; TEST-ONLY and UNAVAILABLE packages are not even
        # candidates (an unverified package is never one retry away from
        # being visible under the final name).
        if: always() && steps.win_package_decision.outputs.package_uploaded == 'true' && steps.win_package_decision.outputs.package_status == 'VERIFIED'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-candidate-attempt${{ github.run_attempt }}
          path: dist/SHEYTAN-Music-Visualizer-windows-x64.zip
          archive: false
          if-no-files-found: error
          overwrite: true

      - name: Label the Windows package state in the job summary (TEST-ONLY contract)
        if: always()
        shell: pwsh
        run: |
          Set-StrictMode -Version 3.0
          # COMPACT-PACKAGE STATUS FIELDS (run 43712071111): the label
          # surfaces the persisted evidence fields — no bundled binaries,
          # downloader fixture, self-check and both app-managed export
          # proofs — next to the package_status verdict. PSObject property
          # lookups keep missing keys (schema drift) at their fail-closed
          # defaults instead of throwing under StrictMode.
          function Get-StatusField($obj, [string]$name, $default) {
            if ($null -ne $obj) {
              $prop = $obj.PSObject.Properties[$name]
              if ($null -ne $prop) { return $prop.Value }
            }
            return $default
          }
          $status = '${{ steps.win_package_decision.outputs.package_status }}'
          $uploaded = '${{ steps.win_package_decision.outputs.package_uploaded }}'
          $bundled = $true; $downloader = 'SKIPPED'; $selfCheck = 'FAIL'; $h264 = 'NOT RUN'; $h265 = 'NOT RUN'
          $statusFile = 'ci-logs/package-status-windows.json'
          if (Test-Path $statusFile) {
            try {
              $pkg = Get-Content $statusFile -Raw | ConvertFrom-Json
              $bundled = [bool](Get-StatusField $pkg 'ffmpeg_binaries_bundled' $true)
              $downloader = [string](Get-StatusField $pkg 'media_tools_downloader_fixture' 'SKIPPED')
              $selfCheck = [string](Get-StatusField $pkg 'app_launch_self_check' 'FAIL')
              $h264 = [string](Get-StatusField $pkg 'h264_export_proof' 'NOT RUN')
              $h265 = [string](Get-StatusField $pkg 'h265_software_export_proof' 'NOT RUN')
            } catch { }
          }
          if ($env:GITHUB_STEP_SUMMARY) {
            $proofLine = "media_tools_downloader_fixture=$downloader app_launch_self_check=$selfCheck h264_export_proof=$h264 h265_software_export_proof=$h265 ffmpeg_binaries_bundled=$bundled"
            if ($uploaded -eq 'true' -and $status -eq 'VERIFIED') {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Windows x64 package`n- Artifact: SHEYTAN-Music-Visualizer-windows-x64.zip (VERIFIED — every required gate passed)`n- $proofLine"
            } elseif ($uploaded -eq 'true') {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Windows x64 package`n- Artifact: SHEYTAN-Music-Visualizer-windows-x64.zip`n- **TEST-ONLY — required gates failed** (see the gate table below; the job and workflow remain red)`n- $proofLine"
            } else {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Windows x64 package`n- NOT UPLOADED (package_status=$status; an unusable package is never published)`n- $proofLine"
            }
          }

      - name: Record Windows gate table and package outcome in the job summary
        if: always()
        shell: pwsh
        run: |
          Set-StrictMode -Version 3.0
          $log = 'ci-logs/phase2-build.log'
          if (-not (Test-Path $log)) { Write-Output 'phase2-build.log absent (build step may not have started)'; exit 0 }
          $gates = @{}
          $order = @()
          foreach ($line in Get-Content $log) {
            if ($line -match '^STEP: (.+)$') { $n = $Matches[1]; if (-not $gates.ContainsKey($n)) { $order += $n; $gates[$n] = 'NOT RUN' } }
            elseif ($line -match '^EXIT_CODE: (\d+) (PASS|FAIL)$') { if ($order.Count -gt 0) { $gates[$order[-1]] = $Matches[2] } }
            elseif ($line -match '^BLOCKED: gate (\S+)') { $n = $Matches[1]; if (-not $gates.ContainsKey($n)) { $order += $n; $gates[$n] = 'BLOCKED' } }
            elseif ($line -match '^SKIPPED: gate (\S+)') { $n = $Matches[1]; if (-not $gates.ContainsKey($n)) { $order += $n; $gates[$n] = 'SKIPPED' } }
          }
          $pkgFile = 'ci-logs/package-status-windows.json'
          $pkg = if (Test-Path $pkgFile) { (Get-Content $pkgFile -Raw | ConvertFrom-Json) } else { $null }
          function Get-StatusField($obj, [string]$name, $default) {
            if ($null -ne $obj) {
              $prop = $obj.PSObject.Properties[$name]
              if ($null -ne $prop) { return $prop.Value }
            }
            return $default
          }
          if ($env:GITHUB_STEP_SUMMARY) {
            {
              '### build-windows gate table'
              ''
              '| gate | result |'
              '|---|---|'
              foreach ($n in $order) { "| $n | $($gates[$n]) |" }
              ''
              if ($null -ne $pkg) {
                "package_status=$(Get-StatusField $pkg 'package_status' 'UNAVAILABLE') commit_verified=$(Get-StatusField $pkg 'commit_verified' $false) (expected=$(Get-StatusField $pkg 'commit_expected' $null), observed=$(Get-StatusField $pkg 'commit_observed' 'not-observed'))"
                "ffmpeg_binaries_bundled=$(Get-StatusField $pkg 'ffmpeg_binaries_bundled' $true) media_tools_downloader_fixture=$(Get-StatusField $pkg 'media_tools_downloader_fixture' 'SKIPPED') app_launch_self_check=$(Get-StatusField $pkg 'app_launch_self_check' 'FAIL')"
                "h264_export_proof=$(Get-StatusField $pkg 'h264_export_proof' 'NOT RUN') h265_software_export_proof=$(Get-StatusField $pkg 'h265_software_export_proof' 'NOT RUN') intel_qsv_hevc_proof=$(Get-StatusField $pkg 'intel_qsv_hevc_proof' 'NOT AVAILABLE')"
              } else {
                'package_status=NOT RECORDED (the build script did not reach the package-status step)'
              }
              'Evidence distinctions: local != hosted; software adapter != physical GPU; staged != extracted-and-verified.'
            } | ForEach-Object { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $_ }
          }

      - name: Record setup failure as BLOCKED evidence (never silent)
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          $now = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $lines = @(
            "BLOCKED marker: job $($env:GITHUB_JOB) run $($env:GITHUB_RUN_ID) attempt $($env:GITHUB_RUN_ATTEMPT) has at least one failed step (see the failing step above).",
            "Captured ci-logs records remain authoritative for what ran; phases with no structured gate record are reported by the collector as GATES NOT REACHED.",
            "blocked_utc=$now"
          )
          # Run 44462492262 repair: route the evidence through the
          # canonical sanitizer chain (CI_SANITIZER_EXE -> python bootstrap
          # fallback -> loud raw passthrough) and write LF-only. The former
          # Add-Content write terminated every line with CRLF on Windows —
          # exactly the stray control-byte class the byte gate counts.
          # The helper never masks: an unavailable sanitizer passes raw
          # text behind a loud marker; the strict validator still decides.
          $helper = Join-Path $env:GITHUB_WORKSPACE 'scripts/ci/Write-SanitizedChunk.ps1'
          if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) {
            $helper = Join-Path (Get-Location).Path 'scripts/ci/Write-SanitizedChunk.ps1'
          }
          . $helper
          $text = Write-SanitizedChunk -Text (($lines -join "`n") + "`n")
          [System.IO.File]::WriteAllText((Join-Path (Get-Location).Path 'ci-logs/setup-blocked.log'), $text, (New-Object System.Text.UTF8Encoding($false)))
          Get-Content ci-logs/setup-blocked.log

      - name: Validate ASCII log contract (byte-level gate)
        if: always()
        shell: pwsh
        run: |
          $logs = @(Get-ChildItem ci-logs -Filter *.log | ForEach-Object { $_.FullName })
          if ($logs.Count -eq 0) { Write-Error "no log files under ci-logs"; exit 1 }
          $lastExit = 0
          go run ./cmd/civalidate @logs
          $lastExit = $LASTEXITCODE
          exit $lastExit

      - name: Upload Windows log part
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-logs-part-attempt${{ github.run_attempt }}
          path: ci-logs
          if-no-files-found: error
  build-linux:
    # INDEPENDENT evidence job — no `needs: preflight`. Explicit
    # ubuntu-26.04 (deliberate stable OS choice — never an ambiguous
    # ubuntu-latest). This is the ONLY Linux job allowed to save the Go
    # build cache (see the cache-policy note above).
    name: build-linux (ubuntu-26.04, x64)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap CI log directories (guaranteed evidence)
        run: bash scripts/ci/bootstrap-logs.sh

      - name: Setup Go (go.mod toolchain is the version authority)
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # Run 44462492262 repair: build the canonical capture-time sanitizer
      # (cmd/cisanitize, package internal/asciilog) and export it for every
      # later step, including the CI_SANITIZER_BIN used by
      # scripts/ci/capture.sh (ci_capture) inside the gate runner. The
      # ASCII log contract is implemented at capture time by this binary
      # (or the scripts/ci/sanitize_bytes.py bootstrap fallback) and NEVER
      # by sed.
      - name: Build sanitizer tool
        run: |
          set -Eeuo pipefail
          CI_BIN="$PWD/.ci-bin"
          mkdir -p "$CI_BIN"
          go build -o "$CI_BIN/cisanitize" ./cmd/cisanitize
          echo "CI_BIN=$CI_BIN" >> "$GITHUB_ENV"
          echo "CI_SANITIZER_BIN=$CI_BIN/cisanitize" >> "$GITHUB_ENV"
          echo "$CI_BIN" >> "$GITHUB_PATH"
          smoke="$(printf 'hello===world\nghp_ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefgh\n' | "$CI_BIN/cisanitize")"
          if [ "$smoke" != "hello==world"$'\n'"REDACTED" ]; then
            echo "ERROR: cisanitize smoke test failed (got: $smoke)"
            exit 1
          fi
          echo "cisanitize built and smoke-tested: $CI_BIN/cisanitize"

      # Native prerequisites, installed exactly once in this job, minimal set.
      # Every install is independently status-tracked: one failed package
      # group must not mask the others, and the step exits with a real
      # failure only after recording every outcome (the tee survives and
      # the always() upload keeps the evidence).
      - name: Install native UI prerequisites and FFmpeg
        run: |
          set -Eeuo pipefail
          # Status tracking uses a FILE, not a shell variable: the { ... } |
          # tee pipeline runs its left side in a subshell, so a counter
          # modified there would be lost (actionlint SC2030/SC2031 — caught
          # during the run-42026322748 repair validation).
          # status_file is a machine CONTROL file (not a .log): its bytes
          # are fixed ASCII literals written by this step itself
          # ("ok"/"fail"), it is never scanned by the byte-level gate
          # (which scans ci-logs/*.log), and routing the failure-tracking
          # appends through a subprocess would add a masking failure point
          # to exactly the path that must record failures — so it stays a
          # direct write by documented decision (run 44462492262 sweep).
          status_file=ci-logs/prereq-status.txt
          : > "$status_file"
          {
            echo "[section] OS image (ubuntu-26.04 migration evidence)"
            grep PRETTY_NAME /etc/os-release || echo "PRETTY_NAME: not present in /etc/os-release"
            uname -srm
            echo "[section] apt-get update"
            if ! sudo apt-get update; then
              echo "ERROR: apt-get update failed"
              echo fail >> "$status_file"
            fi
            echo "[section] apt-get install native prerequisites (Go-Gui cgo-free desktop shell + GoGPU runtime stack)"
            # Dependency-graph reconciliation (run 44648357437, failure
            # 2.5): the UI shell is go-gui v0.98.0, whose Linux desktop
            # backend is CGO-FREE — it uses pure-Go X11 (jezek/xgb) and
            # dlopens libEGL/libGL/wayland/xkbcommon at RUNTIME, so no
            # X11/Wayland/GL -dev headers or pkg-config modules are
            # needed at build time (the former Gio list demanded
            # x11-xcb.pc and failed the whole job when it was absent).
            # gcc remains because the GoGPU wgpu renderer stack compiles
            # cgo; Vulkan/GL/X11 stay as RUNTIME libraries for the
            # Xvfb smoke and the GPU probe.
            if ! sudo apt-get install -y --no-install-recommends \
              gcc pkg-config \
              libvulkan1 mesa-vulkan-drivers \
              libegl1 libgl1 \
              libwayland-client0 libwayland-egl1 libxkbcommon0 \
              libx11-6; then
              echo "ERROR: native UI prerequisite install failed"
              echo fail >> "$status_file"
            fi
            echo "[section] distro FFmpeg for export integration tests (external to the product)"
            if ! sudo apt-get install -y --no-install-recommends ffmpeg; then
              echo "ERROR: FFmpeg install failed (export integration tests will report their exact missing-encoder behavior)"
              echo fail >> "$status_file"
            fi
            echo "[section] virtual-display GUI smoke tooling (Xvfb + X11 inspection)"
            # The GUI smoke gate must be able to PROVE a mapped window, not
            # merely an alive process: xvfb provides the display, x11-utils
            # provides xdpyinfo (server readiness) and xwininfo (window map).
            if ! sudo apt-get install -y --no-install-recommends xvfb x11-utils; then
              echo "ERROR: Xvfb/x11-utils install failed (GUI smoke will be recorded BLOCKED, never passed without tooling)"
              echo fail >> "$status_file"
            fi
            echo "[section] native dependency reconciliation proof"
            # The Go-Gui desktop backend is cgo-free: the BUILD needs no
            # pkg-config UI modules. The proof is the build itself — the
            # app-gogui build step below fails loudly if any link-time
            # native dependency were still required. The runtime dlopen
            # set installed above is verified by ldd on the built
            # binary during the package gates.
            echo "build-time pkg-config UI modules required: none (go-gui v0.98.0 cgo-free Linux desktop; verified by the app-gogui build step)"
            echo "[section] encoders/ffprobe availability (informational)"
            ffmpeg -hide_banner -encoders 2>/dev/null | grep -E "libx264|aac" | head -4 || echo "(encoder list unavailable)"
            ffprobe -version 2>/dev/null | head -1 || echo "(ffprobe unavailable)"
          } 2>&1 | "$CI_BIN/cisanitize" | tee ci-logs/linux-compiler.log
          st=${PIPESTATUS[0]}
          if grep -q '^fail$' "$status_file"; then
            echo "ERROR: one or more prerequisite installs failed (details in ci-logs/linux-compiler.log); later dependent gates will record their exact failures"
          fi
          # The pipeline itself must also have succeeded (tee write errors
          # are never masked), and install failures must fail this step —
          # but ONLY after every install outcome above was recorded.
          if grep -q '^fail$' "$status_file" || [ "$st" -ne 0 ]; then exit 1; fi
          exit 0

      - name: Install govulncheck (pinned)
        run: |
          # v1.1.4 fails to build an SSA under the go1.27 toolchain;
          # v1.9.0 is verified against this repository (0 called
          # vulnerabilities) and prints its version via -version.
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          echo "govulncheck installed:"
          govulncheck -version 2>&1 | head -4 || true

      - name: Record build date
        id: meta
        run: echo "build_date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and verify Linux x64 desktop app
        env:
          SHEYTAN_BUILD_COMMIT: ${{ github.sha }}
          SHEYTAN_BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          SHEYTAN_BUILT_BY: github-actions
          SHEYTAN_BUILD_VERSION: BETA
        run: |
          set -o pipefail
          bash scripts/build/build-linux.sh --mode desktop 2>&1 | "$CI_BIN/cisanitize" | tee ci-logs/linux-build.log
          exit "${PIPESTATUS[0]}"

      # ------------------------------------------------------------------
      # Presentation-shell build gates (Go-Gui + Wails migration, run
      # 44462492262). The native Go-Gui shell (Gio) is the production
      # desktop shell; the Wails v3 web shell is the cgo-free purego
      # profile (sheytan_nogpu: the gogpu fakecgo stack cannot share a
      # binary with Wails' purego fakecgo, so the web-shell profile
      # renders through the honest CPU renderer). Both shells build from
      # the same toolkit-free core and shared presentation contracts.
      # ------------------------------------------------------------------
      - name: Build native Go-Gui shell (app-gogui)
        env:
          SHEYTAN_BUILD_COMMIT: ${{ github.sha }}
          CGO_ENABLED: '1'
        run: |
          set -o pipefail
          go build -tags goffi_static -o /tmp/app-gogui ./cmd/app-gogui 2>&1 | "$CI_BIN/cisanitize" | tee ci-logs/gogui-build.log
          exit "${PIPESTATUS[0]}"

      - name: Build Wails v3 web shell and cross-compiles (purego, cgo-free)
        run: |
          set -o pipefail
          {
            echo "[section] linux (host) purego build"
            CGO_ENABLED=0 go build -tags "purego,sheytan_nogpu" -o /tmp/app-wails-linux ./cmd/app-wails && echo "linux build: OK" || echo "linux build: FAIL"
            echo "[section] windows/amd64 cross-compile"
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags "purego,sheytan_nogpu" -o /tmp/app-wails.exe ./cmd/app-wails && echo "windows build: OK" || echo "windows build: FAIL"
            echo "[section] darwin/arm64 cross-compile (compile evidence; codesign/run happens on macOS runners)"
            CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -tags "purego,sheytan_nogpu" -o /tmp/app-wails-darwin ./cmd/app-wails && echo "darwin build: OK" || echo "darwin build: FAIL"
          } 2>&1 | "$CI_BIN/cisanitize" | tee ci-logs/wails-build.log
          exit "${PIPESTATUS[0]}"

      # The windowed smoke is EXPERIMENTAL evidence, recorded honestly and
      # never faked: gio window mapping under Xvfb depends on the runner's
      # software GPU stack (mesa/lavapipe). A missing or failed smoke is
      # recorded as such in the status file - it does not turn red, but it
      # is also never reported as runtime-verified. A compile is not
      # runtime validation.
      - name: Xvfb smoke of the native Go-Gui shell (experimental, recorded)
        run: |
          set -Eeuo pipefail
          status=EXPERIMENTAL_TEST
          if command -v xvfb-run >/dev/null 2>&1 && [ -x /tmp/app-gogui ]; then
            if LIBGL_ALWAYS_SOFTWARE=1 timeout -k 10 120 xvfb-run -a -s "-screen 0 1280x800x24" /tmp/app-gogui --smoke 40 2>&1 | "$CI_BIN/cisanitize" | tee ci-logs/gogui-smoke.log; then
              status=EXPERIMENTAL_TEST_PASSED
            else
              status=EXPERIMENTAL_TEST_FAILED
            fi
          else
            echo "xvfb-run or the app binary is unavailable; smoke recorded UNAVAILABLE" | tee -a ci-logs/gogui-smoke.log
            status=UNAVAILABLE
          fi
          printf '{\n  "gate": "gogui-xvfb-smoke",\n  "status": "%s",\n  "note": "windowed runtime evidence is experimental; compile+self-check evidence is separate"\n}\n' "$status" > ci-logs/shell-smoke-linux.json
          echo "gogui xvfb smoke status: $status"

      # CANONICAL ONE-PACKAGE CONTRACT (run 42939743766 §5): exactly ONE
      # Linux x64 application artifact —
      # SHEYTAN-Music-Visualizer-linux-x64.tar.gz — uploaded when it exists
      # AND its own package gates passed (VERIFIED or TEST_ONLY per
      # ci-logs/package-status-linux.json). COMPACT PACKAGE (run
      # 43712071111): the package ships NO media-tool binaries —
      # FFmpeg/ffprobe are app-managed downloads, so an archive with
      # ffmpeg_binaries_bundled=true is never uploaded. An unusable
      # package is never uploaded; the job stays red either way.
      - name: Decide Linux package upload (canonical, status-driven)
        id: linux_package_decision
        if: always()
        run: |
          set -Eeuo pipefail
          # COMPACT-PACKAGE STATUS FIELDS (run 43712071111 schema, written
          # by scripts/ci/write-package-status.py from PERSISTED gate
          # evidence only): package_status, ffmpeg_binaries_bundled,
          # media_tools_downloader_fixture, app_launch_self_check,
          # h264_export_proof, h265_software_export_proof. The decision is
          # driven by package_status; ffmpeg_binaries_bundled=true is a
          # hard never-upload guard.
          status=UNAVAILABLE
          bundled=true
          downloader=SKIPPED
          self_check=FAIL
          h264='NOT RUN'
          h265='NOT RUN'
          if [ -s ci-logs/package-status-linux.json ]; then
            # One-line python (YAML literal block: no un-indented
            # continuation lines); shlex-quoted key=value output is
            # eval-safe, and a malformed record leaves the fail-closed
            # defaults in place (python exits nonzero, || true, empty
            # substitution).
            read_status="$(python3 -c 'import json,shlex; d=json.load(open("ci-logs/package-status-linux.json")); print("status="+shlex.quote(str(d.get("package_status","UNAVAILABLE")))); print("bundled="+("true" if d.get("ffmpeg_binaries_bundled",True) else "false")); print("downloader="+shlex.quote(str(d.get("media_tools_downloader_fixture","SKIPPED")))); print("self_check="+shlex.quote(str(d.get("app_launch_self_check","FAIL")))); print("h264="+shlex.quote(str(d.get("h264_export_proof","NOT RUN")))); print("h265="+shlex.quote(str(d.get("h265_software_export_proof","NOT RUN"))))' 2>/dev/null || true)"
            if [ -n "$read_status" ]; then
              eval "$read_status"
            fi
          fi
          tarball=dist/SHEYTAN-Music-Visualizer-linux-x64.tar.gz
          echo "package_status=$status"
          echo "ffmpeg_binaries_bundled=$bundled media_tools_downloader_fixture=$downloader app_launch_self_check=$self_check"
          echo "h264_export_proof=$h264 h265_software_export_proof=$h265"
          upload=false
          if [ -s "$tarball" ] && { [ "$status" = "VERIFIED" ] || [ "$status" = "TEST_ONLY" ]; } && [ "$bundled" != "true" ]; then
            size=$(stat -c%s "$tarball")
            echo "package_status=$status tarball_bytes=$size"
            if [ "$size" -lt 1048576 ]; then
              echo "ERROR: package implausibly small ($size bytes); not uploaded"
              echo "package_uploaded=false" >> "$GITHUB_OUTPUT"
            else
              echo "package_uploaded=true" >> "$GITHUB_OUTPUT"
              upload=true
            fi
          else
            if [ "$bundled" = "true" ]; then
              echo "ERROR: bundled media tools detected — the compact package contract forbids an upload regardless of the recorded status"
            fi
            echo "package_status=$status tarball missing, invalid or carries bundled media tools — NO Linux package upload (an unusable package is never published)"
            echo "package_uploaded=false" >> "$GITHUB_OUTPUT"
          fi
          echo "upload_decision=$upload"
          echo "package_status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload the Linux CANDIDATE package (internal; final naming only by publish-products)
        # PRIORITY-B PUBLICATION DAG: same candidate contract as Windows.
        # The tar.gz preserves the executable bit (a plain binary upload
        # would not); archive: false delivers the prebuilt archive
        # directly. Only a VERIFIED package is a candidate.
        if: always() && steps.linux_package_decision.outputs.package_uploaded == 'true' && steps.linux_package_decision.outputs.package_status == 'VERIFIED'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-candidate-attempt${{ github.run_attempt }}
          path: dist/SHEYTAN-Music-Visualizer-linux-x64.tar.gz
          archive: false
          if-no-files-found: error
          overwrite: true

      - name: Label the Linux package state in the job summary (TEST-ONLY contract)
        if: always()
        run: |
          set -uo pipefail
          status="${{ steps.linux_package_decision.outputs.package_status }}"
          uploaded="${{ steps.linux_package_decision.outputs.package_uploaded }}"
          # COMPACT-PACKAGE STATUS FIELDS (run 43712071111): surface the
          # persisted evidence fields next to the package_status verdict.
          bundled=true; downloader=SKIPPED; self_check=FAIL; h264='NOT RUN'; h265='NOT RUN'
          if [ -s ci-logs/package-status-linux.json ]; then
            # One-line python (YAML literal block: no un-indented
            # continuation lines); shlex-quoted key=value output is
            # eval-safe, and a malformed record leaves the fail-closed
            # defaults in place.
            fields="$(python3 -c 'import json,shlex; d=json.load(open("ci-logs/package-status-linux.json")); print("bundled="+("true" if d.get("ffmpeg_binaries_bundled",True) else "false")); print("downloader="+shlex.quote(str(d.get("media_tools_downloader_fixture","SKIPPED")))); print("self_check="+shlex.quote(str(d.get("app_launch_self_check","FAIL")))); print("h264="+shlex.quote(str(d.get("h264_export_proof","NOT RUN")))); print("h265="+shlex.quote(str(d.get("h265_software_export_proof","NOT RUN"))))' 2>/dev/null || true)"
            if [ -n "$fields" ]; then
              eval "$fields"
            fi
          fi
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            proof_line="media_tools_downloader_fixture=$downloader app_launch_self_check=$self_check h264_export_proof=$h264 h265_software_export_proof=$h265 ffmpeg_binaries_bundled=$bundled"
            if [ "$uploaded" = "true" ] && [ "$status" = "VERIFIED" ]; then
              {
                echo "### Linux x64 package"
                echo "- Artifact: SHEYTAN-Music-Visualizer-linux-x64.tar.gz (VERIFIED — every required gate passed)"
                echo "- $proof_line"
              } >> "$GITHUB_STEP_SUMMARY"
            elif [ "$uploaded" = "true" ]; then
              {
                echo "### Linux x64 package"
                echo "- Artifact: SHEYTAN-Music-Visualizer-linux-x64.tar.gz"
                echo "- **TEST-ONLY — required gates failed** (see the gate table inside the consolidated report; the job and workflow remain red)"
                echo "- $proof_line"
              } >> "$GITHUB_STEP_SUMMARY"
            else
              {
                echo "### Linux x64 package"
                echo "- NOT UPLOADED (package_status=$status; an unusable package is never published)"
                echo "- $proof_line"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Record setup failure as BLOCKED evidence (never silent)
        if: failure()
        run: |
          set -Eeuo pipefail
          bash scripts/ci/bootstrap-logs.sh >/dev/null 2>&1 || mkdir -p ci-logs
          # Run 44462492262 repair: route the evidence through the
          # canonical sanitizer chain (CI_SANITIZER_BIN -> python bootstrap
          # fallback -> loud raw passthrough) via scripts/ci/capture.sh.
          # This step also runs when the sanitizer build itself failed, so
          # the graceful capture.sh fallback keeps the evidence flowing —
          # never masked, the strict validator still decides.
          # shellcheck source=../ci/capture.sh
          source scripts/ci/capture.sh
          {
            echo "BLOCKED marker: job ${GITHUB_JOB:-unknown} run ${GITHUB_RUN_ID:-unknown} attempt ${GITHUB_RUN_ATTEMPT:-unknown} has at least one failed step (see the failing step above)."
            echo "Captured ci-logs records remain authoritative for what ran; phases with no structured gate record are reported by the collector as GATES NOT REACHED."
            date -u '+blocked_utc=%Y-%m-%dT%H:%M:%SZ'
          } | ci_sanitize | tee ci-logs/setup-blocked.log

      - name: Validate ASCII log contract (byte-level gate)
        if: always()
        run: |
          set -Eeuo pipefail
          go run ./cmd/civalidate ci-logs/*.log

      - name: Upload Linux log part
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-logs-part-attempt${{ github.run_attempt }}
          path: ci-logs
          if-no-files-found: error
  # CodeQL moved OUT of this workflow (run 43612608237 repair):
  # .github/workflows/codeql.yml is now a standalone, independently
  # triggered security workflow (push/pull_request/schedule/dispatch).
  # This build workflow no longer calls it, waits for it, or inspects its
  # artifacts — its collector only consolidates evidence produced by THIS
  # workflow's own jobs, and this workflow's verdict can never depend on
  # CodeQL completion or success.

  build-macos:
    # INDEPENDENT evidence job for the macOS desktop target (run
    # 44330231458 update; parity-set repair in the b9fab0f follow-up).
    # Required. The macOS job now RUNS the full parity set (go-test-
    # race, audio-validation, export-validation, gpu-validation,
    # gui-smoke) as platform-appropriate gates — run 44648357437 item
    # 2.9. Runtime hardware claims stay honest: a hosted macOS runner
    # proves software decode/transport, the real Metal-or-CPU render
    # path with its own evidence state and a windowed smoke; physical
    # audio/display/device validation remains recorded as unavailable
    # with the exact reason. No gate is silently omitted or converted
    # into a warning.
    name: build-macos (arm64 desktop, full parity gates)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap CI log directories (guaranteed evidence)
        run: bash scripts/ci/bootstrap-logs.sh

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      # Run 44462492262 repair (THE macOS fix): build the canonical
      # capture-time sanitizer and export CI_SANITIZER_BIN for
      # scripts/ci/capture.sh (used by scripts/build/build-macos.sh via
      # ci_capture). The former GNU-sed byte-class filter in capture.sh
      # rejected BSD sed ("RE error: invalid character range"), which
      # emptied every JOB/STEP/COMMAND record and failed the whole macOS
      # capture with exit codes 1/141; capture.sh no longer contains any
      # sed, and this binary (or the python bootstrap fallback) owns the
      # contract.
      - name: Build sanitizer tool
        run: |
          set -Eeuo pipefail
          CI_BIN="$PWD/.ci-bin"
          mkdir -p "$CI_BIN"
          go build -o "$CI_BIN/cisanitize" ./cmd/cisanitize
          echo "CI_BIN=$CI_BIN" >> "$GITHUB_ENV"
          echo "CI_SANITIZER_BIN=$CI_BIN/cisanitize" >> "$GITHUB_ENV"
          echo "$CI_BIN" >> "$GITHUB_PATH"
          smoke="$(printf 'hello===world\nghp_ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefgh\n' | "$CI_BIN/cisanitize")"
          if [ "$smoke" != "hello==world"$'\n'"REDACTED" ]; then
            echo "ERROR: cisanitize smoke test failed (got: $smoke)"
            exit 1
          fi
          echo "cisanitize built and smoke-tested: $CI_BIN/cisanitize"

      # Run 44462492262 repair regression: prove the whole capture-time
      # sanitizer pipeline is BSD-safe on THIS runner (go build, byte-
      # identical python fallback, live ci_capture contract, no sed in
      # scripts/ci/capture.sh).
      - name: Sanitizer portability (BSD-safe)
        if: ${{ always() && !cancelled() }}
        run: |
          set -Eeuo pipefail
          bash scripts/ci/tests/test-sanitizer-portable.sh

      - name: Build and verify macOS arm64 desktop app
        env:
          SHEYTAN_BUILD_COMMIT: ${{ github.sha }}
          SHEYTAN_BUILD_VERSION: BETA
          SHEYTAN_BUILT_BY: github-actions
        run: |
          set -Eeuo pipefail
          bash scripts/build/build-macos.sh

      - name: Build native Go-Gui shell (app-gogui, arm64)
        run: |
          set -o pipefail
          CGO_ENABLED=1 go build -tags goffi_static -o /tmp/app-gogui ./cmd/app-gogui 2>&1 | "$CI_BIN/cisanitize" | tee ci-logs/gogui-build-macos.log
          exit "${PIPESTATUS[0]}"

      - name: Build Wails v3 web shell (darwin arm64, purego cgo-free)
        run: |
          set -o pipefail
          CGO_ENABLED=0 go build -tags "purego,sheytan_nogpu" -o /tmp/app-wails-darwin ./cmd/app-wails 2>&1 | "$CI_BIN/cisanitize" | tee ci-logs/wails-build-macos.log
          exit "${PIPESTATUS[0]}"

      # ------------------------------------------------------------------
      # macOS PARITY GATES (run 44648357437 item 2.9 repair): the five
      # gates previously BLOCKED now run on macOS as platform-appropriate
      # versions. Hosted-runner honesty rules: a hosted macOS runner has
      # NO physical audio endpoint and NO user-visible display surface,
      # so software decode/transport evidence, the REAL Metal-or-CPU
      # render path with its true evidence state, and a best-effort
      # windowed smoke are exactly what is claimed — physical playback,
      # physical display fidelity and device hardware remain
      # UNAVAILABLE-with-reason, never fabricated or downgraded to pass.
      # ------------------------------------------------------------------
      - name: Parity gate go-test-race (macOS)
        run: |
          set -o pipefail
          CGO_ENABLED=1 go test -race -tags goffi_static ./internal/audio/... ./internal/playback/... ./internal/presentation/... ./internal/fileaccess/... ./internal/sysprofile/... ./ui/gogui/... 2>&1 | "$CI_BIN/cisanitize" | tee ci-logs/go-test-race-macos.log
          exit "${PIPESTATUS[0]}"

      - name: Parity gate audio-validation (macOS)
        run: |
          set -o pipefail
          {
            echo "[section] audio-validation (macOS parity)"
            echo "physical audio endpoint: UNAVAILABLE on a hosted runner (device playback is never claimed here)"
            echo "[section] software decode/transport contract tests (test-only, no device claim)"
            CGO_ENABLED=1 go test -tags goffi_static ./internal/audio/... ./internal/playback/...
          } 2>&1 | "$CI_BIN/cisanitize" | tee ci-logs/audio-validation-macos.log
          exit "${PIPESTATUS[0]}"

      - name: Parity gate export-validation (macOS)
        run: |
          set -o pipefail
          {
            echo "[section] export-validation (macOS parity)"
            echo "media tools: app-managed discovery; a missing pinned tool is recorded with its exact reason, never substituted by an arbitrary PATH binary"
            CGO_ENABLED=1 go test -tags goffi_static ./internal/export/... ./internal/mediatools/...
          } 2>&1 | "$CI_BIN/cisanitize" | tee ci-logs/export-validation-macos.log
          exit "${PIPESTATUS[0]}"

      - name: Parity gate gpu-validation (macOS, real render path evidence)
        run: |
          set -Eeuo pipefail
          # Same subshell rule as the mobile gates: the piped brace group
          # cannot mutate parent variables; the authoritative status is
          # a result file the parent reads after the pipeline.
          status_file="$(mktemp)"
          trap 'rm -f "$status_file"' EXIT
          echo "UNAVAILABLE" > "$status_file"
          {
            echo "[section] gpu-validation (macOS parity)"
            echo "evidence contract: adapter name is NOT execution proof; only the renderer's own verified state counts"
            echo "[section] app-gogui --self-check (real renderer selection + one deterministic frame)"
            if /tmp/app-gogui --self-check; then
              echo "self-check: renderer executed and reported its honest backend/state"
              echo "EXECUTED_BACKEND_REPORTED" > "$status_file"
            else
              echo "self-check: FAILED"
              echo "FAILED" > "$status_file"
            fi
          } 2>&1 | "$CI_BIN/cisanitize" | tee ci-logs/gpu-validation-macos.log
          status="$(cat "$status_file")"
          printf '{\n  "gate": "gpu-validation-macos",\n  "status": "%s"\n}\n' "$status" > ci-logs/gpu-status-macos.json
          grep -q "self-check PASS renderer-frame" ci-logs/gpu-validation-macos.log || { echo "ERROR: renderer-frame self-check did not pass"; exit 1; }
          echo "gpu-validation status: $status"

      - name: Parity gate gui-smoke (macOS, portable bounded windowed run)
        # PRIORITY-B REPAIR: the smoke no longer depends on GNU coreutils
        # `timeout` (absent on macOS runners) - the application-owned
        # cmd/timedrun bounds the run AND propagates the child's REAL
        # exit code. The gate result FAILS THE JOB: a failed or
        # unavailable smoke is a red parity gate, never a swallowed
        # EXPERIMENTAL_TEST_FAILED note on a green job (the exact
        # best-effort escape the spec forbids).
        run: |
          set -Eeuo pipefail
          status=UNAVAILABLE
          if [ -x /tmp/app-gogui ]; then
            set +e
            go run ./cmd/timedrun -timeout 120s -- /tmp/app-gogui --smoke 30 2>&1 | "$CI_BIN/cisanitize" | tee ci-logs/gui-smoke-macos.log
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -eq 0 ]; then
              status=GUI_SMOKE_PASSED
            else
              status=GUI_SMOKE_FAILED
            fi
          else
            echo "app-gogui binary unavailable; the smoke gate is BLOCKED, not passed" | tee -a ci-logs/gui-smoke-macos.log
            status=GUI_SMOKE_BLOCKED
          fi
          printf '{\n  "gate": "gogui-smoke-macos",\n  "status": "%s",\n  "note": "windowed runtime evidence on a hosted macOS runner; not physical-display validation"\n}\n' "$status" > ci-logs/shell-smoke-macos.json
          echo "gogui macOS smoke status: $status"
          case "$status" in
            GUI_SMOKE_PASSED) exit 0 ;;
            *) echo "ERROR: required macOS GUI smoke gate did not pass (status=$status; exit code preserved above)"; exit 1 ;;
          esac

      - name: Validate ASCII log contract (byte-level gate)
        if: always()
        run: |
          set -Eeuo pipefail
          go run ./cmd/civalidate ci-logs/*.log

      - name: Upload the macOS CANDIDATE app package (internal; final naming only by publish-products)
        # PRIORITY-B: the REAL .app bundle (Contents/MacOS executable +
        # Info.plist) archived as the canonical macos-arm64.app.zip; an
        # unsigned TEST build, honestly labeled. Candidate only — the
        # workflow-wide publisher owns the final artifact name.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-candidate-attempt${{ github.run_attempt }}
          path: dist/SHEYTAN-Music-Visualizer-macos-arm64.app.zip
          archive: false
          if-no-files-found: error
          overwrite: true

      - name: Upload macOS log part
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-logs-part-attempt${{ github.run_attempt }}
          path: ci-logs
          if-no-files-found: error

  build-android:
    # EXPERIMENTAL (run 44330231458 update): compile smoke only. Wails
    # mobile is experimental and the GoGPU native ANativeWindow backend
    # is documented as planned, not shipped. No APK, no emulator or
    # device validation, no GPU claim. Not a required gate; failures
    # keep the run red (honest) without blocking desktop evidence.
    name: build-android (REQUIRED product APK arm64)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap CI log directories (guaranteed evidence)
        run: bash scripts/ci/bootstrap-logs.sh

      # Run 45097038674 repair: this step now PROVISIONS the NDK instead
      # of only probing it. The required APK gate below cannot succeed
      # without an NDK; on images where none is pre-installed the gate
      # failed closed with "the toolchain absence is the real origin".
      # Deterministic behavior: reuse a pre-installed NDK when present;
      # otherwise install the pinned NDK revision through the runner's
      # sdkmanager, verify the toolchain file exists, and export
      # ANDROID_NDK_HOME for gomobile. Every outcome is recorded; a
      # failed provisioning fails this step closed (never silent).
      - name: Provision Android NDK (pinned revision, fail-closed)
        run: |
          set -Eeuo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          ndk_root=""
          for c in "${ANDROID_NDK_ROOT:-}" "${ANDROID_NDK_HOME:-}" "$ANDROID_HOME/ndk"/*; do
            if [ -n "$c" ] && [ -d "$c" ] && [ -f "$c/source.properties" ]; then ndk_root="$c"; break; fi
          done
          if [ -z "$ndk_root" ]; then
            pinned_rev="28.2.13676358"
            sdkman="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$sdkman" ]; then
              echo "ERROR: no pre-installed NDK and sdkmanager not found at $sdkman"
              echo "remedy: provision the pinned NDK (ndk;$pinned_rev) in the workflow image or set ANDROID_NDK_HOME"
              exit 1
            fi
            echo "no pre-installed NDK found; provisioning pinned revision $pinned_rev"
            yes | "$sdkman" --licenses > /dev/null || true
            "$sdkman" --install "ndk;$pinned_rev" > /dev/null
            ndk_root="$ANDROID_HOME/ndk/$pinned_rev"
          fi
          test -f "$ndk_root/source.properties" || { echo "ERROR: provisioned NDK lacks source.properties at $ndk_root"; exit 1; }
          test -x "$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" || { echo "ERROR: NDK toolchain clang missing at $ndk_root"; exit 1; }
          echo "ANDROID_NDK_HOME=$ndk_root" >> "$GITHUB_ENV"
          echo "ndk identity:"; grep -E "Pkg\.(Revision|Desc)" "$ndk_root/source.properties" || true
          echo "ndk provisioning: OK"

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      # Run 44462492262 repair: build the canonical capture-time sanitizer
      # and export CI_SANITIZER_BIN for scripts/ci/capture.sh (used by
      # scripts/build/build-android.sh via ci_capture). The ASCII log
      # contract is implemented at capture time by this binary (or the
      # scripts/ci/sanitize_bytes.py bootstrap fallback) and NEVER by sed.
      - name: Build sanitizer tool
        run: |
          set -Eeuo pipefail
          CI_BIN="$PWD/.ci-bin"
          mkdir -p "$CI_BIN"
          go build -o "$CI_BIN/cisanitize" ./cmd/cisanitize
          echo "CI_BIN=$CI_BIN" >> "$GITHUB_ENV"
          echo "CI_SANITIZER_BIN=$CI_BIN/cisanitize" >> "$GITHUB_ENV"
          echo "$CI_BIN" >> "$GITHUB_PATH"
          smoke="$(printf 'hello===world\nghp_ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefgh\n' | "$CI_BIN/cisanitize")"
          if [ "$smoke" != "hello==world"$'\n'"REDACTED" ]; then
            echo "ERROR: cisanitize smoke test failed (got: $smoke)"
            exit 1
          fi
          echo "cisanitize built and smoke-tested: $CI_BIN/cisanitize"

      - name: Android compile smoke (no APK claim)
        run: |
          set -Eeuo pipefail
          bash scripts/build/build-android.sh

      # REQUIRED product package (priority-B): a real arm64 APK built
      # with the pinned gomobile revision (the go-gui v0.98.0-pinned
      # x/mobile revision). The gate is authoritative: a missing,
      # invalid or signature-failing APK fails the job. Validation
      # covers archive structure, manifest, arm64 ABI native libraries
      # and signature verification when apksigner is available.
      # Emulator runtime evidence is honestly UNAVAILABLE (no nested
      # virtualization on hosted runners) and is never claimed; a
      # successful APK build is never described as an emulator test.
      - name: Android arm64 APK build (required product gate)
        run: |
          set -Eeuo pipefail
          status_file="$(mktemp)"
          trap 'rm -f "$status_file"' EXIT
          echo "APK_BUILD_FAILED" > "$status_file"
          # Run 45297707372 repair: the gate's failure lines were
          # stdout-only, so the consolidated diagnostics carried only
          # the bare "step conclusion failure" (the observed signature).
          # emit_error keeps the step log line AND appends the same
          # ASCII line to ci-logs/android-apk-build-errors.log, which
          # travels with the log part into the consolidated report.
          APK_ERRLOG=ci-logs/android-apk-build-errors.log
          : > "$APK_ERRLOG"
          emit_error() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$APK_ERRLOG"; }
          {
            echo "[section] gomobile install (go-gui-pinned x/mobile revision)"
            if go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261117202452-47699113848a && gomobile init >/dev/null 2>&1; then
              echo "gomobile: installed"
              echo "[section] APK build (arm64, api 31)"
              # Run 45297707372 repair (root cause, reproduced locally
              # against NDK r28c 28.2.13676358 + the pinned x/mobile):
              # gomobile REFUSES to package a main package that does
              # not import golang.org/x/mobile/app
              # ("cmd/app-gogui does not import golang.org/x/mobile/app"
              # — its build.go symbol check links the NativeActivity /
              # UIKit glue only when the app imports it). The glue now
              # lives in cmd/app-gogui/gui_mobile.go (//go:build
              # android || ios): it imports golang.org/x/mobile/app and
              # runs the real lifecycle loop. The runtime scope stays
              # honest: go-gui's android delivery is the Kotlin
              # GLSurfaceView host pattern (backend panics on the
              # desktop Run path), documented as a later slice; the APK
              # is the experimental compile-class carrier (structure,
              # identity, ABI and signature only — never a runtime
              # claim). With the glue, this exact build compiles and
              # links cleanly for android/arm64 (verified locally:
              # exit 0, lib/arm64-v8a/libapp_gogui.so + manifest).
              # Run 45182658992 repair: NO goffi_static tag here, target
              # restricted to android/arm64.
              # 1. The goffi_static tag made the required APK gate red in
              #    run 45182658992 with three exact goff v0.6.8 compiler
              #    errors (errno_static.go ErrnoFnAddr redeclared;
              #    errno_android_cgo.go other declaration of ErrnoFnAddr +
              #    undefined dl.AndroidErrnoAddr). Root cause is an
              #    upstream build-tag inconsistency: errno_android_cgo.go
              #    matches `android && cgo && arm64` WITHOUT a
              #    !goffi_static guard, but the dl.AndroidErrnoAddr symbol
              #    it calls only exists under `android && cgo && arm64 &&
              #    !goffi_static`, and errno_static.go also matches
              #    `goffi_static && ... android ... && arm64`. With
              #    CGO_ENABLED=1 AND -tags goffi_static both errno files
              #    compile and the package cannot build. Without the tag,
              #    android+cgo resolves goffi through its C-wrapper dlopen
              #    path (dl_android_cgo.go, -ldl) and compiles cleanly;
              #    reproduced locally with an aarch64 cross toolchain
              #    (with the tag: the exact three hosted errors; without:
              #    the goff packages compile clean). The goffi_static tag
              #    remains a DESKTOP link requirement (goffi_dlopen
              #    SDYNIMPORT vs CGO relocation mixing), not an android
              #    one; every other lane keeps it.
              # 2. goff v0.6.8 ships android implementations for arm64 ONLY
              #    (dl_android*.go, errno_android*.go and
              #    syscall_arm64.go are all arm64-gated), so a universal
              #    all-ABI APK cannot compile with the linked GPU renderer
              #    profile. The gate (validate-apk.py) and the artifact
              #    name are arm64-specific, so the build scope is arm64.
              # 3. CGO_ENABLED=1 stays: the oto android driver's oboe
              #    binding (binding_android.cpp) is cgo-only. The run
              #    45097038674 "undefined: oboe.Play" observation was a
              #    CGO_ENABLED=0 cross-compile artifact (oboe's binding is
              #    excluded when cgo is off) and never depended on
              #    goffi_static; with CGO_ENABLED=1 the oboe C++ binding
              #    compiles against the NDK for android/arm64.
              if CGO_ENABLED=1 gomobile build -target android/arm64 -androidapi 31 -o /tmp/SHEYTAN-Music-Visualizer-android-arm64.apk ./cmd/app-gogui; then
                echo "APK build: OK"
                ls -la /tmp/SHEYTAN-Music-Visualizer-android-arm64.apk
                echo "APK_BUILD_OK" > "$status_file"
              else
                emit_error "ERROR: APK build FAILED (the required product gate is red; the tool output above carries the compiler/linker origin)"
              fi
            else
              emit_error "ERROR: gomobile INSTALL FAILED (the required product gate is red; the toolchain absence is the real origin)"
            fi
          } 2>&1 | "$CI_BIN/cisanitize" | tee ci-logs/android-apk-build.log
          status="$(cat "$status_file")"
          printf '{\n  "gate": "android-apk-build",\n  "status": "%s"\n}\n' "$status" > ci-logs/shell-apk-android.json
          if [ "$status" != "APK_BUILD_OK" ]; then
            echo "ERROR: required Android APK build failed (status=$status); the job fails with its real origin."
            exit 1
          fi

      - name: Android APK package validation (structure, identity, ABI, signature)
        if: always()
        run: |
          set -Eeuo pipefail
          apk=/tmp/SHEYTAN-Music-Visualizer-android-arm64.apk
          {
            echo "[section] APK validation"
            test -s "$apk" || { echo "ERROR: APK missing or empty"; exit 1; }
            size=$(wc -c < "$apk")
            echo "apk_size_bytes=$size"
            python3 scripts/ci/validate-apk.py "$apk"
            if command -v apkanalyzer >/dev/null 2>&1; then
              pkgid="$(apkanalyzer manifest package-id "$apk" 2>/dev/null || true)"
              echo "apkanalyzer package-id=${pkgid:-unavailable}"
            else
              echo "apkanalyzer: UNAVAILABLE (identity re-verified by the publisher's archive inspection)"
            fi
            if command -v apksigner >/dev/null 2>&1; then
              apksigner verify --verbose "$apk" || { echo "ERROR: apksigner verify failed"; exit 1; }
              echo "apksigner verify: PASS (debug-signed test build, honestly labeled)"
            else
              echo "apksigner: UNAVAILABLE on this runner (a gomobile build is debug-signed; that nature is recorded, never claimed as release-signed)"
            fi
            echo "emulator/device validation: UNAVAILABLE (no nested virtualization on this hosted runner; no install/launch claim is made)"
            echo "APK_VALIDATION_OK"
          } 2>&1 | "$CI_BIN/cisanitize" | tee ci-logs/android-apk-validation.log
          grep -q "APK_VALIDATION_OK" ci-logs/android-apk-validation.log || {
            echo "ERROR: APK validation failed; the required product gate is red."
            exit 1
          }
          mkdir -p dist
          cp /tmp/SHEYTAN-Music-Visualizer-android-arm64.apk dist/

      - name: Upload the Android CANDIDATE APK (internal; final naming only by publish-products)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-candidate-attempt${{ github.run_attempt }}
          path: dist/SHEYTAN-Music-Visualizer-android-arm64.apk
          archive: false
          if-no-files-found: error
          overwrite: true


      - name: Validate ASCII log contract (byte-level gate)
        if: always()
        run: |
          set -Eeuo pipefail
          go run ./cmd/civalidate ci-logs/*.log

      - name: Upload Android log part
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-logs-part-attempt${{ github.run_attempt }}
          path: ci-logs
          if-no-files-found: error

  ios-compile-smoke:
    # EXPERIMENTAL (run 44330231458 update): compile smoke only. iOS
    # requires macOS and full Xcode; Wails classifies iOS as
    # experimental and the GoGPU native CAMetalLayer backend is
    # documented as planned, not shipped. No simulator validation, no
    # signing, no GPU claim. Not a required gate.
    name: ios-compile-smoke (informational compile smoke; NO product package)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap CI log directories (guaranteed evidence)
        run: bash scripts/ci/bootstrap-logs.sh

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      # Run 44462492262 repair (THE macOS fix, iOS job): build the
      # canonical capture-time sanitizer and export CI_SANITIZER_BIN for
      # scripts/ci/capture.sh (used by scripts/build/build-ios.sh via
      # ci_capture). capture.sh no longer contains any sed; this binary
      # (or the python bootstrap fallback) owns the contract.
      - name: Build sanitizer tool
        run: |
          set -Eeuo pipefail
          CI_BIN="$PWD/.ci-bin"
          mkdir -p "$CI_BIN"
          go build -o "$CI_BIN/cisanitize" ./cmd/cisanitize
          echo "CI_BIN=$CI_BIN" >> "$GITHUB_ENV"
          echo "CI_SANITIZER_BIN=$CI_BIN/cisanitize" >> "$GITHUB_ENV"
          echo "$CI_BIN" >> "$GITHUB_PATH"
          smoke="$(printf 'hello===world\nghp_ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefgh\n' | "$CI_BIN/cisanitize")"
          if [ "$smoke" != "hello==world"$'\n'"REDACTED" ]; then
            echo "ERROR: cisanitize smoke test failed (got: $smoke)"
            exit 1
          fi
          echo "cisanitize built and smoke-tested: $CI_BIN/cisanitize"

      # Run 44462492262 repair regression: prove the whole capture-time
      # sanitizer pipeline is BSD-safe on THIS runner (go build, byte-
      # identical python fallback, live ci_capture contract, no sed in
      # scripts/ci/capture.sh).
      - name: Sanitizer portability (BSD-safe)
        if: ${{ always() && !cancelled() }}
        run: |
          set -Eeuo pipefail
          bash scripts/ci/tests/test-sanitizer-portable.sh

      - name: iOS compile smoke (no simulator or signing claim)
        run: |
          set -Eeuo pipefail
          bash scripts/build/build-ios.sh

      # Experimental simulator attempt on the macOS runner (Xcode is
      # pre-installed): gomobile can package the Go-Gui shell as an iOS
      # .app for the SIMULATOR. The gomobile version is pinned to the
      # exact golang.org/x/mobile revision go-gui v0.98.0 requires
      # (v0.2.0 does not exist upstream). Device IPA signing is NOT
      # configured in this repository's secrets, so the device path is
      # recorded BLOCKED_SIGNING_NOT_CONFIGURED - never faked.
      # Install/launch on a concrete simulator runtime is attempted
      # best-effort and recorded with its exact outcome.
      - name: iOS simulator app attempt (gomobile, experimental, recorded)
        run: |
          set -Eeuo pipefail
          # SC2030/SC2031 repair (run 44648357437): the piped brace
          # group below runs in a SUBSHELL; the authoritative status is
          # a result FILE read by the parent after the pipeline, and
          # the pipeline exit code still propagates via pipefail.
          status_file="$(mktemp)"
          trap 'rm -f "$status_file"' EXIT
          echo "EXPERIMENTAL_TEST" > "$status_file"
          {
            echo "[section] gomobile install (go-gui-pinned x/mobile revision)"
            if go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261117202452-47699113848a; then
              echo "gomobile: installed"
              echo "[section] simulator .app build attempt"
              if CGO_ENABLED=1 gomobile build -target ios -o /tmp/app-gogui-sim.app ./cmd/app-gogui; then
                echo "simulator .app build: OK"
                ls -la /tmp/app-gogui-sim.app
                echo "TEST_PACKAGE_READY_BUILD_ONLY" > "$status_file"
                echo "[section] simulator install/launch attempt (best-effort)"
                dev="$(xcrun simctl list devices available | grep -m1 'iPhone' | sed -E 's/^ *([^ ]+) \(/\1/' || true)"
                if [ -n "$dev" ]; then
                  echo "simulator device: $dev"
                  if xcrun simctl install "$dev" /tmp/app-gogui-sim.app; then
                    echo "simulator install: OK"
                    if xcrun simctl launch "$dev" com.parsaetak.sheytan-music-visualizer; then
                      echo "simulator launch: OK"
                      echo "EXPERIMENTAL_TEST_SIM_LAUNCHED" > "$status_file"
                      xcrun simctl terminate "$dev" com.parsaetak.sheytan-music-visualizer || true
                    else
                      echo "simulator launch: FAILED (recorded)"
                      echo "EXPERIMENTAL_TEST_FAILED" > "$status_file"
                    fi
                  else
                    echo "simulator install: FAILED (recorded)"
                    echo "EXPERIMENTAL_TEST_FAILED" > "$status_file"
                  fi
                else
                  echo "no available iPhone simulator runtime; install/launch UNAVAILABLE (recorded)"
                  echo "TEST_PACKAGE_READY_BUILD_ONLY" > "$status_file"
                fi
              else
                echo "simulator .app build: FAILED (recorded honestly)"
                echo "EXPERIMENTAL_TEST_FAILED" > "$status_file"
              fi
            else
              echo "gomobile: INSTALL FAILED (attempt recorded, never faked)"
              echo "BLOCKED_TOOLCHAIN" > "$status_file"
            fi
            echo "[section] device IPA path"
            echo "device IPA: BLOCKED_SIGNING_NOT_CONFIGURED (no authorized signing identity/provisioning profile in repository secrets; never faked)"
          } 2>&1 | "$CI_BIN/cisanitize" | tee ci-logs/ios-sim-attempt.log
          status="$(cat "$status_file")"
          printf '{\n  "gate": "ios-sim-attempt",\n  "status": "%s"\n}\n' "$status" > ci-logs/shell-sim-ios.json
          echo "ios simulator attempt status: $status"


      - name: Validate ASCII log contract (byte-level gate)
        if: always()
        run: |
          set -Eeuo pipefail
          go run ./cmd/civalidate ci-logs/*.log

      - name: Upload iOS log part
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-logs-part-attempt${{ github.run_attempt }}
          path: ci-logs
          if-no-files-found: error

  collect-logs:
    name: collect-logs (single consolidated report evidence)
    # always() so a failed build job still yields its report;
    # !cancelled() so a user-cancelled run does not start a pointless
    # collection. `needs` guarantees every evidence-producing job has
    # reached a TERMINAL state before this job starts — the collector
    # never observes an in_progress/pending job conclusion (a defensive
    # IN_PROGRESS classification still exists in the collector).
    needs: [preflight, build-windows, build-linux, build-macos, build-android, ios-compile-smoke]
    # if: always() - plain valid form (run 44449832903 repair). The
    # collector is the central always-runs job: it must execute after
    # success, failure, skip AND cancellation (while a runner remains
    # available) so it can report cancelled jobs and their missing
    # bundles instead of silently disappearing. `&& !cancelled()` is
    # deliberately NOT retained here: it would suppress the very report
    # needed after cancellation (latest-update override section A).
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      # actions:write is required ONLY to delete the temporary per-job
      # log-part artifacts after the consolidated report has been
      # validated and uploaded, so the run exposes exactly one
      # diagnostic artifact. It never changes job conclusions.
      actions: write
      # security-events:read lets the collector fetch open code
      # scanning alerts for the analyzed commit (best effort).
      security-events: read
    steps:
      - name: Checkout (collector source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap CI log directories (guaranteed evidence)
        run: bash scripts/ci/bootstrap-logs.sh

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false # cache policy: only build-linux/build-windows save caches

      - name: Download preflight log part
        id: download_preflight
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preflight-logs-part-attempt${{ github.run_attempt }}
          path: ci-parts/preflight-logs-part-attempt${{ github.run_attempt }}

      - name: Download Windows log part
        id: download_windows
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-logs-part-attempt${{ github.run_attempt }}
          path: ci-parts/windows-logs-part-attempt${{ github.run_attempt }}

      - name: Download Linux log part
        id: download_linux
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-logs-part-attempt${{ github.run_attempt }}
          path: ci-parts/linux-logs-part-attempt${{ github.run_attempt }}

      - name: Download macOS log part
        id: download_macos
        # Run 44449832903 annotation (former build-desktop.yml line 1154):
        # this condition used the malformed single-brace form
        # `if: ${ always() && !cancelled() }`, which is not a valid
        # GitHub Actions expression and made the whole workflow file fail
        # to parse (zero jobs ran). Repaired to the simplest valid form;
        # the three annotations are regression fixtures in
        # scripts/ci/tests/test-expression-syntax.sh.
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-logs-part-attempt${{ github.run_attempt }}
          path: ci-parts/macos-logs-part-attempt${{ github.run_attempt }}

      - name: Download Android log part
        id: download_android
        # Run 44449832903 annotation (former build-desktop.yml line 1163):
        # malformed single-brace `if: ${ always() && !cancelled() }`;
        # repaired like the macOS step above.
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-logs-part-attempt${{ github.run_attempt }}
          path: ci-parts/android-logs-part-attempt${{ github.run_attempt }}

      - name: Download iOS log part
        id: download_ios
        # Run 44449832903 annotation (former build-desktop.yml line 1172):
        # malformed single-brace `if: ${ always() && !cancelled() }`;
        # repaired like the macOS step above.
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-logs-part-attempt${{ github.run_attempt }}
          path: ci-parts/ios-logs-part-attempt${{ github.run_attempt }}

      - name: Write run manifest
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUNNER_OS_LABEL: ${{ runner.os }}
          STARTED_AT: ${{ github.run_started_at }}
          RESULT_PREFLIGHT: ${{ needs.preflight.result }}
          RESULT_WINDOWS: ${{ needs.build-windows.result }}
          RESULT_LINUX: ${{ needs.build-linux.result }}
          RESULT_MACOS: ${{ needs.build-macos.result }}
          RESULT_ANDROID: ${{ needs.build-android.result }}
          RESULT_IOS: ${{ needs.ios-compile-smoke.result }}
          DOWNLOAD_PREFLIGHT: ${{ steps.download_preflight.outcome }}
          DOWNLOAD_WINDOWS: ${{ steps.download_windows.outcome }}
          DOWNLOAD_LINUX: ${{ steps.download_linux.outcome }}
          DOWNLOAD_MACOS: ${{ steps.download_macos.outcome }}
          DOWNLOAD_ANDROID: ${{ steps.download_android.outcome }}
          DOWNLOAD_IOS: ${{ steps.download_ios.outcome }}
        run: |
          set -Eeuo pipefail
          mkdir -p ci-parts
          {
            echo "[section] per-artifact download outcomes"
            echo "preflight=${DOWNLOAD_PREFLIGHT:-not-run}"
            echo "windows=${DOWNLOAD_WINDOWS:-not-run}"
            echo "linux=${DOWNLOAD_LINUX:-not-run}"
            echo "macos=${DOWNLOAD_MACOS:-not-run}"
            echo "android=${DOWNLOAD_ANDROID:-not-run}"
            echo "ios=${DOWNLOAD_IOS:-not-run}"
            echo "(CodeQL is an independent workflow; its artifacts are neither downloaded nor consolidated here)"
            echo "[section] downloaded evidence tree"
            find ci-parts -maxdepth 4 -type f -printf '%P\n' | sort || true
          } | tee ci-parts/download-diagnostics.txt
          # Deterministic manifest via scripts/ci/write-manifest.py (stdlib
          # json, env-only inputs, temp-file + fsync + atomic rename, self-
          # validated, diagnostics emitted). Run-42376176493 root cause: the
          # previous jq-only writer left a ZERO-BYTE manifest.json behind
          # when jq was unavailable on the runner (the `>` redirect creates
          # the file before jq runs), the collector's `[ -s ]` guard
          # correctly refused (rc=2), and the emergency fallback published
          # environment-derived results with coverage UNVERIFIED. jq is no
          # longer load-bearing anywhere in this step; a missing tool can
          # no longer produce a plausible-but-empty manifest.
          command -v python3 >/dev/null 2>&1 || {
            echo "ERROR: python3 not found on PATH — manifest cannot be written; failing closed instead of leaving an empty manifest"
            exit 127
          }
          python3 scripts/ci/write-manifest.py --profile caller --out ci-parts/manifest.json
          echo "final manifest check: $(wc -c < ci-parts/manifest.json) bytes, path $PWD/ci-parts/manifest.json"
          test -s ci-parts/manifest.json || { echo "ERROR: manifest missing or empty after validated write (unreachable fail-closed)"; exit 1; }

      # Run even after setup-go fails; the rc is recorded so the emergency
      # non-Go fallback can still publish a truthful report.
      - name: Build collector binary
        if: always()
        run: |
          set -Eeuo pipefail
          mkdir -p bin ci-logs
          rc=0
          go build -trimpath -o bin/ci-log-collector ./cmd/ci-log-collector || rc=$?
          printf '%s\n' "$rc" > collector-build.rc
          {
            echo "command: go build -trimpath -o bin/ci-log-collector ./cmd/ci-log-collector"
            echo "exit_code: $rc"
            date -u '+utc=%Y-%m-%dT%H:%M:%SZ'
          } | tee ci-logs/collector-build.log
          if [ "$rc" -ne 0 ]; then
            echo "ERROR: collector binary build failed (rc=$rc); the emergency fallback path will still produce a truthful consolidated report"
          fi
          exit "$rc"

      - name: Run collector (report is written even when coverage is incomplete)
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p ci-out ci-logs
          rc=2
          if [ -x bin/ci-log-collector ] && [ -s ci-parts/manifest.json ]; then
            # Verbatim stdout/stderr capture with the ORIGINAL exit code
            # preserved (no pipeline masking): collector-run.log records
            # command, cwd, absolute manifest path, byte count, UTC window
            # and rc, then the collector's own output, unmodified.
            cap="$(mktemp)"
            start_utc="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            ./bin/ci-log-collector \
              --report ci-out/SHEYTAN-Music-Visualizer-all-logs.txt \
              --parts-root ci-parts \
              --manifest ci-parts/manifest.json \
              --github-repo "${GITHUB_REPOSITORY}" \
              --run-id "${GITHUB_RUN_ID}" \
              --attempt "${GITHUB_RUN_ATTEMPT}" >"$cap" 2>&1
            rc=$?
            end_utc="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            {
              echo "command: ./bin/ci-log-collector --report ci-out/SHEYTAN-Music-Visualizer-all-logs.txt --parts-root ci-parts --manifest ci-parts/manifest.json --github-repo ${GITHUB_REPOSITORY} --run-id ${GITHUB_RUN_ID} --attempt ${GITHUB_RUN_ATTEMPT}"
              echo "cwd: $PWD"
              echo "manifest_path_absolute: $PWD/ci-parts/manifest.json"
              echo "manifest_bytes: $(wc -c < ci-parts/manifest.json)"
              echo "report_path_absolute: $PWD/ci-out/SHEYTAN-Music-Visualizer-all-logs.txt"
              echo "run_id: ${GITHUB_RUN_ID} attempt: ${GITHUB_RUN_ATTEMPT}"
              echo "started_utc: $start_utc"
              echo "ended_utc: $end_utc"
              echo "collector_rc: $rc (0=complete, 1=incomplete coverage, 2=hard error, 3=required job failed)"
              echo "[verbatim] collector stdout+stderr follows"
              cat "$cap"
            } | tee ci-logs/collector-run.log
            rm -f "$cap"
          else
            # Precise diagnosis instead of one combined message (the
            # run-42376176493 fallback could only say "missing or empty").
            build_rc="$(cat collector-build.rc 2>/dev/null || echo unknown)"
            if [ ! -x bin/ci-log-collector ]; then
              diag="collector binary missing/not executable at $PWD/bin/ci-log-collector (build rc=$build_rc)"
            elif [ ! -e ci-parts/manifest.json ]; then
              diag="manifest file absent: $PWD/ci-parts/manifest.json (the manifest step did not create it)"
            else
              diag="manifest file EMPTY (0 bytes): $PWD/ci-parts/manifest.json (the manifest writer failed after file creation; see manifest-diagnostics.txt)"
            fi
            {
              echo "BLOCKED: collector cannot run — $diag"
              echo "collector_build_rc=$build_rc"
              echo "the emergency fallback report step will write the consolidated report; the job still fails closed"
            } | tee ci-logs/collector-run.log
            rc=2
          fi
          echo "$rc" > collector.rc
          echo "collector exit code: $rc (0=green, 1=incomplete coverage, 3=required job failed, 2=hard error)"
          exit 0

      - name: Emergency fallback report (collector binary unavailable or hard-failed)
        if: always()
        env:
          RESULT_PREFLIGHT: ${{ needs.preflight.result }}
          RESULT_WINDOWS: ${{ needs.build-windows.result }}
          RESULT_LINUX: ${{ needs.build-linux.result }}
        run: |
          set -Eeuo pipefail
          mkdir -p ci-out ci-parts ci-logs
          report=ci-out/SHEYTAN-Music-Visualizer-all-logs.txt
          # Run-45042834040 repair: a ZERO-BYTE report from a collector
          # that exited 0 is a VALID "zero diagnostics" report (the record
          # contract says clean runs produce an empty file), not a missing
          # report. Without this, a fully green run would fail its own
          # collection job on the empty-report contract mismatch.
          rc="$(cat collector.rc 2>/dev/null || echo 2)"
          if [ -f "$report" ] && [ "$rc" = "0" ]; then
            echo "collector report present (0 bytes = zero diagnostics is valid); emergency fallback not needed"
            exit 0
          fi
          if [ -s "$report" ]; then
            echo "collector report present and non-empty; emergency fallback not needed"
            exit 0
          fi
          reason="collector rc=$(cat collector.rc 2>/dev/null || echo unknown); build rc=$(cat collector-build.rc 2>/dev/null || echo unknown)"
          bash scripts/ci/emergency-report.sh \
            --out ci-out/SHEYTAN-Music-Visualizer-all-logs.txt \
            --parts-root ci-parts \
            --manifest ci-parts/manifest.json \
            --reason "$reason" \
            --result-preflight "${RESULT_PREFLIGHT:-unknown}" \
            --result-build-windows "${RESULT_WINDOWS:-unknown}" \
            --result-build-linux "${RESULT_LINUX:-unknown}"
          printf 'used\n' > collector-fallback.used

      - name: Validate the final consolidated report before upload
        id: validate_report
        if: always()
        run: |
          set -Eeuo pipefail
          report=ci-out/SHEYTAN-Music-Visualizer-all-logs.txt
          test -f "$report" || { echo "ERROR: consolidated report missing"; exit 1; }
          rc="$(cat collector.rc 2>/dev/null || echo 2)"
          size=$(stat -c%s "$report")
          if [ "$size" -eq 0 ] && { [ "$rc" != "0" ] || [ -f collector-fallback.used ]; }; then
            echo "ERROR: consolidated report is empty but collector rc=$rc (fallback used: $([ -f collector-fallback.used ] && echo yes || echo no))"
            exit 1
          fi
          test "$(find ci-out -maxdepth 1 -type f | wc -l)" -eq 1 || { echo "ERROR: ci-out must contain exactly one file (the consolidated report)"; exit 1; }
          echo "consolidated report validated: $size bytes (collector rc=$rc; empty = zero diagnostics is valid)"
          # Direct-delivery contract: the artifact must be PLAIN TEXT —
          # never a ZIP. A ZIP signature (PK\x03\x04) here would mean
          # the consolidated report got wrapped and the direct
          # direct-download contract is broken.
          sig=$(head -c 2 ci-out/SHEYTAN-Music-Visualizer-all-logs.txt)
          if [ "$sig" = $'PK\x03\x04' ] || [ "$sig" = "PK" ]; then
            echo "ERROR: the consolidated report carries a ZIP signature — plain-text contract violated"
            exit 1
          fi
          head -3 ci-out/SHEYTAN-Music-Visualizer-all-logs.txt

      - name: Upload the single consolidated diagnostics artifact (plain text, no outer ZIP)
        id: upload_report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHEYTAN-Music-Visualizer-all-logs.txt
          path: ci-out/SHEYTAN-Music-Visualizer-all-logs.txt
          # archive: false uploads the single file DIRECTLY: the
          # downloaded artifact is plain text (UTF-8), not a
          # ZIP containing the report. Exactly one file path is supplied;
          # in this mode the artifact is named after the file's
          # basename (SHEYTAN-Music-Visualizer-all-logs.txt) and the name input is ignored.
          archive: false
          if-no-files-found: error
          overwrite: true

      - name: Record final artifact identity (upload outcome evidence)
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.upload_report.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload_report.outputs.artifact-url }}
        run: |
          set -Eeuo pipefail
          {
            echo "final consolidated artifact upload outcome:"
            echo "  artifact_id=${ARTIFACT_ID:-not-reported}"
            echo "  artifact_url=${ARTIFACT_URL:-not-reported}"
            echo "  delivery_mode=direct (archive: false; downloaded artifact is plain text)"
            date -u '+  uploaded_utc=%Y-%m-%dT%H:%M:%SZ'
          } | tee ci-logs/final-artifact.txt
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### Consolidated diagnostics artifact"
              echo "- Artifact: SHEYTAN-Music-Visualizer-all-logs.txt (warning/error records only; strict ASCII/LF; plain text, non-archived direct upload)"
              echo "- artifact id: ${ARTIFACT_ID:-not-reported}"
              echo "- [download URL](${ARTIFACT_URL:-not-reported})"
              # Gate table excerpt (run-42921967187 §5.I): surface the
              # report's own parsed gate section on the run page. The
              # report remains the authoritative, complete evidence; a
              echo ""
              echo "### Run summary (metadata home; the final artifact is warning/error records only)"
              echo ""
              echo '```'
              if [ -f ci-out/SHEYTAN-run-summary.txt ]; then
                cat ci-out/SHEYTAN-run-summary.txt
              else
                echo "(collector summary absent - the collector hard-errored; no metadata is fabricated here)"
              fi
              echo '```' 
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Delete temporary log-part artifacts (single-artifact guarantee)
        id: cleanup_artifacts
        # Justified exception to the always() collection contract
        # (latest-update override section A: "For ordinary cleanup steps
        # that must not run after cancellation, use a separately justified
        # valid condition"): deleting per-job log-part artifacts after a
        # user cancellation is pointless, and this braced form is the
        # exact valid `${{ expression }}` syntax. The collector job
        # itself still runs after cancellation via `if: always()`.
        if: ${{ always() && !cancelled() && steps.validate_report.outcome == 'success' && steps.upload_report.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cleanup_failed=0
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          if ! curl -sfL --retry 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}?per_page=100" -o "$tmp"; then
            echo "ERROR: could not list artifacts for cleanup; temporary log-part artifacts may remain visible."
            cleanup_failed=1
          elif ! jq -e '.artifacts | type == "array"' "$tmp" >/dev/null; then
            echo "ERROR: artifact-list API response was not a valid artifacts array."
            cleanup_failed=1
          else
            ids=$(jq -r '.artifacts[]? | select(.name != "SHEYTAN-Music-Visualizer-all-logs.txt") | select((.name | test("-logs-part(-attempt[0-9]+)?$")) or (.name == "consolidated-run-log")) | .id' "$tmp")
            for id in $ids; do
              url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
              if curl -sf -X DELETE \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$url"; then
                echo "deleted temporary artifact ${id}"
              else
                echo "ERROR: deleting artifact ${id} failed; it may remain visible."
                cleanup_failed=1
              fi
            done
          fi
          if [ "$cleanup_failed" -ne 0 ]; then
            : > cleanup.failed
            echo "ERROR: temporary-artifact cleanup incomplete; the final gate will fail closed."
          fi

      - name: Record collection health (upstream verdicts move to the final-verdict job)
        if: always()
        run: |
          rc="$(cat collector.rc 2>/dev/null || echo 2)"
          if [ -f collector-fallback.used ]; then
            echo "EMERGENCY FALLBACK REPORT WAS USED: consolidated coverage is unverified;"
            echo "the collecting job fails even though a truthful consolidated report was uploaded."
            if [ "$rc" -eq 0 ]; then rc=1; fi
          fi
          if [ -f cleanup.failed ] && [ "$rc" = "0" ]; then
            echo "Temporary artifact cleanup failed after the report upload; the single-artifact guarantee is not met."
            rc=1
          fi
          echo "collector exit code: $rc (0=green, 1=incomplete coverage, 3=required job failed, 2=hard error)"
          # Run-43541087097 verdict separation: the collector job's OWN
          # conclusion reports COLLECTION health only. rc=3 means the
          # report was produced and uploaded while an UPSTREAM required
          # job failed — the upstream failure is reported to the user by
          # the dedicated final-verdict job below (and by the build-*
          # jobs' own red X), so failing HERE too only made the
          # evidence-collection work look broken. rc=1/2 still fail this
          # job: the consolidated report itself is incomplete.
          if [ "$rc" = "3" ]; then
            echo "Consolidated report uploaded; upstream required-job failure is reported by the final-verdict job."
            exit 0
          fi
          if [ "$rc" != "0" ]; then
            if [ "$rc" = "1" ]; then
              echo "Consolidated log coverage is INCOMPLETE; failing this job after the report upload."
            else
              echo "Collector failed; the run must stay red."
            fi
          fi
          exit "$rc"

  # Run-43541087097 verdict separation: ONE dedicated user-facing gate
  # that fails closed when any required evidence-producing job did not
  # succeed. collect-logs stays green exactly when the consolidated
  # report was produced and uploaded, so a red collector always means a
  # COLLECTION problem (actionable), never an upstream test/build
  # failure (reported by the failing job itself and here).
  publish-products:
    # PRIORITY-B: the ONE workflow-wide product publisher. Platform jobs
    # only produce internal candidates; this job is the only place a
    # final public artifact name is ever attached. It runs ONLY when
    # every required platform job and the diagnostics collection
    # succeeded - a red run publishes ONLY the diagnostics artifact.
    name: publish-products (single final publisher)
    needs: [preflight, build-windows, build-linux, build-macos, build-android, collect-logs]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' && needs.build-macos.result == 'success' && needs.build-android.result == 'success' && needs.collect-logs.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout (publisher source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the Windows candidate package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-candidate-attempt${{ github.run_attempt }}
          path: candidates/

      - name: Download the Linux candidate package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-candidate-attempt${{ github.run_attempt }}
          path: candidates/

      - name: Download the macOS candidate package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-candidate-attempt${{ github.run_attempt }}
          path: candidates/

      - name: Download the Android candidate package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-candidate-attempt${{ github.run_attempt }}
          path: candidates/

      - name: Re-validate every candidate and stage the final names
        run: |
          set -Eeuo pipefail
          fail=0
          find candidates -type f -printf '%P %s bytes\n' | sort
          echo "[section] re-validation"
          wz="candidates/SHEYTAN-Music-Visualizer-windows-x64.zip"
          lt="candidates/SHEYTAN-Music-Visualizer-linux-x64.tar.gz"
          mt="candidates/SHEYTAN-Music-Visualizer-macos-arm64.app.zip"
          at="candidates/SHEYTAN-Music-Visualizer-android-arm64.apk"
          python3 scripts/ci/validate-candidates.py "$wz" "$lt" "$mt" "$at" || fail=1
          if [ "$fail" -ne 0 ]; then
            echo "PUBLICATION REFUSED: candidates invalid; a failed run publishes ONLY the diagnostics artifact."
            exit 1
          fi
          mkdir -p final
          cp "$wz" final/SHEYTAN-Music-Visualizer-windows-x64.zip
          cp "$lt" final/SHEYTAN-Music-Visualizer-linux-x64.tar.gz
          cp "$mt" final/SHEYTAN-Music-Visualizer-macos-arm64.app.zip
          cp "$at" final/SHEYTAN-Music-Visualizer-android-arm64.apk

      - name: Publish the Windows x64 product
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHEYTAN-Music-Visualizer-windows-x64.zip
          path: final/SHEYTAN-Music-Visualizer-windows-x64.zip
          archive: false
          if-no-files-found: error
          overwrite: true

      - name: Publish the Linux x64 product
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHEYTAN-Music-Visualizer-linux-x64.tar.gz
          path: final/SHEYTAN-Music-Visualizer-linux-x64.tar.gz
          archive: false
          if-no-files-found: error
          overwrite: true

      - name: Publish the macOS arm64 product
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHEYTAN-Music-Visualizer-macos-arm64.app.zip
          path: final/SHEYTAN-Music-Visualizer-macos-arm64.app.zip
          archive: false
          if-no-files-found: error
          overwrite: true

      - name: Publish the Android arm64 product
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHEYTAN-Music-Visualizer-android-arm64.apk
          path: final/SHEYTAN-Music-Visualizer-android-arm64.apk
          archive: false
          if-no-files-found: error
          overwrite: true

      - name: Record the publication outcome
        if: always()
        run: |
          {
            echo "publisher outcome: four final product artifacts published (Windows ZIP, Linux tar.gz, macOS app.zip, Android APK)."
            echo "On any earlier failure this job is skipped and ONLY the diagnostics artifact remains (by design)."
            date -u '+published_utc=%Y-%m-%dT%H:%M:%SZ'
          } | tee ci-logs/publish-products.log

  cleanup-internal:
    # PRIORITY-B: the cleanup job runs even when publication was skipped
    # or failed, and removes every temporary artifact (candidates AND
    # per-job log parts). The final diagnostics artifact always remains.
    # A cleanup failure makes the final verdict RED.
    name: cleanup-internal (temporary artifacts removed)
    needs: [collect-logs, publish-products]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Delete every temporary artifact (candidates and log parts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cleanup_failed=0
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          if ! curl -sfL --retry 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}?per_page=100" -o "$tmp"; then
            echo "ERROR: could not list artifacts for cleanup; temporary artifacts may remain visible."
            cleanup_failed=1
          elif ! jq -e '.artifacts | type == "array"' "$tmp" >/dev/null; then
            echo "ERROR: artifact-list API response was not a valid artifacts array."
            cleanup_failed=1
          else
            ids=$(jq -r '.artifacts[]? | select(.name != "SHEYTAN-Music-Visualizer-all-logs.txt") | select(.name != "SHEYTAN-Music-Visualizer-windows-x64.zip") | select(.name != "SHEYTAN-Music-Visualizer-linux-x64.tar.gz") | select(.name != "SHEYTAN-Music-Visualizer-macos-arm64.app.zip") | select(.name != "SHEYTAN-Music-Visualizer-android-arm64.apk") | .id' "$tmp")
            for id in $ids; do
              url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
              if curl -sf -X DELETE \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$url"; then
                echo "deleted temporary artifact ${id}"
              else
                echo "ERROR: deleting artifact ${id} failed; it may remain visible."
                cleanup_failed=1
              fi
            done
          fi
          if [ "$cleanup_failed" -ne 0 ]; then
            echo "ERROR: temporary-artifact cleanup incomplete; the final verdict is RED by contract."
            exit 1
          fi
          echo "cleanup complete: only the diagnostics artifact and (on green runs) the four final products remain."

  final-verdict:
    name: final-verdict (all required gates must be green)
    needs: [preflight, build-windows, build-linux, build-macos, build-android, ios-compile-smoke, collect-logs, publish-products, cleanup-internal]
    # Braced valid form, deliberately kept for cancellation (latest-update
    # override section A justification): after a user cancellation the
    # collector (if: always()) has already recorded every cancelled job
    # and missing bundle in the consolidated report, so a verdict job
    # start would add no evidence. This is the exact ${{ }} syntax; the
    # malformed single-brace form is impossible here and is rejected by
    # scripts/ci/tests/test-expression-syntax.sh.
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 5
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Fail closed unless every required gate succeeded
        run: |
          set -Eeuo pipefail
          failed=0
          # Run 43612608237 red-gate repair: the former step interpolated
          # a SHELL loop variable named `job` as a needs map key (the
          # broken form was `needs[ <loop-var> ].result` inside a GitHub
          # Actions expression) — actionlint correctly resolved `job` to
          # the GitHub Actions `job` CONTEXT OBJECT and rejected the
          # object used where a string `needs` map key is required
          # (build-desktop.yml:1186). Expression interpolation also runs
          # ONCE when the step script is generated, so a dynamic loop key
          # can never yield per-iteration results. Each required gate's
          # result is therefore selected through a literal scalar key in
          # this case dispatch; the loop variable is renamed `gate` so it
          # cannot shadow any Actions context name.
          # scripts/ci/tests/test-verdict-expression.sh asserts this
          # shape statically for every workflow file in preflight.
          # PRIORITY-B FINAL VERDICT CONTRACT: every REQUIRED gate must
          # have succeeded, every required package must have been
          # published by the single workflow-wide publisher, and the
          # internal-artifact cleanup must have completed. A skipped or
          # blocked required gate is not a pass; if: always() on the
          # verdict only guarantees the truthful report, never success.
          # REQUIRED: preflight, build-windows, build-linux, build-macos,
          # build-android (real arm64 APK), collect-logs,
          # publish-products, cleanup-internal. INFORMATIONAL:
          # ios-compile-smoke (compile smoke only; no product package).
          for gate in preflight build-windows build-linux build-macos build-android ios-compile-smoke collect-logs publish-products cleanup-internal; do
            case "$gate" in
              preflight)         result="${{ needs.preflight.result }}" ;;
              build-windows)     result="${{ needs.build-windows.result }}" ;;
              build-linux)       result="${{ needs.build-linux.result }}" ;;
              build-macos)       result="${{ needs.build-macos.result }}" ;;
              build-android)     result="${{ needs.build-android.result }}" ;;
              ios-compile-smoke) result="${{ needs.ios-compile-smoke.result }}" ;;
              collect-logs)      result="${{ needs.collect-logs.result }}" ;;
              publish-products)  result="${{ needs.publish-products.result }}" ;;
              cleanup-internal)  result="${{ needs.cleanup-internal.result }}" ;;
              *)                 result="unknown" ;;
            esac
            echo "${gate}: ${result}"
            if [ "$gate" = "ios-compile-smoke" ]; then
              if [ "$result" != "success" ]; then
                echo "::warning title=Informational gate ${gate} did not succeed::result=${result} - the iOS compile smoke is non-required and claims no product package; the result is reported truthfully in the run summary"
              fi
              continue
            fi
            if [ "$result" != "success" ]; then
              echo "::error title=Required gate ${gate} did not succeed::result=${result} - see the ${gate} job log and the diagnostics artifact SHEYTAN-Music-Visualizer-all-logs.txt"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "FINAL VERDICT: RED - one or more required gates failed; the diagnostics artifact was still collected and uploaded (see collect-logs)."
            exit 1
          fi
          echo "FINAL VERDICT: GREEN - preflight, all four product platforms, diagnostics, publication and cleanup are all green."
          echo "CodeQL runs as the independent codeql workflow (.github/workflows/codeql.yml); its results are reported there and do not gate this build."
